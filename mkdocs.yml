# The upgradescope docs site. .github/workflows/docs.yml builds it with
# --strict on every pull request (a broken link or anchor, or a page
# missing from the nav, fails it) and publishes it to GitHub Pages from
# main. Locally: `make docs` (build) or `make docs-serve` (live preview);
# both install the pinned toolchain in hack/docs/requirements.txt into a
# virtualenv under bin/.
#
# Generated pages (do not edit by hand): docs/reference/cli/, crd.md and
# api.md (make docs-gen), helm-values.md (make helm-docs).
site_name: upgradescope
site_url: https://abd-ulbasit.github.io/upgradescope/
site_description: "Kubernetes upgrade readiness: removed and deprecated APIs, end-of-life add-ons, version skew, as a verdict, a score, a CI gate and a ClusterReadiness object."
repo_url: https://github.com/abd-ulbasit/upgradescope
repo_name: abd-ulbasit/upgradescope
edit_uri: edit/main/docs/
copyright: Apache-2.0

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - content.tabs.link
    - search.suggest

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true

