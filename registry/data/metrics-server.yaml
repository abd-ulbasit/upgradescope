# registry/data/metrics-server.yaml
schema_version: 2
id: metrics-server
display_name: Kubernetes Metrics Server
matchers:
  images:
    - metrics-server/metrics-server
    - kubernetes-sigs/metrics-server # public.ecr.aws/eks-distro/kubernetes-sigs/metrics-server, v<ms>-eks-<k8s>-<n>
    # AKS: Microsoft's builds, tagged v<ms> or v<ms>-<build>.
    - mcr.microsoft.com/oss/kubernetes/metrics-server
    - mcr.microsoft.com/oss/v2/kubernetes/metrics-server
    # GKE: Google's build, tagged v<ms>-gke.<n>. No release-line end dates, so
    # nothing here raises an upstream end of life for it.
    - gcr.io/gke-release/metrics-server
    - gke.gcr.io/metrics-server
    # RKE2 and k3s: Rancher's verbatim mirror, the upstream tag.
    - rancher/mirrored-metrics-server
    # Bitnami's rebuild, tagged <ms>-debian-12-r<n>.
    - bitnami/metrics-server
    - bitnamilegacy/metrics-server
  charts:
    - metrics-server
support:
  status: supported
  citations:
    - https://github.com/kubernetes-sigs/metrics-server#compatibility-matrix
