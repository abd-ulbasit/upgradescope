# registry/data/calico.yaml
# cycles are generated from the endoflife.date API by tools/eol-sync; do not
# edit them by hand. support is hand-curated: status eol is only for a
# product upstream retired as a whole.
schema_version: 2
id: calico
display_name: Calico
endoflife_product: calico
matchers:
  images:
    # Every calico/* image carries the Calico release as its tag;
    # tigera/operator does not (it has its own version line).
    - calico/node
    - calico/cni
    - calico/kube-controllers
    - calico/typha
    - calico/apiserver
    - calico/csi
    - calico/pod2daemon-flexvol
    # AKS network policy (mcr.microsoft.com/oss/calico/*, oss/v2/calico/*; tags
    # release-v<major.minor> or v<calico>-<build>) is deliberately not matched,
    # like AKS Cilium in cilium.yaml: Microsoft's build under AKS's support
    # policy, not judged by upstream's release-line dates (#18).
    # RKE2: Rancher's verbatim mirrors (Docker Hub), the upstream tag.
    - rancher/mirrored-calico-node
    - rancher/mirrored-calico-cni
    - rancher/mirrored-calico-typha
    - rancher/mirrored-calico-kube-controllers
  charts:
    - tigera-operator
support:
  status: supported
  citations:
    - https://endoflife.date/calico
    - https://docs.tigera.io/calico/latest/getting-started/kubernetes/requirements
cycles:
  - {cycle: "3.33", eol: false, citations: ["https://endoflife.date/calico"]}
  - {cycle: "3.32", eol: false, citations: ["https://endoflife.date/calico"]}
  - {cycle: "3.31", eol: "2026-10-01", citations: ["https://endoflife.date/calico"]}
  - {cycle: "3.30", eol: "2026-04-30", citations: ["https://endoflife.date/calico"]}
  - {cycle: "3.29", eol: "2025-10-21", citations: ["https://endoflife.date/calico"]}
  - {cycle: "3.28", eol: "2025-05-05", citations: ["https://endoflife.date/calico"]}
  - {cycle: "3.27", eol: "2024-10-29", citations: ["https://endoflife.date/calico"]}
  - {cycle: "3.26", eol: "2024-05-11", citations: ["https://endoflife.date/calico"]}
  - {cycle: "3.25", eol: "2023-12-15", citations: ["https://endoflife.date/calico"]}
# Kubernetes minimums, kept apart from `cycles` so that tools/eol-sync never
# drops them (CONTRIBUTING, "Compatibility ranges on synced entries"). Read on
# 2026-10-10 from each release's own "System requirements for Kubernetes" page
# (docs.tigera.io/calico/<major.minor>/getting-started/kubernetes/requirements).
# Each page lists the Kubernetes versions "we test Calico against" and says
# "Other versions may work, but we are not actively testing them": a tested-with
# list, so no maximum is recorded. 3.25 to 3.32 also say Calico "will not work"
# on Kubernetes below a version, which is a minimum upstream states:
#   3.25 will not work on v1.15 or below (v1.16-v1.18 may work, untested) -> 1.16
#   3.26 to 3.32 will not work on v1.20 or below (v1.21 may work, untested) -> 1.21
# 3.33 states no minimum. Tested with, for the record: 3.25 1.23-1.28, 3.26
# 1.24-1.28, 3.27 1.27-1.29, 3.28 1.27-1.30, 3.29 1.29-1.32, 3.30 1.31-1.35,
# 3.31 1.32-1.35, 3.32 1.34-1.36, 3.33 1.35-1.37. A forward-upgrade scan
# cannot trip a minimum; one with a target below it can.
compat:
  - {range: ">=3.25.0 <3.26.0", k8s_min: "1.16", citations: ["https://docs.tigera.io/calico/3.25/getting-started/kubernetes/requirements"]}
  - {range: ">=3.26.0 <3.27.0", k8s_min: "1.21", citations: ["https://docs.tigera.io/calico/3.26/getting-started/kubernetes/requirements"]}
  - {range: ">=3.27.0 <3.28.0", k8s_min: "1.21", citations: ["https://docs.tigera.io/calico/3.27/getting-started/kubernetes/requirements"]}
  - {range: ">=3.28.0 <3.29.0", k8s_min: "1.21", citations: ["https://docs.tigera.io/calico/3.28/getting-started/kubernetes/requirements"]}
  - {range: ">=3.29.0 <3.30.0", k8s_min: "1.21", citations: ["https://docs.tigera.io/calico/3.29/getting-started/kubernetes/requirements"]}
  - {range: ">=3.30.0 <3.31.0", k8s_min: "1.21", citations: ["https://docs.tigera.io/calico/3.30/getting-started/kubernetes/requirements"]}
  - {range: ">=3.31.0 <3.32.0", k8s_min: "1.21", citations: ["https://docs.tigera.io/calico/3.31/getting-started/kubernetes/requirements"]}
  - {range: ">=3.32.0 <3.33.0", k8s_min: "1.21", citations: ["https://docs.tigera.io/calico/3.32/getting-started/kubernetes/requirements"]}
