# registry/data/providers/aks.yaml
# Azure Kubernetes Service: when each Kubernetes minor leaves community
# support (standard_end) and when Long Term Support ends (extended_end). The
# `versions` block is generated from the endoflife.date API by
# tools/eol-sync; do not edit it by hand.
#
# No price: AKS's LTS needs the Premium tier and the Microsoft pages defer to
# the pricing page, whose rates render client-side (the fetched page shows
# "$-"), so no number is stated that this file can cite. The delta would also
# depend on the tier a cluster is on today. AKS also has no automatic extended
# support: without LTS an out-of-support cluster is in reduced "platform
# support". Where the source gives only a month, the date is its last day.
schema_version: 1
id: aks
display_name: Azure Kubernetes Service
endoflife_product: azure-kubernetes-service
extended_support_note: AKS has no automatic extended support. Past community support a cluster is in platform support (Azure and AKS platform issues only, no Kubernetes fixes) unless Long Term Support is enabled, which needs the Premium tier.
citations:
