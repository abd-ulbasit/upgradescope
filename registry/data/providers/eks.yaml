# registry/data/providers/eks.yaml
# Amazon EKS: when each Kubernetes minor leaves standard support and when
# extended support ends. The `versions` block is generated from the
# endoflife.date API by tools/eol-sync; do not edit it by hand. The price is
# entered by hand from AWS's pricing page.
#
# AWS: "Billing for extended support starts at the beginning of the day that
# the version reaches end of standard support, in the UTC+0 timezone", so a
# minor is in extended support from standard_end, not the day after.
schema_version: 1
id: eks
display_name: Amazon EKS
endoflife_product: amazon-eks
extended_support_note: Extended support is on by default and billed per cluster-hour; a cluster whose upgrade policy is STANDARD is upgraded automatically at the end of standard support instead.
citations:
  - https://docs.aws.amazon.com/eks/latest/userguide/kubernetes-versions.html
  - https://endoflife.date/amazon-eks
pricing:
  currency: USD
  standard_per_cluster_hour: 0.10
  # "$0.60 per cluster per hour (Standard Kubernetes version support + $0.50
  # per cluster per hour)": the whole price while in extended support.
  extended_per_cluster_hour: 0.60
  as_of: "2026-10-03"
  citations:
    - https://aws.amazon.com/eks/pricing/
