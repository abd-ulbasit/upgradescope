# registry/data/gatekeeper.yaml
# Release lines are synced from endoflife.date (make eol-sync). Gatekeeper
# "supports" the current and the previous major.minor release (its Release
# Management document); the Helm chart and the image share the version
# (appVersion v3.x.y).
#
# No Kubernetes range is recorded: Gatekeeper publishes no matrix, only a
# policy that it "is assumed to be compatible with the current Kubernetes
# Supported Versions" (Release_Management.md, read on 2026-10-10), a window
# that moves with Kubernetes rather than a range per Gatekeeper line.
schema_version: 2
id: gatekeeper
display_name: OPA Gatekeeper
endoflife_product: gatekeeper
matchers:
  images:
    - openpolicyagent/gatekeeper
    - openpolicyagent/gatekeeper-crds
  charts:
    - gatekeeper
support:
  status: supported
  citations:
    - https://endoflife.date/gatekeeper
    - https://github.com/open-policy-agent/gatekeeper/blob/master/docs/Release_Management.md#supported-releases
cycles:
  - {cycle: "3.23", eol: false, citations: ["https://endoflife.date/gatekeeper"]}
  - {cycle: "3.22", eol: false, citations: ["https://endoflife.date/gatekeeper"]}
  - {cycle: "3.21", eol: "2026-07-09", citations: ["https://endoflife.date/gatekeeper"]}
