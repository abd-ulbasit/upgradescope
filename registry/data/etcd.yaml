# registry/data/etcd.yaml
# cycles are generated from the endoflife.date API by tools/eol-sync; do not
# edit them by hand. support is hand-curated: status eol is only for a
# product upstream retired as a whole.
# Re-read 2026-10-12: the cycles match endoflife.date (make eol-check). etcd's
# branch_management.md says "We will keep fixing the backward-compatible bugs for
# the latest two stable releases"; endoflife.date carries 3.5 to 2027-07-08, later
# than that rule alone gives now that 3.7 exists, and that date is what is synced.
# It comes from etcd's own announcement (3.7 release plus one year):
# https://etcd.io/blog/2026/etcd-370-beta/
schema_version: 2
id: etcd
display_name: etcd
endoflife_product: etcd
matchers:
  images:
    # A one-segment matcher is an exact repository, so "etcd" alone would be
    # registry.k8s.io/etcd and nothing behind a mirror. "*/etcd" opts etcd
    # into matching its final segment under any registry host or prefix: the
    # upstream paths (registry.k8s.io/etcd and k8s.gcr.io/etcd, where kubeadm
    # pulls it, gcr.io/etcd-development/etcd, quay.io/coreos/etcd), the vendor
    # builds (bitnami/etcd, bitnamilegacy/etcd), the ECR pull-through cache
    # (registry-k8s-io/etcd) and a kubeadm imageRepository or Harbor proxy
    # cache (myregistry.corp/k8s/etcd). The name is distinctive enough for
    # that; the validator refuses the opt-in for generic names ("controller").
    - "*/etcd"
support:
  status: supported
  citations:
    - https://endoflife.date/etcd
    - https://etcd.io/docs/latest/op-guide/versioning/
cycles:
  - {cycle: "3.7", eol: false, citations: ["https://endoflife.date/etcd"]}
  - {cycle: "3.6", eol: false, citations: ["https://endoflife.date/etcd"]}
  - {cycle: "3.5", eol: "2027-07-08", citations: ["https://endoflife.date/etcd"]}
  - {cycle: "3.4", eol: "2026-06-01", citations: ["https://endoflife.date/etcd"]}
  - {cycle: "3.3", eol: "2021-10-15", citations: ["https://endoflife.date/etcd"]}
  - {cycle: "3.2", eol: "2021-03-28", citations: ["https://endoflife.date/etcd"]}
  - {cycle: "3.1", eol: "2018-10-10", citations: ["https://endoflife.date/etcd"]}
  - {cycle: "3.0", eol: "2017-01-20", citations: ["https://endoflife.date/etcd"]}
