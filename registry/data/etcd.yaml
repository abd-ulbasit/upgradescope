# registry/data/etcd.yaml
# cycles are generated from the endoflife.date API by tools/eol-sync; do not
# edit them by hand. support is hand-curated: status eol is only for a
# product upstream retired as a whole.
schema_version: 2
id: etcd
display_name: etcd
endoflife_product: etcd
matchers:
  images:
    # A one-segment matcher is an exact repository, not a mirror suffix, so
    # the other published paths are listed: gcr.io/etcd-development/etcd,
    # quay.io/coreos/etcd, bitnami/etcd. "etcd" itself is registry.k8s.io/etcd
    # (and k8s.gcr.io/etcd), where kubeadm pulls it.
    - etcd
    - etcd-development/etcd
    - coreos/etcd
    - bitnami/etcd
support:
  status: supported
  citations:
    - https://endoflife.date/etcd
    - https://etcd.io/docs/latest/op-guide/versioning/
