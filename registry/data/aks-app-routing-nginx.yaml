# registry/data/aks-app-routing-nginx.yaml
# Hand-curated: the managed NGINX of the AKS application routing add-on,
# Microsoft's build of ingress-nginx. Microsoft provides critical security
# patches for it "through November 2026", after upstream's March 2026
# retirement, so it is a separate product from upstream ingress-nginx (whose
# EOL verdict would be false here). The sources give a month, not a day:
# eol_date is the last day of that month.
#
# No Kubernetes compat rows: the application routing page
# (https://learn.microsoft.com/en-us/azure/aks/app-routing, read 2026-10-12)
# states no supported Kubernetes versions or NGINX-to-Kubernetes mapping. The
# add-on is managed by AKS and follows the cluster's AKS version, whose
# support is the managed-provider calendar (registry/data/providers/aks.yaml).
schema_version: 2
id: aks-app-routing-nginx
display_name: AKS application routing NGINX
matchers:
  images:
    # A provider build, so the matcher names its host (see CONTRIBUTING).
    - mcr.microsoft.com/oss/kubernetes/ingress/nginx-ingress-controller
support:
  status: supported
  eol_date: "2026-11-30"
  citations:
    - https://blog.aks.azure.com/2025/11/13/ingress-nginx-update
    - https://learn.microsoft.com/en-us/azure/aks/app-routing-nginx-to-gateway-api-migration
recommendation: Migrate to the application routing Gateway API implementation (see the AKS migration guide).
