# registry/data/kubernetes-dashboard.yaml
# Hand-curated: endoflife.date does not track it. The project is retired as a
# whole: its README says it "is now archived and no longer maintained due to
# lack of active maintainers" and points to Headlamp. eol_date is the day the
# owner archived the repository ("archived by the owner on Jan 21, 2026" on
# the repository page), which is also what `gh api` reports as archived=true.
# The v7+ chart has no appVersion (the chart version is the app version), so
# a Helm release is matched by chart name and the version comes from the
# image tags; it does not matter here, the whole product is retired.
# The metrics-scraper sidecars (kubernetesui/metrics-scraper and
# dashboard-metrics-scraper) are not matched: they carry their own version
# (1.0.8, 1.2.1), which would be reported as the Dashboard's, and every
# Dashboard install also runs one of the images below.
schema_version: 2
id: kubernetes-dashboard
display_name: Kubernetes Dashboard
matchers:
  images:
    - kubernetesui/dashboard # v2.x
    # v1.x, one repository per architecture on k8s.gcr.io (now
    # registry.k8s.io), gcr.io/google_containers before v1.8: v1.10.1's
    # recommended manifest runs k8s.gcr.io/kubernetes-dashboard-amd64:v1.10.1
    # (https://raw.githubusercontent.com/kubernetes/dashboard/v1.10.1/src/deploy/recommended/kubernetes-dashboard.yaml),
    # v1.6.3's gcr.io/google_containers/kubernetes-dashboard-amd64:v1.6.3.
    # The whole product is retired, the v1 line with it.
    - kubernetes-dashboard-amd64
    - kubernetes-dashboard-arm
    - kubernetes-dashboard-arm64
    - kubernetes-dashboard-ppc64le
    - kubernetes-dashboard-s390x
    - google_containers/kubernetes-dashboard-amd64
    - google_containers/kubernetes-dashboard-arm
    - google_containers/kubernetes-dashboard-arm64
    - google_containers/kubernetes-dashboard-ppc64le
    - google_containers/kubernetes-dashboard-s390x
    - kubernetesui/dashboard-api # v7+ chart
    - kubernetesui/dashboard-auth
    - kubernetesui/dashboard-web
  charts:
    - kubernetes-dashboard
support:
  status: eol
  eol_date: "2026-01-21"
  citations:
    - https://github.com/kubernetes-retired/dashboard
    - https://github.com/kubernetes-retired/dashboard/blob/master/README.md
recommendation: Migrate to Headlamp (kubernetes-sigs/headlamp, under SIG UI), the replacement the Dashboard README points to.
