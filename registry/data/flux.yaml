# registry/data/flux.yaml
# cycles are generated from the endoflife.date API by tools/eol-sync; do not
# edit them by hand. support is hand-curated: status eol is only for a
# product upstream retired as a whole.
#
# Where the end dates come from: Flux maintains "the most recent three
# minor releases" (https://fluxcd.io/flux/releases/), so a line ends when
# the third newer one ships: 2.5 on 2026-02-24 (v2.8.0) and 2.6 on
# 2026-06-30 (v2.9.0), the dates of those releases on
# https://github.com/fluxcd/flux2/releases, as endoflife.date has them.
# Flux v1 is "obsolete, no further releases or maintainer support" since
# November 1, 2022, when its repository was archived
# (https://fluxcd.io/flux/migration/timetable/); endoflife.date's 1.25 line
# ends 2022-11-02, and a v1 release older than 1.25 predates every line.
#
# No Kubernetes range is recorded: Flux publishes no per-release matrix
# (https://fluxcd.io/flux/releases/, read on 2026-10-10). It says its CLI and
# controllers "offer support for all Kubernetes versions supported upstream",
# that each release is tested against the latest Kubernetes minor, and that it
# cannot guarantee a release works on an end-of-life Kubernetes version. That
# is a policy relative to upstream's own support window, not a range per line.
schema_version: 2
id: flux
display_name: Flux
endoflife_product: flux
matchers:
  # Flux v1: the fluxd image's tag is the Flux release (1.25.4). It moved
  # from weaveworks/flux (quay.io until 1.12, docker.io from 1.13) to
  # fluxcd/flux: https://raw.githubusercontent.com/fluxcd/flux/1.12.0/deploy/flux-deployment.yaml
  # and https://raw.githubusercontent.com/fluxcd/flux/master/deploy/flux-deployment.yaml.
  images:
    - fluxcd/flux
    - weaveworks/flux
  charts:
    - flux2
  # Flux v2's controllers carry their own versions (source-controller
  # v1.5.0 in Flux 2.5.1, helm-controller v1.2.0), so they are component
  # images: each controller line maps to the one Flux line whose releases
  # ship it. The default controllers' rows were read from the install.yaml
  # of every v2.x.y release from v2.0.0 to v2.9.6 on 2026-10-09. source-
  # watcher was an extra component (flux install --components-extra) from
  # Flux 2.7 and is in install.yaml only from v2.8.7, so its rows come from
  # each release's "Components changelog" in the release notes (v2.7.0
  # lists source-watcher v2.0.0, v2.8.0 v2.1.0, v2.9.0 v2.2.1), checked
  # against install.yaml where it is there. No controller line ships in two
  # Flux lines. A controller line not listed here (a Flux release newer than
  # this table) reads as Flux with no version: add its row when Flux ships
  # it. Flux v2's pre-GA releases (0.x, 2020-2023, whose controllers were
  # all 0.x) are deliberately not mapped: they read as Flux with no
  # version, an info finding, rather than a guess at a line endoflife.date
  # does not list.
  components:
    - image: fluxcd/source-controller
      lines:
        - {component: "1.9", product: "2.9"}
        - {component: "1.8", product: "2.8"}
        - {component: "1.7", product: "2.7"}
        - {component: "1.6", product: "2.6"}
        - {component: "1.5", product: "2.5"}
        - {component: "1.4", product: "2.4"}
        - {component: "1.3", product: "2.3"}
        - {component: "1.2", product: "2.2"}
        - {component: "1.1", product: "2.1"}
        - {component: "1.0", product: "2.0"}
      citations: ["https://github.com/fluxcd/flux2/releases"]
    - image: fluxcd/kustomize-controller
      lines:
        - {component: "1.9", product: "2.9"}
        - {component: "1.8", product: "2.8"}
        - {component: "1.7", product: "2.7"}
        - {component: "1.6", product: "2.6"}
        - {component: "1.5", product: "2.5"}
        - {component: "1.4", product: "2.4"}
        - {component: "1.3", product: "2.3"}
        - {component: "1.2", product: "2.2"}
        - {component: "1.1", product: "2.1"}
        - {component: "1.0", product: "2.0"}
      citations: ["https://github.com/fluxcd/flux2/releases"]
    - image: fluxcd/helm-controller
      lines:
        - {component: "1.6", product: "2.9"}
        - {component: "1.5", product: "2.8"}
        - {component: "1.4", product: "2.7"}
        - {component: "1.3", product: "2.6"}
        - {component: "1.2", product: "2.5"}
        - {component: "1.1", product: "2.4"}
        - {component: "1.0", product: "2.3"}
        - {component: "0.37", product: "2.2"}
        - {component: "0.36", product: "2.1"}
        - {component: "0.35", product: "2.0"}
      citations: ["https://github.com/fluxcd/flux2/releases"]
    - image: fluxcd/notification-controller
      lines:
        - {component: "1.9", product: "2.9"}
