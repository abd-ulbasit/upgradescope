# registry/data/kyverno.yaml
# cycles are generated from the endoflife.date API by tools/eol-sync; do not
# edit them by hand. support is hand-curated: status eol is only for a
# product upstream retired as a whole.
#
# eol-sync: ignore-k8s-range
#
# No Kubernetes range is encoded. endoflife.date carries Kyverno's compatibility
# matrix as a range per cycle (supportedK8sVersions), read against the
# project's own docs on 2026-10-12, but the project describes it as what it
# tests, not as a limit. https://kyverno.io/docs/installation/releases/ gives
# "Kubernetes Versions Supported: v1.33 - v1.35" for v1.19 and says "Other
# Kubernetes versions may work, but are not tested and therefore no guarantees
# are made as to their full compatibility". The older "Compatibility Matrix"
# (columns "Kyverno Version", "Kubernetes Min", "Kubernetes Max"; for example
# 1.17.x 1.32-1.35 in src/content/docs/docs/installation/installation.md on
# kyverno/website branch release-1-17-0, 1.14.x 1.29-1.32 in
# content/en/docs/installation/_index.md on release-1-14-0, 1.11.x 1.25-1.28 in
# content/en/docs/Installation/_index.md on release-1-11-0) carries the same
# caveat: "Although prior versions may work, they are not tested and therefore
# no guarantees are made as to their full compatibility". A "Max" column under
# that sentence is the highest version Kyverno tests, not one it says fails, so
# by the rule in CONTRIBUTING ("Maximum, minimum or tested with") it is a
# tested-with table and encoding it would block an install that works. The
# directive above makes tools/eol-sync keep each cycle's end of life and drop
# the range endoflife.date copies.
