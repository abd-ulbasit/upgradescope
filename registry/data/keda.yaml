# registry/data/keda.yaml
# cycles are generated from the endoflife.date API by tools/eol-sync; do not
# edit them by hand. support is hand-curated: status eol is only for a
# product upstream retired as a whole.
#
# eol-sync: ignore-k8s-range
#
# No Kubernetes range is encoded. endoflife.date carries KEDA's "Kubernetes
# Compatibility" table (https://keda.sh/docs/latest/operate/cluster/, read on
# 2026-10-12: v2.21 1.34-1.36 down to v2.7 1.17-1.25) as a range per cycle, but
# the page says the table shows the Kubernetes versions *tested* for each
# release, that each release is "generally tested against N-2 Kubernetes minor
# versions at minimum", and that maintainers may test more "but there is no
# guarantee". By the rule in CONTRIBUTING ("Maximum, minimum or tested with")
# that is a tested-with table, not a stated maximum or minimum, and encoding it
# would block an install that works. The directive above makes tools/eol-sync
# keep each cycle's end of life and drop the range endoflife.date copies.
