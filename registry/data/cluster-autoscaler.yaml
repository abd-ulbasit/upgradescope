# registry/data/cluster-autoscaler.yaml
# Hand-curated: endoflife.date does not track it, and the project publishes no
# dated end of life per release line.
#
# No compat rows. The "Releases" section of the README
# (https://github.com/kubernetes/autoscaler/blob/a4f00a378b42142a3ae5c053192e7cdb10e0c03e/cluster-autoscaler/README.md#releases,
# read on 2026-10-12) pairs each Kubernetes minor with the Cluster Autoscaler
# minor of the same number (Kubernetes 1.35.x with CA 1.35.x, 1.34.x with 1.34.x,
# and so on back to 1.12; since Kubernetes 1.12 "versioning scheme was changed to
# match Kubernetes minor releases exactly"). It is a recommendation and a record
# of what was tested, not a bound: "We recommend using Cluster Autoscaler with the
# Kubernetes control plane ... version for which it was meant. The below
# combinations have been tested on GCP. We don't do cross version testing or
# compatibility testing in other environments. Some user reports indicate
# successful use of a newer version of Cluster Autoscaler with older clusters,
# however, there is always a chance that it won't work as expected." Nothing
# there says another pairing is unsupported, so the table is tested-with
# (registry/CONTRIBUTING.md, "Maximum, minimum or tested with"), and encoding
# k8s_max = the paired minor would raise a blocker the project does not state.
# The FAQ (cluster-autoscaler/FAQ.md, read the same day) gives no version rule
# beyond that, and neither does the AWS provider README.
#
# Lifecycle: "Bug fixes and Cloud Provider features ... will be continually
# backported into the supported release branches (n - 3, where n is the latest
# release)" (same README, "Schedule"). That is a rolling policy with no dates,
# so there are no cycles: an installed version gets the "no lifecycle data" info
# finding rather than an invented end of life.
#
# Provider-build images (GKE and AKS run the autoscaler as part of the managed
# control plane) are not matched. Bitnami's repositories are empty since 2025
# (bitnami/cluster-autoscaler has no tags; bitnamilegacy/ is the archive, checked
# 2026-10-12), so the matchers only recognise pinned references and mirrors.
# Images: registry.k8s.io/autoscaling/cluster-autoscaler (k8s.gcr.io before
# 2023), and k8s.gcr.io/cluster-autoscaler for the v1.2-v1.14 era
# (cluster-autoscaler-1.18.0's AWS example runs k8s.gcr.io/cluster-autoscaler:v1.14.7).
schema_version: 2
id: cluster-autoscaler
display_name: Cluster Autoscaler
matchers:
  images:
    - autoscaling/cluster-autoscaler
    - cluster-autoscaler # k8s.gcr.io/cluster-autoscaler, before the autoscaling/ path
    - bitnami/cluster-autoscaler
    - bitnamilegacy/cluster-autoscaler
  charts:
    - cluster-autoscaler
support:
  status: supported
  citations:
    - https://github.com/kubernetes/autoscaler/blob/a4f00a378b42142a3ae5c053192e7cdb10e0c03e/cluster-autoscaler/README.md#releases
    - https://github.com/kubernetes/autoscaler/blob/a4f00a378b42142a3ae5c053192e7cdb10e0c03e/cluster-autoscaler/FAQ.md
recommendation: Upgrade Cluster Autoscaler to the latest release of the new Kubernetes minor (CA 1.N.x for Kubernetes 1.N) together with the control plane; the project tests and recommends that pairing only.
