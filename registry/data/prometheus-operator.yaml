# registry/data/prometheus-operator.yaml
# Hand-curated: endoflife.date has no prometheus-operator product; status
# comes from the upstream compatibility document (prometheus-operator
# >= v0.84.0 requires Kubernetes >= 1.25; no upper bound is published, so
# no bounded compat row is recorded).
schema_version: 2
id: prometheus-operator
display_name: Prometheus Operator
matchers:
  images:
    - prometheus-operator/prometheus-operator
    - rancher/mirrored-prometheus-operator-prometheus-operator # Rancher Monitoring, the upstream tag
    # Bitnami's rebuild, tagged <po>-debian-12-r<n> (empty on bitnami/ since 2025).
    - bitnami/prometheus-operator
    - bitnamilegacy/prometheus-operator
  charts:
    - kube-prometheus-stack
    - prometheus-operator
support:
  status: supported
  citations:
    - https://github.com/prometheus-operator/prometheus-operator/blob/main/Documentation/getting-started/compatibility.md
