# registry/data/coredns.yaml
# No compat rows. The cited CoreDNS-k8s_version.md (read on 2026-10-12, at
# https://github.com/coredns/deployment/blob/c51361611fcd43c3c23b9a402f30b882c4d736bd/kubernetes/CoreDNS-k8s_version.md,
# newest row v1.33 with CoreDNS v1.12.0) lists the CoreDNS version kubeadm
# installs with each Kubernetes release and says it "should not be read as a
# recommendation for what version of CoreDNS to currently use": a default, not
# a support range. The Kubernetes docs page
# https://kubernetes.io/docs/tasks/administer-cluster/coredns/ (same day) states
# no CoreDNS version per Kubernetes release either: it points to that table and
# says only that the Kubernetes server must be v1.9 or later. CoreDNS defines
# no support window for its release lines either, so there are no cycles.
schema_version: 2
id: coredns
display_name: CoreDNS
matchers:
  images:
    - coredns/coredns # also matches public.ecr.aws/eks-distro/coredns/coredns (v<coredns>-eks-<k8s>-<n>)
    - eks/coredns # EKS add-on image, tagged v<coredns>-eksbuild.N
    # AKS: Microsoft's builds, tagged v<coredns>-<build> or v<coredns>-hotfix.<date>
    # (repositories read from mcr.microsoft.com's tag lists on 2026-10-10). Provider
    # builds, so they name their host (see CONTRIBUTING).
    - mcr.microsoft.com/oss/kubernetes/coredns
    - mcr.microsoft.com/oss/v2/kubernetes/coredns
    # RKE2 and k3s: Rancher's verbatim mirror, the upstream tag (docker.io/rancher).
    - rancher/mirrored-coredns-coredns
  charts:
    - coredns
support:
  status: supported
  citations:
    - https://github.com/coredns/deployment/blob/master/kubernetes/CoreDNS-k8s_version.md
