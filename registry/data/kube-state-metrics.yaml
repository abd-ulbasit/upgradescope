# registry/data/kube-state-metrics.yaml
# No compat rows, on purpose (decided in #343, re-read 2026-10-12). The README's
# "Versioning" section
# (https://github.com/kubernetes/kube-state-metrics/blob/ca3c2e3ded4f9845ff9b025cacd1c17331c07496/README.md#versioning)
# says "The supported Kubernetes cluster version is determined by client-go" and
# "All additional compatibility is only best effort, or happens to still/already
# be supported", and its "Compatibility matrix" maps each release to the
# client-go (Kubernetes) version it is built with: v2.16.0 to v1.32, v2.17.0 to
# v1.33, v2.18.0 to v1.34, v2.19.0 to v1.35, v2.20.0 to v1.36, main to v1.37 (at
# most 5 releases are recorded; older ones are dropped). The client-go
# compatibility matrix it points to marks every non-matching pair "+-"
# ("everything they have in common (i.e., most APIs) will work"). That is a build
# dependency and a tested-with table, not a minimum or a maximum
# (registry/CONTRIBUTING.md, "Maximum, minimum or tested with"), so encoding
# k8s_max = the client-go minor would block installs that work. The only other
# support statement is "the maintainers will only support the latest release",
# a rolling policy with no dates, so there are no cycles.
schema_version: 2
id: kube-state-metrics
display_name: kube-state-metrics
matchers:
  images:
    - kube-state-metrics/kube-state-metrics
    - coreos/kube-state-metrics # legacy quay.io/coreos image
    # AKS: Microsoft's builds, tagged v<ksm> or v<ksm>-<build>.
    - mcr.microsoft.com/oss/kubernetes/kube-state-metrics
    - mcr.microsoft.com/oss/v2/kubernetes/kube-state-metrics
    # GKE: Google's build, tagged v<ksm>-gke.<n>.
    - gcr.io/gke-release/kube-state-metrics
    - gke.gcr.io/kube-state-metrics
    # RKE2, k3s and Rancher Monitoring: Rancher's verbatim mirror, the upstream tag.
    - rancher/mirrored-kube-state-metrics-kube-state-metrics
    # Bitnami's rebuild, tagged <ksm>-debian-12-r<n>. The repositories on
    # public.ecr.aws/bitnami and docker.io/bitnami are empty since 2025 (checked
    # 2026-10-10); the matchers keep recognising pinned references and mirrors.
    - bitnami/kube-state-metrics
    - bitnamilegacy/kube-state-metrics
  charts:
    - kube-state-metrics
support:
  status: supported
  citations:
    - https://github.com/kubernetes/kube-state-metrics#compatibility-matrix
    - https://github.com/kubernetes/client-go#compatibility-matrix
