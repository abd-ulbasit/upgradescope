openapi: 3.1.0
# The upgradescope server's HTTP API. Hand-written; internal/server's
# openapi_test.go keeps it honest: every route the server registers must be
# an operation here (and every operation a registered route), and real
# handler responses must validate against the schemas below and carry no
# field they do not list. The response schemas themselves stay open (no
# additionalProperties/unevaluatedProperties false; a test enforces it), so
# clients validating against or generated from this document survive a field
# added within v1; the no-unlisted-field rule lives in the test. Request
# schemas may be closed where the handler rejects unknown fields
# (RenameRequest). docs/reference/api.md is rendered from this file by
# tools/gen-docs (make docs-gen).
info:
  title: upgradescope server API
  version: v1
  license:
    name: Apache-2.0
    identifier: Apache-2.0
  description: |
    The REST API of `upgradescope serve`: snapshot ingest from agents, the
    read API behind the dashboard, the CI gate, auditor exports and cluster
    administration.

    **Authentication.** Every credential is a bearer token
    (`Authorization: Bearer <token>`). Reads, the gate and `/metrics` take
    a read credential: `serve --read-token`, the admin token, or a read
    token minted with `upgradescope tokens create --read`; or, in the
    opt-in trusted-proxy mode (`--trust-team-header` with
    `--trusted-proxy-cidr`), a team header from a proxy in those ranges.
    With none configured, reads are open.

    **Read scopes.** `--read-token`, the admin token and a read token
    minted for `*` read the whole fleet. A read token minted for teams, and
    the trusted proxy's header, read only those teams: the clusters one of
    them owns a namespace in (by the namespace attribution findings carry,
    after `--team-map`), and of those only their findings, suppressed
    findings and team scores. A finding that spans teams is cut to theirs:
    only their teams, namespaces and objects, its title counting only
    theirs and its detail replaced by one that names only what is kept,
    without the folded apiserver caller rows (`callers`).
    A scoped report has no `unrecognizedImages`, and the helm
    capability's reason and skipped list (which name releases as
    namespace/name) are withheld. Any other cluster answers the same 404 as an
    unknown one, on every per-cluster endpoint and for `/api/v1/gate`'s
    `?cluster=`, and is absent from the cluster list and fleet rollups.
    `/metrics` answers a team-scoped read 403. A scoped answer carries
    `X-Upgradescope-Teams: <team,...>` (each team percent-encoded, as a
    URL path segment is: `Platform%20Team,payments`) and `Cache-Control: private,
    no-store`; a fleet-wide one carries neither. In the trusted-proxy mode
    every read answer carries `Vary: <header>, Authorization`. A finding
    whose namespace list was capped is always cut for a scoped read. See
    https://abd-ulbasit.github.io/upgradescope/operations/auth/

    Pushes take the
    shared ingest token (`--ingest-token`) or a per-cluster token from
    `upgradescope tokens create`. Deleting and renaming clusters take the
    admin token (`--admin-token`); without one the server refuses both.
    `/healthz` and `/readyz` are never authenticated.

    **Errors.** Every error a handler writes is JSON, `{"error": "..."}`,
    with a 4xx or 5xx status. An unknown path under `/api/`, or below
    `/healthz`, `/readyz`, `/livez` or `/metrics`, is a JSON 404 too. A
    known path called with the wrong method gets ServeMux's 405 with an
    `Allow` header and a plain-text body. 500 bodies never carry internal
    detail: they read `{"error": "internal error"}` and the server logs the
    cause.

    **Targets** are Kubernetes minors written `MAJOR.MINOR` (`1.38`).
    Where a target is optional, the default is the next minor above the
    version the cluster's latest snapshot reports.

    **Stability.** Paths under `/api/v1` keep their meaning within v1;
    fields may be added to responses, so the response schemas here do not
    forbid fields they do not list: ignore a field you do not know. See the
    compatibility policy:
    https://abd-ulbasit.github.io/upgradescope/compatibility-policy/
servers:
  - url: http://127.0.0.1:8080
    description: "`upgradescope serve` with its default --listen"
tags:
  - name: probes
    description: Liveness, readiness and Prometheus metrics.
  - name: ingest
    description: Snapshot pushes from in-cluster agents.
  - name: clusters
    description: Per-cluster state, reports, findings and history.
  - name: fleet
    description: Rollups across every cluster.
  - name: gate
    description: The CI gate for rendered manifests.
  - name: exports
    description: Auditor exports of a stored evaluation.
  - name: registry
    description: The add-on registry this binary judges against.
  - name: admin
    description: Cluster administration (admin token).

security:
  - readToken: []

paths:
  /healthz:
    get:
      tags: [probes]
      operationId: healthz
      summary: Liveness
      description: 200 while the process serves; never touches the database.
      security: []
      responses:
        "200":
          description: The process is up.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Status"}
  /readyz:
    get:
      tags: [probes]
      operationId: readyz
      summary: Readiness
      description: 200 when the database answers a ping within 2s, else 503.
      security: []
      responses:
        "200":
          description: The database answered.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Status"}
        "503":
          $ref: "#/components/responses/Error"
  /metrics:
    get:
      tags: [probes]
      operationId: metrics
      summary: Prometheus metrics
      description: |
        Prometheus text exposition: HTTP traffic, ingest results, and per
        cluster the score, verdict, blockers, push age and staleness of
        its current evaluations. Behind the read token when one is set.
        Its series name every cluster, so it takes a fleet-wide read
        credential: a team-scoped one is 403. The metric names are listed
        in the observability reference.
      responses:
        "200":
          description: Prometheus text format.
          content:
            text/plain:
              schema: {type: string}
        "401":
          $ref: "#/components/responses/Error"
        "403":
          description: A team-scoped read credential.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "503": {$ref: "#/components/responses/FleetBusy"}

  /api/v1/snapshots:
    post:
      tags: [ingest]
      operationId: pushSnapshot
      summary: Push an inventory snapshot
      description: |
        What the agent sends every time its cluster's inventory changes and
        at least every `--force-sync-every` (1h). The body is JSON,
        optionally gzipped (`Content-Encoding: gzip`), at most
        `serve --max-snapshot-bytes` (20 MiB) on the wire and after
        decompression.

        The server stores the inventory as sent and evaluates it against
        the cluster's next minor plus `serve --targets`, in one
        transaction. A push whose inventory equals the latest stored one
        (ignoring `collectedAt` and fields this server does not know) is a
        duplicate: 200, nothing new stored. A cluster name is bound to the
        `clusterId` (kube-system namespace UID) it first pushed; a push
        under that name from another UID, or with none, is a 409.

        A per-cluster token may push only as its own cluster (403 before
        anything is written). `clusterName` is an RFC 1123 subdomain of at
        most 253 bytes, and the inventory's identifiers are what the
        apiserver accepts for what they name: namespaces RFC 1123 labels,
        object names at most 253 bytes without `/` or `%`, node and Helm
        release names RFC 1123 subdomains, team labels label values. Its
        other values are within the limits collectors keep to: strings at
        most 16 KiB (a capability's reason 64 KiB, an object's field
        manager 128 printable bytes), at most 100 objects per API usage
        entry, each group/version/kind once per list, at most 200
        unrecognized images and 32 capabilities. Anything else is 422,
        naming the field and the rule, before anything is stored. The free
        text a collector copies whole from the cluster is cut to the
        limits, not refused: a capability's reason and skipped entries,
        and an object's `ignore` (to its whole tokens) and `ignoreReason`
        (the upgradescope.basit.engineer/ignore annotations). The snapshot keeps the
        push as sent.

        Each target's report is at most `--max-snapshot-bytes`: a push
        whose report for one would be larger is 413, and nothing is
        stored. No genuine inventory's report comes near it.

        Memory is bounded by the body's structure as well as its size:
        while the body is read, its JSON values are counted (each value 1,
        each object 8) against a budget of 1,000,000 units, and buffered
        bodies share a budget of twice the cap across requests. One push
        is decoded at a time; a push that waits more than 10s for its
        turn, or finds the body budget full, gets 503 with `Retry-After`.
        So does a push whose notification baselines other writers (another
        replica's push, the background re-evaluation) replaced three times
        while it was evaluated; nothing is stored. The agent retries 408
        and 503.
      security:
        - ingestToken: []
      parameters:
        - name: Content-Encoding
          in: header
          required: false
          schema: {type: string, enum: [gzip, identity]}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PushRequest"}
      responses:
        "200":
          description: A duplicate of the cluster's latest snapshot.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PushDuplicate"}
        "202":
          description: Stored and evaluated.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PushAccepted"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "400":
          description: The body ended early or could not be read.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "408":
          description: The body did not arrive within the server's read timeout (60s for `serve`).
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "409": {$ref: "#/components/responses/Error"}
        "413":
          description: |
            Over the byte cap (on the wire or after decompression) or over
            the node budget, before anything is decoded; or, once decoded,
            a report for one of the targets would be over
            `--max-snapshot-bytes`, and nothing is stored.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "415": {$ref: "#/components/responses/Error"}
        "422":
          description: |
            Not judgeable, refused before anything is written: invalid
            JSON or gzip, a body that is not valid UTF-8, an envelope `schemaVersion` other than 1, no
            `clusterName` or one that is not an RFC 1123 subdomain of at
            most 253 bytes, a missing or `null` inventory, an inventory
            `schemaVersion` other than 1, a `source` other than `cluster`,
            a `collectorSchema` other than 1 (or none), a `serverVersion`
            that is not a Kubernetes 1.x version, an identifier that is not valid for
            what it names, or a value beyond the limits collectors keep to
            (see above). The message names the field and the rule.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "500": {$ref: "#/components/responses/Error"}
        "503":
          description: The shared body budget is full, the push waited too long for its turn, or other writers kept replacing its notification baselines (nothing is stored); retry after `Retry-After`.
          headers:
            Retry-After: {$ref: "#/components/headers/RetryAfter"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}

  /api/v1/clusters:
    get:
      tags: [clusters]
      operationId: listClusters
      summary: List clusters
      description: |
        Every cluster, with whether it is stale and the summary of its
        current evaluation at its default target (absent until one exists).
      responses:
        "200":
          description: The clusters, by id.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/ClusterSummary"}
        "401": {$ref: "#/components/responses/Error"}
        "500": {$ref: "#/components/responses/Error"}
        "503": {$ref: "#/components/responses/FleetBusy"}

  /api/v1/clusters/{id}:
    parameters:
      - $ref: "#/components/parameters/ClusterID"
    get:
      tags: [clusters]
      operationId: getCluster
      summary: Get one cluster
      description: |
        The cluster, the version and capabilities of its latest snapshot,
        and the summaries of its current evaluations: the default target
        and every applicable `serve --targets` minor.
      responses:
        "200":
          description: The cluster.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ClusterDetail"}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "503": {$ref: "#/components/responses/ReadBusy"}
    delete:
      tags: [admin]
      operationId: deleteCluster
      summary: Delete a cluster
      description: |
        Removes the cluster with its snapshots, evaluations, queued
        notifications and the per-cluster ingest tokens minted for its
        name. An agent still pushing under the name registers it again.
      security:
        - adminToken: []
      responses:
        "204":
          description: Deleted.
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403":
          description: No admin token configured, or another token presented.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "404": {$ref: "#/components/responses/Error"}
    patch:
      tags: [admin]
      operationId: renameCluster
      summary: Rename a cluster
      description: |
        Moves the cluster's history and per-cluster ingest tokens to the new
        name. Change the agent's `--cluster-name` too: until then its pushes
        under the old name are refused (per-cluster token) or register the
        old name again (shared token).
      security:
        - adminToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/RenameRequest"}
      responses:
        "200":
          description: The renamed cluster.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Cluster"}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
        "413": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}

  /api/v1/clusters/{id}/report:
    parameters:
      - $ref: "#/components/parameters/ClusterID"
      - $ref: "#/components/parameters/Target"
    get:
      tags: [clusters]
      operationId: getReport
      summary: Readiness report
      description: |
        The full report for one target: the stored evaluation of the latest
        snapshot when there is one (`source: stored`), otherwise a what-if
        evaluated now from the latest snapshot and not stored
        (`source: what-if`), 413 when its report would be over
        `--max-snapshot-bytes`. `teams` holds per-team scores.
      responses:
        "200":
          description: The report.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ReportResponse"}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "413": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
        "503": {$ref: "#/components/responses/ReadBusy"}

  /api/v1/clusters/{id}/findings:
    parameters:
      - $ref: "#/components/parameters/ClusterID"
      - $ref: "#/components/parameters/Target"
      - name: severity
        in: query
        description: Only findings of this severity. An unknown value matches nothing.
        schema: {$ref: "#/components/schemas/Severity"}
      - name: category
        in: query
        description: Only findings of this category. An unknown value matches nothing.
        schema: {$ref: "#/components/schemas/Category"}
    get:
      tags: [clusters]
      operationId: getFindings
      summary: Findings, filtered
      description: The report's findings (same source as the report), exact-match filtered.
      responses:
        "200":
          description: The findings.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/FindingsResponse"}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "413": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
        "503": {$ref: "#/components/responses/ReadBusy"}

  /api/v1/clusters/{id}/history:
    parameters:
      - $ref: "#/components/parameters/ClusterID"
      - $ref: "#/components/parameters/Target"
      - name: limit
        in: query
        description: Most recent points to return, at most 1000.
        schema: {type: integer, minimum: 1, maximum: 1000, default: 100}
    get:
      tags: [clusters]
      operationId: getHistory
      summary: Score history
      description: Stored evaluations of the target, oldest first, within the retention window.
      responses:
        "200":
          description: The score history.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/ScorePoint"}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
        "503": {$ref: "#/components/responses/ReadBusy"}

  /api/v1/clusters/{id}/teams:
    parameters:
      - $ref: "#/components/parameters/ClusterID"
      - $ref: "#/components/parameters/Target"
    get:
      tags: [clusters]
      operationId: getTeams
      summary: Per-team scores
      description: |
        The score formula applied to each team's findings, from the same
        report the report endpoint serves. Findings with no team are under
        `(unattributed)`, a name no label value can take and `--team-map` refuses, so a real team called `unattributed` is a separate row.
      responses:
        "200":
          description: Team scores.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/TeamsResponse"}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "413": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
        "503": {$ref: "#/components/responses/ReadBusy"}

  /api/v1/clusters/{id}/export:
    parameters:
      - $ref: "#/components/parameters/ClusterID"
      - $ref: "#/components/parameters/Target"
      - name: format
        in: query
        required: true
        schema: {type: string, enum: [csv, html]}
    get:
      tags: [exports]
      operationId: exportReport
      summary: Auditor export
      description: |
        The stored evaluation of the latest snapshot as CSV (one summary
        row, one row per finding, one per capability not assessed) or a
        self-contained HTML report with the score history. Never a what-if:
        404 when no stored evaluation exists for the target, or when the
        cluster already runs it. An export is at most
        `--max-snapshot-bytes`, as the report it renders is (HTML writes
        `'` `"` `&` as five bytes and `<` `>` as four): 413 above, saying to
        read the JSON report.
      responses:
        "200":
          description: The export.
          content:
            text/csv:
              schema: {type: string}
            text/html:
              schema: {type: string}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "413": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
        "503": {$ref: "#/components/responses/ReadBusy"}

  /api/v1/fleet:
    get:
      tags: [fleet]
      operationId: getFleet
      summary: Fleet score matrix
      description: |
        One row per cluster, one cell per target, from current stored
        evaluations only (nothing is recomputed). A cell is `null` when the
        cluster has no current evaluation for that target, or already runs
        it (then the target is also in the row's `notApplicable`).
      parameters:
        - name: targets
          in: query
          description: |
            Comma-separated minors, at most 16 distinct (more is 422).
            Default: every cluster's next minor plus the `serve --targets`
            minors some cluster does not run yet, at most 16 of them: those
            with the most clusters to fill them (the older minor on a tie),
            the rest counted in `targetsOmitted`.
          schema: {type: string, example: "1.37,1.38"}
      responses:
        "200":
          description: The matrix.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/FleetResponse"}
        "401": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
        "500": {$ref: "#/components/responses/Error"}
        "503": {$ref: "#/components/responses/FleetBusy"}

  /api/v1/fleet/teams:
    get:
      tags: [fleet]
      operationId: getFleetTeams
      summary: Per-team rollup across the fleet
      description: |
        For one target, each team's worst score, total blockers and the
        clusters it has findings in. Each cluster contributes its stored
        evaluation, else a what-if from its latest snapshot (`evaluated`
        says which). Clusters left out are named in `missing` and, with the
        reason, in `excluded`: `no-snapshot` (the agent has not pushed
        one), `too-large` (the what-if report would be over
        `--max-snapshot-bytes`) or `unreadable` (the stored inventory does
        not decode). Clusters that already run the target are
        `notApplicable`.

        A what-if's `evaluatedAt` is when it was computed: each cluster's
        contribution is kept for its snapshot (or its stored evaluation),
        the target, the server's knowledge base and team map and the UTC
        day, so a later request for the target computes only what changed.
        Each contribution is computed in the per-cluster read slot, one
        cluster at a time, so other per-cluster reads wait at most for one
        cluster's. A rollup still computing after 20s answers 503 with
        `Retry-After`; what it computed is kept, so the retry goes on from
        there.

        A team's `verdict` is the worst of its verdicts in the clusters
        evaluated: `blocked` over `unknown` over `ready`. Its score and
        blockers count only its own findings, so a team with a clean score
        can still be blocked by a blocker no team owns, or unknown because
        a required check did not run.
      parameters:
        - name: target
          in: query
          required: true
          schema: {$ref: "#/components/schemas/Target"}
      responses:
        "200":
          description: The rollup.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/FleetTeamsResponse"}
        "401": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
        "500": {$ref: "#/components/responses/Error"}
        "503": {$ref: "#/components/responses/ReadBusy"}

  /api/v1/gate:
    post:
      tags: [gate]
      operationId: gate
      summary: Gate rendered manifests
      description: |
        Evaluates a YAML (or JSON) manifest stream against a target and
        stores nothing. Without `cluster`, the manifests are judged alone,
        like `scan --files`. With `cluster`, they are judged inside that
        cluster's latest stored inventory (its version, nodes, add-ons,
        CRDs and team labels), with the manifests' objects, add-ons and
        CRDs merged into it, and the verdict counts only what the
        manifests introduce (findings tagged `source: manifest`); findings
        the cluster already has are tagged `source: cluster`. A removed or
        deprecated API a posted object uses, an add-on the manifests
        deploy, and a custom resource they write at a version the CRDs do
        not serve are always the manifests'.

        With a team-scoped credential, `cluster` is judged as the scope's
        share of it only (its teams' namespaces, and what describes the
        cluster as a whole): the findings, verdict, status, score and
        `clusterVerdict` are the share's, so a PR that breaks only
        another team's workloads passes. Repositories that can break
        shared or other teams' resources gate with a fleet-wide
        credential. See
        https://abd-ulbasit.github.io/upgradescope/operations/auth/#the-gate-with-a-team-scoped-token

        `fail-on` works like `scan --fail-on` (default `blocker`): when an
        introduced finding reaches it, or the verdict is `unknown`, the
        status is 422 with the full body, so `curl --fail-with-body` fails
        a CI step and keeps the report. `X-Upgradescope-Verdict` always
        carries the verdict.

        `allow-incomplete=true` is `scan --allow-incomplete`: the gate
        decides on findings alone. An `unknown` verdict (a required check
        did not run, such as a `target` past the knowledge base's
        horizon) with no finding at the `fail-on` threshold then answers
        200, and a blocker still answers 422. The verdict header, the
        body's `verdict` and its required `notAssessed` gaps still say
        `unknown`. A `target` that is not an upgrade of the cluster (the
        `target` gap) is a mistake, not a coverage limit, and still fails.
        Only `true` and `false` are values, given once.

        `format` picks the body: the JSON gate response (default), SARIF,
        JUnit XML whose test outcomes follow `fail-on`, or a GitLab Code
        Quality report. SARIF, JUnit and Code Quality hold only the
        findings the manifests introduce; the status and verdict header
        are the same in every format.

        Suppression works as in `scan`: the `upgradescope.basit.engineer/ignore` and
        `upgradescope.basit.engineer/ignore-reason` annotations of posted (and, with
        `cluster`, stored) objects, and the ignore rules of a
        `.upgradescope.yaml` sent in `config`. Suppressed findings count
        toward neither the verdict nor `fail-on`; the JSON answer lists
        them in `suppressed` with `suppressedCount`, SARIF as results with
        an external suppression, JUnit as skipped test cases, and Code
        Quality leaves them out. An expired rule no longer applies; it and
        an annotation without a reason are named in `warnings`. There is
        no baseline input: with `cluster`, the cluster's own findings are
        the baseline (`source: cluster`), and manifest-level debt is
        accepted with `scan --baseline` or ignore rules.

        Limits: `serve --max-gate-bytes` (10 MiB) per body, and for the
        stream with its YAML aliases expanded; 4 MiB per document with its
        aliases expanded, 20,000 documents, and a node budget of 400,000
        units (each YAML node 1, each sequence entry 4, each alias what it
        names), counted from the raw bytes before anything is decoded;
        over any of them is 413. Buffered bodies share a budget of three
        times the cap. Measuring aliases, decoding and evaluating run one
        request at a time; a request that waits more than 30s for its
        turn, or finds the shared body budget full, gets 503 with
        `Retry-After`. A stream with a UTF-16 byte order mark is 422: send
        UTF-8.

        The answer may take at most `--max-gate-bytes` too: an upper bound
        on it, in the asked format (every string at its dearest escape),
        is computed after the evaluation and before anything is encoded,
        and over the cap is 413, saying to split the stream. With
        `cluster`, the cluster's own findings and the objects they list
        count toward it. The answer is built before it is sent, with its
        `Content-Length`. Answers waiting for their clients share a budget
        of twice `--max-snapshot-bytes` with the per-cluster and fleet
        reads; an answer that does not fit what is left of it is 503 with
        `Retry-After`. (One larger than that whole budget, possible only
        when `--max-gate-bytes` is over twice `--max-snapshot-bytes`, is
        sent while the next request waits, and cut off if the client has
        not taken it within 20s.)
      parameters:
        - name: target
          in: query
          required: true
          schema: {$ref: "#/components/schemas/Target"}
        - name: cluster
          in: query
          description: A cluster name or id whose stored context the manifests are judged in.
          schema: {type: string}
        - name: format
          in: query
          schema: {type: string, enum: [json, sarif, junit, gitlab-codequality], default: json}
        - name: fail-on
          in: query
          schema: {type: string, enum: [blocker, warning, never], default: blocker}
        - name: allow-incomplete
          in: query
          description: |
            `true` gates on findings alone: an `unknown` verdict with no
            finding at the `fail-on` threshold is 200, not 422. See the
            operation description.
          schema: {type: string, enum: ["true", "false"], default: "false"}
        - name: path
          in: query
          description: |
            The repository-relative file the stream was rendered to
            (`deploy/rendered.yaml`): clean, relative, valid UTF-8 without
            control characters, at most 512 bytes (every listed object
            carries it); otherwise 422. Introduced findings are then
            located in it in SARIF and Code Quality, so code scanning or
            the merge request widget shows them on the change.
          schema: {type: string, maxLength: 512}
        - name: config
          in: query
          description: |
            A `.upgradescope.yaml` (its text, URL-encoded): ignore rules
            applied as `scan --config` applies them, `file` globs matched
            against `path`. An invalid config, one over 32 KiB, or
            `config` given more than once is a 422. The request line,
            and so this parameter, also counts toward the server's 64 KiB
            request-header limit: URL-encoding expands YAML, so a config
            under 32 KiB can exceed it, and the server then answers 431
            with a plain-text body. A reverse proxy in front of the server
            may refuse a long request line sooner (ingress-nginx's
            default answers 414 above 8 KiB).
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/x-yaml:
            schema: {type: string}
          application/json:
            schema: {type: string}
      responses:
        "200":
          description: The gate passed.
          headers:
            X-Upgradescope-Verdict: {$ref: "#/components/headers/Verdict"}
          content:
            application/json:
              schema:
                oneOf:
                  - {$ref: "#/components/schemas/GateResponse"}
                  - {$ref: "#/components/schemas/CodeQuality"}
            application/sarif+json:
              schema: {$ref: "#/components/schemas/SARIF"}
            application/xml:
              schema: {$ref: "#/components/schemas/JUnit"}
        "422":
          description: |
            The gate failed (same body as 200), or the request is invalid
            (no `target`, bad `format`, `fail-on`,
            `allow-incomplete`, `path` or `config`, an invalid document separator, a UTF-16 stream, or an
            undecodable manifest stream: an Error body).
          headers:
            X-Upgradescope-Verdict: {$ref: "#/components/headers/Verdict"}
          content:
            application/json:
              schema:
                oneOf:
                  - {$ref: "#/components/schemas/GateResponse"}
                  - {$ref: "#/components/schemas/CodeQuality"}
                  - {$ref: "#/components/schemas/Error"}
            application/sarif+json:
              schema: {$ref: "#/components/schemas/SARIF"}
            application/xml:
              schema: {$ref: "#/components/schemas/JUnit"}
        "400":
          description: |
            The `target` is not a Kubernetes 1.x minor at or above the
            oldest the knowledge base covers (1.16): `1.3`, which is what
            YAML makes of an unquoted `target: 1.30`, would judge nothing
            and read ready, so it is refused, saying to quote the version.
            Not a 422, which is the gate's own verdict. Also: the body
            ended early or could not be read.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "408":
          description: The body did not arrive within the server's read timeout (60s for `serve`).
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "413":
          description: |
            Over the byte cap (for the body, or for the stream with its
            aliases expanded), the per-document size (aliases expanded),
            the document count, the node budget, or the answer's bound,
            or, with `?cluster=`, a report over `--max-snapshot-bytes`;
            the message says which, and to split the stream.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "415": {$ref: "#/components/responses/Error"}
        "503":
          description: The shared body budget is full, the request waited more than 30s for its turn, or the answers waiting for their clients leave no room for this one; retry after `Retry-After`.
          headers:
            Retry-After: {$ref: "#/components/headers/RetryAfter"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}

  /api/v1/registry:
    get:
      tags: [registry]
      operationId: getRegistry
      summary: The add-on registry
      description: The add-on EOL and compatibility dataset compiled into this binary, sorted by id.
      responses:
        "200":
          description: The registry.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Registry"}
        "401": {$ref: "#/components/responses/Error"}

components:
  securitySchemes:
    readToken:
      type: http
      scheme: bearer
      description: "`serve --read-token`, the admin token, or a read token from `upgradescope tokens create --read` (fleet-wide, or scoped to teams). Not required when the server runs with no read credential configured."
    ingestToken:
      type: http
      scheme: bearer
      description: "`serve --ingest-token`, or a per-cluster token from `upgradescope tokens create`."
    adminToken:
      type: http
      scheme: bearer
      description: "`serve --admin-token`."

  parameters:
    ClusterID:
      name: id
      in: path
      required: true
      description: The cluster's numeric id (`id` in the cluster list). A non-integer is a 400.
      schema: {type: integer, format: int64}
    Target:
      name: target
      in: query
      description: Target minor. Default, the next minor above the cluster's version.
      schema: {$ref: "#/components/schemas/Target"}

  headers:
    Verdict:
      description: The gate's verdict.
      schema: {$ref: "#/components/schemas/Verdict"}
    RetryAfter:
      description: Seconds to wait before retrying.
      schema: {type: integer, minimum: 1}

  responses:
    Error:
      description: An error.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    ReadBusy:
      description: |
        Reads that load a cluster's snapshot run one at a time, and this
        one waited more than 30s for its turn, or the responses waiting for
        their clients leave no room for this one (they share a budget of
        twice `--max-snapshot-bytes` with the fleet reads and `/gate`);
        retry after
        `Retry-After`. A response is sent with its `Content-Length`; one
        larger than that whole budget is sent while the next read waits,
        and cut off if the client has not taken it within 20s.
      headers:
        Retry-After: {$ref: "#/components/headers/RetryAfter"}
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    FleetBusy:
      description: |
        Reads of the whole fleet (`/api/v1/clusters`, `/api/v1/fleet`,
        `/metrics`) run two at a time, and this one waited more than 30s
        for its turn, or the responses waiting for their clients leave no
        room for this one (they share a budget of twice
        `--max-snapshot-bytes` with the per-cluster reads and `/gate`);
        retry after `Retry-After`. A response is sent with its
        `Content-Length`; one larger than that whole budget is sent while
        the next fleet read waits, and cut off if the client has not taken
        it within 20s.
      headers:
        Retry-After: {$ref: "#/components/headers/RetryAfter"}
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}

  schemas:
    Error:
      type: object
      description: Every error a handler writes.
      required: [error]
      properties:
        error: {type: string}
    Status:
      type: object
      required: [status]
      properties:
        status: {type: string, const: ok}
    Target:
      type: string
      description: |
        A Kubernetes minor, `MAJOR.MINOR`, from 1.16 (the oldest the
        knowledge base covers; an older one is refused, with the gate's
        400 and the other endpoints' 422). Quote it in YAML: an unquoted
        `1.30` is the number 1.3.
      pattern: '^[0-9]+\.[0-9]+$'
      example: "1.38"
    Verdict:
      type: string
      enum: [ready, blocked, unknown]
      description: |
        `blocked`: at least one blocker. `unknown`: no blocker found, but a
        required check was not assessed, so one may have been missed.
        `ready`: neither.
    Severity:
      type: string
      enum: [blocker, warning, info]
    Category:
      type: string
      description: |
        One of `removed-api`, `deprecated-api`, `deprecated-api-in-use`,
        `eol-addon`, `eol-approaching`, `version-skew`, `chart-incompat`,
        `kb-stale`, `addon-no-data`, `unknown-api`, `crd-version`,
        `support-lifecycle`, `volume-plugin`. A release may add
        categories under `/api/v1`, so this is not an enum: treat one you do
        not know by its severity.
      example: removed-api

    Cluster:
      allOf:
        - {$ref: "#/components/schemas/ClusterFields"}
    ClusterFields:
      type: object
      required: [id, name, clusterUid, firstSeen, lastSeen]
      properties:
        id: {type: integer, format: int64}
        name: {type: string, description: "The agent's --cluster-name."}
        clusterUid: {type: string, description: The kube-system namespace UID the name is bound to.}
        firstSeen: {type: string, format: date-time}
        lastSeen: {type: string, format: date-time, description: "The agent's last push, duplicates included."}
    CapabilityGap:
      type: object
      description: Something the evaluation could not assess.
      required: [capability, reason]
      properties:
        capability: {type: string, description: "A collector capability (api-usage, deprecated-calls, helm, addons, versions, crds, volumes), kb-coverage, or target (the target is not an upgrade of the cluster)."}
        reason: {type: string}
        partial: {type: boolean, description: The capability ran but did not read everything.}
        skipped: {type: array, items: {type: string}, description: What a partial capability did not read.}
        required: {type: boolean, description: The gap makes the verdict unknown.}
    SummaryGap:
      description: |
        A report's gap as an evaluation summary carries it, bounded: its
        capability cut to 64 bytes, its reason to 256 and at most 3 of what
        it skipped, each cut to 128 bytes (a cut one ends in "…"), with
        `skippedOmitted` counting the rest. The report lists every gap
        whole.
      allOf:
        - {$ref: "#/components/schemas/CapabilityGap"}
        - type: object
          properties:
            skippedOmitted: {type: integer, minimum: 1, description: Skipped entries not listed.}
    CapabilityStatus:
      type: object
      required: [available]
      properties:
        available: {type: boolean}
        reason: {type: string}
        partial: {type: boolean}
        skipped: {type: array, items: {type: string}}
    EvalSummary:
      type: object
      required: [target, score, ready, verdict, blockers, warnings, kbVersion, evaluatedAt, snapshotId]
      properties:
        target: {$ref: "#/components/schemas/Target"}
        score: {type: integer, minimum: 0, maximum: 100}
        ready: {type: boolean, description: "verdict == ready (kept for v0.1 clients)."}
        verdict: {$ref: "#/components/schemas/Verdict"}
        blockers: {type: integer}
        warnings: {type: integer}
        kbVersion: {type: string}
        evaluatedAt: {type: string, format: date-time, description: When the result was last confirmed.}
        snapshotId: {type: integer, format: int64}
        outdated: {type: boolean, description: "Evaluated before today (UTC), or under another knowledge base or team map; the next pass replaces it."}
        notAssessed:
          type: array
          items: {$ref: "#/components/schemas/SummaryGap"}
          description: |
            The required gaps first, then the rest. A cluster's detail lists
            every gap; `/clusters` lists at most 1 KiB of them (encoded) and
            counts the rest in `notAssessedOmitted`.
        notAssessedOmitted: {type: integer, minimum: 1, description: Gaps not listed (only in /clusters).}
    ClusterSummary:
      allOf:
        - {$ref: "#/components/schemas/ClusterFields"}
        - type: object
          required: [stale]
          properties:
            stale: {type: boolean, description: "No push within serve --stale-after."}
            latest: {$ref: "#/components/schemas/EvalSummary"}
    ClusterDetail:
      allOf:
        - {$ref: "#/components/schemas/ClusterFields"}
        - type: object
          required: [stale, evaluations]
          properties:
            stale: {type: boolean}
            serverVersion: {type: string, description: The version the latest snapshot is judged at.}
            capabilities:
              type: object
              additionalProperties: {$ref: "#/components/schemas/CapabilityStatus"}
            evaluations:
              type: array
              items: {$ref: "#/components/schemas/EvalSummary"}

    ObjectRef:
      type: object
      properties:
        namespace: {type: string}
        name: {type: string}
        file: {type: string, description: "Manifest path, relative to the scanned root (manifests only)."}
        line: {type: integer, description: "1-based line of the object's apiVersion key (manifests only)."}
        renderedFrom: {type: string, description: "The Helm template the object was rendered from."}
        manager: {type: string, description: "The field manager that wrote a live object through the flagged API, or kubectl last-applied."}
        ignore: {type: string}
        ignoreReason: {type: string}
    Finding:
      allOf:
        - {$ref: "#/components/schemas/FindingFields"}
    FindingFields:
      type: object
      required: [category, severity, title, detail]
      properties:
        category: {$ref: "#/components/schemas/Category"}
        severity: {$ref: "#/components/schemas/Severity"}
        key: {type: string, description: "Stable, count-free identity: category/discriminator."}
        title: {type: string}
        detail: {type: string}
        teams: {type: array, items: {type: string}}
        namespaces: {type: array, items: {type: string}, maxItems: 100, description: "Affected namespaces, sorted, at most 100."}
        namespacesOmitted: {type: integer, description: Affected namespaces not listed.}
        unnamespaced: {type: boolean, description: "An add-on finding that also covers an install in no named namespace: a manifest object without metadata.namespace, or a cluster-scoped IngressClass. A namespace-scoped ignore rule cannot be shown to match it, so it does not take the finding."}
        remediation: {type: string}
        citations: {type: array, items: {type: string, format: uri}}
        objects: {type: array, items: {$ref: "#/components/schemas/ObjectRef"}, maxItems: 100}
        objectsOmitted: {type: integer, description: Affected objects not listed.}
        baselineState: {type: string, enum: [new, unchanged]}
        callers:
          type: array
          items: {$ref: "#/components/schemas/Caller"}
          description: |
            API usage findings: the apiserver_requested_deprecated_apis
            rows folded into this finding, in row order, each the
            deprecated-api-in-use finding it is on its own. Suppressing
            every object of the finding by annotation or an object-scoped
            rule does not suppress them: they then stand as findings of
            their own. A team-scoped read omits them from a finding it
            cuts to its teams.
    Caller:
      type: object
      required: [version, resource, key, severity, title, detail]
      properties:
        group: {type: string, description: Absent for the core group.}
        version: {type: string}
        resource: {type: string}
        subresource: {type: string}
        key: {type: string, description: "The key of the caller's own deprecated-api-in-use finding."}
        severity: {$ref: "#/components/schemas/Severity"}
        title: {type: string}
        detail: {type: string}
    SuppressedFinding:
      allOf:
        - {$ref: "#/components/schemas/FindingFields"}
        - type: object
          required: [reason, source]
          properties:
            reason: {type: string, description: Why the finding is accepted.}
            source: {type: string, description: "What suppressed it: the config file, annotation, or spec.ignore."}
            expires: {type: string, description: "YYYY-MM-DD, as the rule gave it."}
    TeamScore:
      type: object
      required: [score, ready, blockers, warnings]
      properties:
        score: {type: integer}
        ready: {type: boolean, description: "verdict == ready."}
        verdict:
          type: string
          enum: [ready, blocked, unknown]
          description: |
            The team's readiness, by the report's rules over what can
            concern it: blocked by a blocker of its own or by an
            unattributed one (which cannot be ruled out as the team's);
            otherwise unknown when the report has a required not-assessed
            gap, which may hide any team's blocker; otherwise ready.
            Another team's blocker does not lower it; score, blockers and
            warnings count only the team's own findings.
        blockers: {type: integer}
        warnings: {type: integer}
    TeamScores:
      type: object
      description: Team name to score; findings with no team are under `(unattributed)`, a name no label value can take and `--team-map` refuses, so a real team called `unattributed` is a separate row.
      additionalProperties: {$ref: "#/components/schemas/TeamScore"}
    ReportEnvelope:
      type: object
      description: "The first two fields of every report-shaped response (a cluster's report and the gate's JSON answer), as of `scan --output json`."
      required: [schemaVersion, toolVersion]
      properties:
        schemaVersion: {type: integer, const: 1, description: "The version of the report's shape. Within it fields are only added, never renamed, removed, retyped or given a new meaning; a breaking change bumps it (see the compatibility policy)."}
        toolVersion: {type: string, description: "The server build that wrote the response, also for a stored evaluation. Informational, no compatibility meaning."}
    ReportFields:
      description: The engine's report, as `scan --output json` writes it.
      allOf:
        - {$ref: "#/components/schemas/ReportEnvelope"}
        - {$ref: "#/components/schemas/ReportBase"}
        - type: object
          required: [findings]
          properties:
            findings: {type: array, items: {$ref: "#/components/schemas/Finding"}}
    ReportBase:
      type: object
      description: The report's fields other than its findings.
      required: [clusterId, target, kbVersion, score, ready, verdict]
      properties:
        clusterId: {type: string}
        target: {$ref: "#/components/schemas/Target"}
        serverVersion: {type: string, description: "The kube-apiserver gitVersion the target was judged against; absent for manifests."}
        kubeContext: {type: string, description: "`scan` of a live cluster only: the kubeconfig context it read. The server never sets it."}
        apiServer: {type: string, description: "`scan` of a live cluster only: the API server it read, as scheme, host and port, without credentials, path or query. The server never sets it."}
        kbVersion: {type: string}
        score:
          type: integer
          minimum: 0
          maximum: 100
          description: "max(0, 100 - min(75, 25 x blockers) - min(20, 5 x warnings))"
        ready: {type: boolean, description: "verdict == ready."}
        verdict: {$ref: "#/components/schemas/Verdict"}
        notAssessed: {type: array, items: {$ref: "#/components/schemas/CapabilityGap"}}
        suppressed: {type: array, items: {$ref: "#/components/schemas/SuppressedFinding"}}
        unrecognizedImages:
          type: array
          maxItems: 200
          items: {type: string}
          description: "Image repositories (host/path) no add-on image matcher recognised: a detection gap, not a finding (neither score nor verdict counts them). Sorted, deduplicated, at most 200."
        unrecognizedImagesOmitted: {type: integer, minimum: 1, description: Unrecognized image repositories beyond the 200 listed.}
        addOnEvidenceAgeSeconds: {type: integer, minimum: 1, description: "How old, in seconds (at least 1), the pod evidence the add-ons were detected from was when the agent reused its last full pod pass instead of listing every pod again (`--pod-pass-every`, `--pod-pass-max-age`): an add-on installed or upgraded since is reported as it was then, and a pass of `--pod-pass-max-age` or more is not reused (the age is that of the collection, so a viewer can see evidence about one interval older). Absent when every pod was read for this report, and from collectors that predate the field. The verdict does not depend on it."}
        support: {$ref: "#/components/schemas/SupportStatus"}
    SupportStatus:
      type: object
      description: |
        A cluster on EKS, GKE or AKS whose Kubernetes minor the knowledge base
        dates: where that minor stands in the provider's support calendar,
        whether or not it is a finding (see the `support-lifecycle` category).
        Absent for other clusters and when the provider's dates for the minor
        are not known. The same for every target.
      required: [provider, minor, phase, extendedSupportFrom]
      properties:
        provider: {type: string, enum: [eks, gke, aks], description: The managed Kubernetes service the collector inferred from the server version suffix and the nodes' managed node pool labels.}
        minor: {type: string, pattern: '^[0-9]+\.[0-9]+$', description: The control plane's Kubernetes minor.}
        phase:
          type: string
          enum: [standard, ending, extended, ended]
          description: |
            `standard`: standard support, not ending within 90 days. `ending`:
            standard support ends within 90 days. `extended`: past standard
            support, before the provider's extended window ends (EKS bills it
            by default; on GKE and AKS it is opt-in, see
            `extendedSupportCondition`, and the cluster may not be enrolled).
            `ended`: past the end of extended support, or
            past standard support for a minor with no extended support.
        extendedSupportFrom: {type: string, format: date, description: The day (UTC) standard support ends and extended support begins. EKS bills extended support from the start of this day.}
        extendedSupportEnds: {type: string, format: date, description: The day extended support ends; absent when the provider offered none for the minor.}
        annualCostDelta:
          type: string
          pattern: '^[0-9]+\.[0-9]{2}$'
          description: |
            What extended support adds per cluster per year at the provider's
            published list price, (extended - standard) x 8760 cluster-hours,
            as a decimal string in `currency`. A list price as of
            `priceAsOf`, not the customer's bill: prices change and vary by
            contract. Present only when the knowledge base cites the
            provider's price and the minor can still be in extended support
            (not in phase `ended`); never inferred.
        currency: {type: string, enum: [USD], description: The currency of `annualCostDelta`.}
        priceAsOf: {type: string, format: date, description: The day the list price behind `annualCostDelta` was read from the provider's pricing page.}
        annualCostNote: {type: string, description: "The provider's caveat on whom `annualCostDelta` is charged to (GKE: only clusters on the Extended release channel). Present with `annualCostDelta` when the knowledge base records one; show it beside the figure."}
        extendedSupportCondition: {type: string, description: "Where the provider's extended support is opt-in (GKE, AKS): the configuration under which it applies, as a clause completing \"only if ...\" (\"Long Term Support is enabled\"). The scanner cannot see the cluster's configuration, so phases `ending` and `extended` describe the provider's window, not a confirmed enrolment. Absent for EKS and when the provider offered no extended support for the minor."}
    ReportMeta:
      type: object
      required: [evaluatedAt, snapshotId, source]
      properties:
        evaluatedAt: {type: string, format: date-time}
        snapshotId: {type: integer, format: int64}
        source: {type: string, enum: [stored, what-if]}
        serverVersion: {type: string}
        notApplicable: {type: boolean, description: The cluster already runs the target.}
        outdated: {type: boolean}
    ReportResponse:
      allOf:
        - {$ref: "#/components/schemas/ReportFields"}
        - {$ref: "#/components/schemas/ReportMeta"}
        - type: object
          properties:
            teams: {$ref: "#/components/schemas/TeamScores"}
    FindingsResponse:
      allOf:
        - type: object
          required: [target, findings]
          properties:
            target: {$ref: "#/components/schemas/Target"}
            findings: {type: array, items: {$ref: "#/components/schemas/Finding"}}
        - {$ref: "#/components/schemas/ReportMeta"}
    TeamsResponse:
      allOf:
        - type: object
          required: [target, teams]
          properties:
            target: {$ref: "#/components/schemas/Target"}
            teams: {$ref: "#/components/schemas/TeamScores"}
        - {$ref: "#/components/schemas/ReportMeta"}
    ScorePoint:
      type: object
      required: [at, score, ready]
      properties:
        at: {type: string, format: date-time}
        score: {type: integer}
        ready: {type: boolean}
        verdict:
          $ref: "#/components/schemas/Verdict"
          description: The evaluation's verdict. A score can't tell `unknown` from `ready` (an evaluation whose required check did not run can score 100), so draw the trend by this. Absent from servers that predate it.

    FleetCell:
      type: object
      required: [score, ready, verdict, blockers, evaluatedAt, snapshotId, source]
      properties:
        score: {type: integer}
        ready: {type: boolean}
        verdict: {$ref: "#/components/schemas/Verdict"}
        blockers: {type: integer}
        evaluatedAt: {type: string, format: date-time}
        snapshotId: {type: integer, format: int64}
        source: {type: string, const: stored}
        outdated: {type: boolean}
        notAssessed:
          type: array
          items: {$ref: "#/components/schemas/SummaryGap"}
          description: The required gaps first, then the rest, at most 1 KiB of them (encoded).
        notAssessedOmitted: {type: integer, minimum: 1, description: Gaps not listed.}
    FleetRow:
      type: object
      required: [clusterId, name, lastSeen, stale, cells]
      properties:
        clusterId: {type: integer, format: int64}
        name: {type: string}
        lastSeen: {type: string, format: date-time}
        stale: {type: boolean}
        serverVersion: {type: string}
        cells:
          type: object
          description: Target to cell; null when there is no current evaluation or the target is not applicable.
          additionalProperties:
            anyOf:
              - {$ref: "#/components/schemas/FleetCell"}
              - {type: "null"}
        notApplicable: {type: array, items: {$ref: "#/components/schemas/Target"}}
    FleetResponse:
      type: object
      required: [targets, clusters]
      properties:
        targets: {type: array, items: {$ref: "#/components/schemas/Target"}}
        targetsOmitted:
          type: integer
          minimum: 1
          description: |
            Default columns left out past the 16 (absent with `?targets=`
            and when none are); ask for them with `?targets=`.
        clusters: {type: array, items: {$ref: "#/components/schemas/FleetRow"}}
    FleetTeam:
      type: object
      required: [worstScore, blockers, verdict, clusters]
      properties:
        worstScore: {type: integer}
        blockers: {type: integer}
        verdict:
          $ref: "#/components/schemas/Verdict"
          description: The worst of the team's verdicts across the clusters, `blocked` over `unknown` over `ready`. Never read the score without it.
        clusters: {type: array, items: {type: string}}
    FleetExcluded:
      type: object
      required: [name, clusterId, reason]
      properties:
        name: {type: string}
        clusterId: {type: integer, format: int64}
        reason:
          type: string
          enum: [no-snapshot, too-large, unreadable]
          description: "`no-snapshot`: the agent has not pushed one. `too-large`: the cluster has snapshots, but its report for the target would be over `--max-snapshot-bytes`. `unreadable`: its stored inventory does not decode (or the cluster went away mid-request)."
    FleetTeamsSource:
      type: object
      required: [name, clusterId, source, evaluatedAt, snapshotId]
      properties:
        name: {type: string}
        clusterId: {type: integer, format: int64}
        source: {type: string, enum: [stored, what-if]}
        evaluatedAt: {type: string, format: date-time}
        snapshotId: {type: integer, format: int64}
    FleetTeamsResponse:
      type: object
      required: [target, teams, evaluated, missing, excluded, notApplicable]
      properties:
        target: {$ref: "#/components/schemas/Target"}
        teams:
          type: object
          additionalProperties: {$ref: "#/components/schemas/FleetTeam"}
        evaluated: {type: array, items: {$ref: "#/components/schemas/FleetTeamsSource"}}
        missing:
          type: array
          items: {type: string}
          description: The names of every cluster left out of the rollup, whatever the reason; `excluded` says why.
        excluded:
          type: array
          items: {$ref: "#/components/schemas/FleetExcluded"}
        notApplicable: {type: array, items: {type: string}}

    GateFinding:
      allOf:
        - {$ref: "#/components/schemas/FindingFields"}
        - type: object
          required: [source]
          properties:
            source: {type: string, enum: [manifest, cluster], description: "manifest: introduced by the posted manifests; cluster: the cluster already has it."}
    GateResponse:
      allOf:
        - {$ref: "#/components/schemas/ReportEnvelope"}
        - {$ref: "#/components/schemas/ReportBase"}
        - type: object
          required: [findings, suppressedCount]
          properties:
            findings: {type: array, items: {$ref: "#/components/schemas/GateFinding"}}
            teams: {$ref: "#/components/schemas/TeamScores"}
            clusterVerdict:
              $ref: "#/components/schemas/Verdict"
              description: With `cluster`, the verdict of the cluster plus the manifests, existing findings included; with a team-scoped credential, of the scope's share of the cluster plus the manifests.
            suppressedCount: {type: integer, minimum: 0, description: "The number of `suppressed` entries."}
            warnings:
              type: array
              items: {type: string}
              description: "Suppression warnings: rules in `config` that expired (they no longer apply), `upgradescope.basit.engineer/ignore` annotations without a reason (not applied), and one line for the posted objects annotated under the deprecated pre-v0.2.0 keys (applied, and read until v0.3.0), naming the first five. Stored objects (`cluster`) under the old keys are not named here: the cluster's agent reports them in its ClusterReadiness status.notAssessed."
    SARIF:
      type: object
      description: "A SARIF 2.1.0 log (https://json.schemastore.org/sarif-2.1.0.json) with one run, the report's findings as results."
    JUnit:
      type: string
      description: |
        JUnit XML valid against the Jenkins JUnit schema (the xUnit
        plugin's junit-10.xsd): one testsuite per finding category with
        one testcase per finding, failing when the finding reaches
        `fail-on`; a not-assessed suite with an error per required gap the
        gate fails on. See `scan --output junit`.
    CodeQuality:
      type: array
      description: |
        A GitLab Code Quality report
        (https://docs.gitlab.com/ci/testing/code_quality/#code-quality-report-format):
        one entry per finding and located object. Findings without a file
        are on the virtual path `upgradescope/<finding key>`. See
        `scan --output gitlab-codequality`.
      items:
        type: object
        required: [description, check_name, fingerprint, severity, location]
        properties:
          description: {type: string}
          check_name: {type: string, description: The finding key, or `not-assessed/<capability>`.}
          fingerprint: {type: string, description: "Stable across runs: the key and the object's file, namespace and name, not its line."}
          severity: {type: string, enum: [info, minor, critical]}
          location:
            type: object
            required: [path, lines]
            properties:
              path: {type: string}
              lines:
                type: object
                required: [begin]
                properties:
                  begin: {type: integer, minimum: 1}

    PushRequest:
      type: object
      required: [schemaVersion, clusterName, inventory]
      properties:
        schemaVersion: {type: integer, const: 1, description: The push protocol version.}
        clusterName: {type: string, minLength: 1}
        agentVersion: {type: string}
        kbVersion: {type: string}
        inventory: {$ref: "#/components/schemas/Inventory"}
    Inventory:
      type: object
      description: |
        What the agent observed, never a verdict. The server stores it as
        sent, unknown fields included, so a newer server can judge them.
      required: [schemaVersion]
      properties:
        schemaVersion: {type: integer, const: 1}
        clusterId: {type: string, description: The kube-system namespace UID.}
        collectorSchema:
          type: integer
          minimum: 0
          maximum: 1
          description: |
            The generation of field meanings the collector filled this
            inventory with (1 from v0.2.0). Absent from inventories of
            collectors before it — v0.1.x and v0.2.0's release candidates —
            which are judged by the push's agentVersion: one that is not a
            release at or after 0.2.0-0 (including "dev" and empty) is a
            v0.1.x agent, whose api-usage and deprecated-calls are not
            assessed and whose chart-found add-on version is evidence only.
            A later generation, whose meanings this server would misread,
            is 422.
        source:
          type: string
          enum: [cluster]
          description: |
            Absent from v0.1.x agents' inventories, which are cluster ones
            too. A files inventory (`scan --files`) is judged without
            versions or add-ons, so a push claiming one is 422: only the
            agent pushes, and it collects from a cluster. A files snapshot
            stored before ingest refused them is judged as a cluster one.
        collectedAt: {type: string, format: date-time}
        serverVersion: {type: string, description: "The apiserver's gitVersion, e.g. v1.34.2-gke.100."}
        capabilities:
          type: object
          description: |
            Every capability the collector has, by name. One the verdict
            requires and the map does not report — api-usage, versions, and
            addons when the knowledge base has add-ons — is a required
            not-assessed gap, so an inventory without this map is never
            ready.
          additionalProperties: {$ref: "#/components/schemas/CapabilityStatus"}
        apiUsage: {type: array, items: {type: object}}
        apiAuthorshipUnknown: {type: array, items: {type: object}, description: "Objects of a flagged API with no managedFields entry outside the status subresource and the control plane, and no usable last-applied annotation, so nothing says which version wrote them; shaped like apiUsage, once per kind. Reported as info, never as use of the API."}
        deprecatedCalls: {type: array, items: {type: object}}
        helmReleases: {type: array, items: {type: object}}
        gitopsCharts: {type: array, items: {type: object}, description: "Charts Argo CD (Application `spec.source`/`spec.sources[]` entries with `chart` set) and Flux (HelmRelease `spec.chart.spec`, or a `chartRef` to an OCIRepository) deploy to the scanned cluster, as those resources name them. Each has `tool` (`argocd` or `flux`), `name` and `namespace` (the Application's or HelmRelease's own), `target` (the namespace the chart deploys into; omitted when left to the manifests), `chart`, `version` (as the resource spells it, so possibly a constraint or a tag; omitted when none) and `repo` (an Application's repoURL or an OCIRepository's URL, recorded without userinfo, query or fragment, though a token embedded in the path is kept; for a HelmRelease's own source, `Kind/namespace/name`). Applications and HelmReleases that deploy to other clusters, or to a target that is not a namespace name, are not listed. A chart reference carries no app version and no stored manifest; a Helm release that Flux's helm-controller leaves is listed in `helmReleases`."}
        addOns: {type: array, items: {type: object}}
        nodes: {type: array, items: {type: object}}
        controlPlane: {type: array, items: {type: object}}
        namespaces: {type: array, items: {type: object}}
        unrecognizedImages: {type: array, items: {type: string}, description: "Image repositories no add-on image matcher claims; sorted, deduplicated, at most 200."}
        unrecognizedImagesOmitted: {type: integer, description: Unrecognized image repositories the cap dropped.}
        provider: {type: string, maxLength: 63, description: "Known values: eks, gke, aks, other. The managed Kubernetes service the collector inferred, or `other` when the cluster shows none of the three; absent when it could not tell (the nodes were unreadable and the server version names no provider). A name this build does not know is accepted and has no support calendar (a newer agent may learn more providers); a value that is not a name of at most 63 bytes of letters, digits, `-`, `_` or `.` is refused (422)."}
        crds: {type: array, items: {type: object}, description: "CustomResourceDefinitions: versions, status.storedVersions, and the custom resources at a deprecated or unserved version."}
        volumePlugins: {type: array, items: {type: object}, description: "The in-tree volume plugins (the `volumes` capability) the pods name, one entry per plugin by its field name in a pod's volumes (`glusterfs`, `awsElasticBlockStore`): `plugin`, `count` (the pods, or in files mode the pod templates, Pods and PersistentVolumes, naming it), `namespaces` (that count per namespace), and in files mode `objects` (file, line, namespace and name; at most 100) and `objectsOmitted`. At most 64 entries, each plugin once; a plugin must be a field name (at most 64 ASCII letters and digits, starting with a letter), no count negative, namespace keys and object refs namespace and object names (422 otherwise). An agent drops an entry that would be refused, marking `volumes` partial. An inventory without the `volumes` capability, as older agents push, is not assessed for them."}
        addOnEvidenceAgeSeconds: {type: integer, minimum: 1, description: "How old, in seconds, the pod evidence the add-ons were detected from was when the agent reused its last full pod pass instead of listing every pod again (`--pod-pass-every`, `--pod-pass-max-age`). Absent when every pod was read. Not part of the snapshot's identity, like collectedAt: a push that differs only in it is a duplicate and is not stored, so the stored report keeps the age it was first pushed with, as it keeps that push's `collectedAt` (the evidence is as of `collectedAt`)."}
        apiServerStartTime: {type: string, format: date-time, description: "process_start_time_seconds of the kube-apiserver whose /metrics deprecatedCalls were read from, in whole seconds: apiserver_requested_deprecated_apis counts requests since then. Absent when the scrape did not report it. Not part of the snapshot's identity, like collectedAt: a push that differs only in it is a duplicate. The server ignores one before 2014 or more than 10 minutes after collectedAt."}
    PushAccepted:
      type: object
      required: [snapshotId]
      properties:
        snapshotId: {type: integer, format: int64}
    PushDuplicate:
      type: object
      required: [snapshotId, duplicate]
      properties:
        snapshotId: {type: integer, format: int64, description: The latest snapshot, which this push repeats.}
        duplicate: {type: boolean, const: true}
    RenameRequest:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name: {type: string, minLength: 1, maxLength: 253}

    Registry:
      type: object
      required: [addons]
      properties:
        addons: {type: array, items: {$ref: "#/components/schemas/AddOn"}}
    Citations:
      type: [array, "null"]
      items: {type: string, format: uri}
    AddOn:
      type: object
      description: One add-on registry entry (registry/data/<id>.yaml).
      required: [schema_version, id, display_name, matchers, support]
      properties:
        schema_version: {type: integer}
        id: {type: string}
        display_name: {type: string}
        matchers:
          type: object
          properties:
            images:
              description: Repository paths without the registry host; one may end in a tag pattern ("rancher/nginx-ingress-controller:*-hardened*") that claims only the tags it matches.
              type: array
              items: {type: string}
            charts: {type: array, items: {type: string}}
            runtimes: {type: array, items: {type: string}}
            components:
              description: Images versioned on their own, each release line mapped to the product release line that ships it.
              type: array
              items:
                type: object
                required: [image, lines, citations]
                properties:
                  image: {type: string}
                  lines:
                    type: array
                    items:
                      type: object
                      required: [component, product]
                      properties:
                        component: {type: string}
                        product: {type: string}
                  citations: {$ref: "#/components/schemas/Citations"}
        support:
          type: object
          required: [status, citations]
          properties:
            status: {type: string, enum: [supported, eol, unknown]}
            eol_date: {type: string, format: date}
            extended_eol_date:
              description: Support lasts until this date only if extended_support_condition holds; it ends for everyone on eol_date.
              type: string
              format: date
            extended_support_condition: {type: string}
            citations: {$ref: "#/components/schemas/Citations"}
        cycles:
          type: array
          items:
            type: object
            required: [cycle, eol, citations]
            properties:
              cycle: {type: string}
              eol:
                description: The end-of-life date, or true (ended, no date published) or false (no end announced).
                type: [string, boolean]
              k8s_min: {type: string}
              k8s_max: {type: string}
              citations: {$ref: "#/components/schemas/Citations"}
        compat:
          type: array
          items:
            type: object
            required: [range, citations]
            properties:
              range: {type: string}
              k8s_min: {type: string}
              k8s_max: {type: string}
              citations: {$ref: "#/components/schemas/Citations"}
        recommendation: {type: string}
        endoflife_product: {type: string}
