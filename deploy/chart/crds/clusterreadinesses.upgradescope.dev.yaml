apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: clusterreadinesses.upgradescope.dev
spec:
  group: upgradescope.dev
  scope: Cluster
  names:
    plural: clusterreadinesses
    singular: clusterreadiness
    kind: ClusterReadiness
    listKind: ClusterReadinessList
    shortNames:
      - ucr
    categories:
      - upgradescope
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Target
          type: string
          jsonPath: .status.targets[0].target
        - name: Score
          type: integer
          jsonPath: .status.targets[0].score
        - name: Ready
          type: string
          description: Verdict for the first target — ready, blocked, or unknown (required checks not assessed).
          jsonPath: .status.targets[0].verdict
        - name: LastEvaluated
          type: date
          description: When the agent last wrote this status. Older than about two intervals means the agent is not ticking.
          jsonPath: .status.lastEvaluated
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                targets:
                  description: Kubernetes minor versions to evaluate against, e.g. "1.36". Empty means the agent targets the next minor above the observed server version. At most 8, because each target adds a row to status; an agent given more evaluates the first 8 and lists the rest in status.notAssessed.
                  type: array
                  # maxItems is crd.MaxTargets (a test holds the two together). Twice the
                  # server's --targets cap of 4; unbounded, 1000 targets overran the
                  # apiserver's request limit and no status was ever written.
                  maxItems: 8
                  items:
                    type: string
                    pattern: '^[0-9]+\.[0-9]+$'
                    maxLength: 8
                ignore:
                  description: Accepted findings, applied by the agent every tick with the same rules as the CLI's .upgradescope.yaml. Suppressed findings do not count toward score and verdict; status counts them per target.
                  type: array
                  items:
                    type: object
                    required: [reason]
                    properties:
                      key:
                        description: Finding key, e.g. eol-addon/ingress-nginx. Set key or category, not both.
                        type: string
                      category:
                        description: Finding category, e.g. removed-api.
                        type: string
                      namespace:
                        description: Glob. Only objects in a matching namespace; a finding without objects (an add-on) matches when all its namespaces match.
                        type: string
                      name:
                        description: Glob. Only objects with a matching name.
                        type: string
                      file:
                        description: Glob on manifest paths. Never matches live objects; kept for the CLI's rule schema.
                        type: string
                      reason:
                        description: Why the finding is accepted. Required.
                        type: string
                        minLength: 1
                      expires:
                        description: Last day (UTC) the rule applies, YYYY-MM-DD. After it the rule is ignored and status.notAssessed says so.
                        type: string
                        pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'
            status:
              type: object
              properties:
                observedServerVersion:
                  type: string
                kbVersion:
                  type: string
                lastEvaluated:
                  type: string
                  format: date-time
                agentVersion:
                  type: string
                supportPhase:
                  description: Where the cluster's Kubernetes minor stands in its managed provider's (EKS, GKE, AKS) support calendar - standard, ending (standard support ends within 90 days), extended (past standard support, before the provider's extended window ends; where that window is opt-in, as on GKE and AKS, it applies to the cluster only if extendedSupportCondition holds, which the agent cannot see) or ended. Absent when the provider is not one of the three or its dates for the minor are not in the knowledge base. The same for every target.
                  type: string
                  enum: [standard, ending, extended, ended]
                extendedSupportFrom:
                  description: The day (UTC, YYYY-MM-DD) standard support for the cluster's minor ends and extended support begins. Set with supportPhase.
                  type: string
                  pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'
                annualCostDelta:
                  description: What extended support adds per cluster per year at the provider's published list price, (extended - standard) x 8760 cluster-hours, as a decimal string in currency. A list price as of priceAsOf, not the bill. Set only for a provider whose price the knowledge base cites, while the minor can still be in extended support.
                  type: string
                  pattern: '^[0-9]+\.[0-9]{2}$'
                currency:
                  description: The currency of annualCostDelta.
                  type: string
                  enum: [USD]
                priceAsOf:
                  description: The day (YYYY-MM-DD) the list price behind annualCostDelta was read from the provider's pricing page.
                  type: string
                  pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'
                annualCostNote:
                  description: The provider's caveat on whom annualCostDelta is charged to, for example that GKE charges it only to clusters on the Extended release channel. Set with annualCostDelta when the knowledge base records one; show it beside the figure.
                  type: string
                extendedSupportCondition:
                  description: Where the provider's extended support is opt-in (GKE, AKS), the configuration under which it applies to the cluster, as a clause completing "only if ...", for example "Long Term Support is enabled". The agent cannot see the cluster's configuration, so supportPhase extended means the provider's window, not that the cluster is enrolled in it. Absent for providers where extended support is the default (EKS) and when the provider offered none for the minor.
                  type: string
                observedGeneration:
                  description: The metadata.generation (spec version) the status was evaluated for.
                  type: integer
                  format: int64
                  minimum: 0
                conditions:
                  description: 'Standard conditions. Ready summarizes the first target''s verdict: True (ready), False (reason Blocked), or Unknown (reason NotAssessed: a required check was not assessed, or no target was evaluated).'
                  type: array
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys: [type]
                  items:
                    type: object
                    required: [type, status, lastTransitionTime, reason, message]
                    properties:
                      type:
                        type: string
                        maxLength: 316
                      status:
                        type: string
                        enum: ["True", "False", "Unknown"]
                      observedGeneration:
                        type: integer
                        format: int64
                        minimum: 0
                      lastTransitionTime:
                        type: string
                        format: date-time
                      reason:
                        type: string
                        maxLength: 1024
                        minLength: 1
                        pattern: '^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$'
                      message:
                        type: string
                        maxLength: 32768
                notAssessed:
                  type: array
                  items:
                    type: string
                targets:
                  type: array
                  items:
                    type: object
                    required: [target, score, ready, blockers, warnings, infos]
                    properties:
                      target:
                        type: string
                      score:
                        type: integer
                      ready:
                        description: True only when verdict is "ready". Kept for v0.1 readers; prefer verdict.
                        type: boolean
                      verdict:
                        description: ready (no blockers, all required checks assessed), blocked (at least one blocker), or unknown (no blockers found, but a required check was not assessed; see notAssessed).
                        type: string
                        enum: [ready, blocked, unknown]
                      blockers:
                        type: integer
                      warnings:
                        type: integer
                      infos:
                        type: integer
                      suppressed:
                        description: Findings accepted by spec.ignore or upgradescope.dev/ignore annotations; not in blockers, warnings or infos.
                        type: integer
                      byCategory:
                        type: object
                        additionalProperties:
                          type: integer
                      topFindings:
                        type: array
                        maxItems: 20
                        items:
                          type: object
                          required: [category, severity, title]
                          properties:
                            category:
                              type: string
                            severity:
                              type: string
                            title:
                              type: string
                            remediation:
                              type: string
