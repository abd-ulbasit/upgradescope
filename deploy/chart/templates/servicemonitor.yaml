{{- if .Values.metrics.serviceMonitor.enabled }}
{{- if .Values.agent.enabled }}
# Headless Service for the agent's metrics port: ServiceMonitors select
# Services, and the agent has no other reason to have one.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "upgradescope.service" (dict "root" . "suffix" "-agent-metrics") }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "upgradescope.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent
spec:
  clusterIP: None
  ports:
    - name: http
      port: {{ .Values.agent.healthPort }}
      targetPort: http
  selector:
    app.kubernetes.io/name: {{ include "upgradescope.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: agent
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "upgradescope.derived" (dict "root" . "suffix" "-agent") }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "upgradescope.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent
    {{- with .Values.metrics.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "upgradescope.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: agent
  endpoints:
    - port: http
      path: /metrics
      interval: {{ .Values.metrics.serviceMonitor.interval }}
{{- end }}
{{- if .Values.server.enabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "upgradescope.serverFullname" . }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "upgradescope.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
    {{- with .Values.metrics.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "upgradescope.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: server
  endpoints:
    - port: http
      path: /metrics
      interval: {{ .Values.metrics.serviceMonitor.interval }}
      {{- with include "upgradescope.serverTLSSecret" . }}
      scheme: https
      tlsConfig:
        serverName: {{ printf "%s.%s.svc" (include "upgradescope.serverService" $) $.Release.Namespace }}
        {{- with $.Values.server.tls.caKey }}
        # The CA in the server.tls Secret (cert-manager CA and self-signed
        # issuers write ca.crt); with server.tls.caKey empty, Prometheus's
        # system roots.
        ca:
          secret:
            name: {{ include "upgradescope.serverTLSSecret" $ }}
            key: {{ . | quote }}
        {{- end }}
      {{- end }}
      {{- if include "upgradescope.readTokenEnabled" . }}
      # The read token guards /metrics too (per-cluster scores).
      authorization:
        type: Bearer
        credentials:
          name: {{ include "upgradescope.serverSecretName" . }}
          key: readToken
      {{- end }}
{{- end }}
{{- end }}
