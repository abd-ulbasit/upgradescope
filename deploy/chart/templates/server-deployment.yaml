{{- if .Values.server.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "upgradescope.serverFullname" . }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "upgradescope.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "upgradescope.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "upgradescope.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: server
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: server
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - serve
            - --listen=:{{ .Values.server.service.port }}
            - --db=/data/upgradescope.sqlite
            {{- if not (include "upgradescope.readTokenEnabled" .) }}
            # serve refuses an open read API on a non-loopback address
            # unless told otherwise; see server.readToken in values.yaml.
            - --allow-anonymous-read
            {{- end }}
            {{- if .Values.server.targets }}
            - --targets={{ join "," .Values.server.targets }}
            {{- end }}
          # Tokens and webhook URLs reach serve only through the environment
          # (it reads UPGRADESCOPE_* when the flag is unset), never argv, and
          # never appear in the Deployment: only the Secret holds them.
          env:
            - name: UPGRADESCOPE_INGEST_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "upgradescope.serverSecretName" . }}
                  key: ingestToken
            {{- if include "upgradescope.readTokenEnabled" . }}
            - name: UPGRADESCOPE_READ_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "upgradescope.serverSecretName" . }}
                  key: readToken
            {{- end }}
            {{- if or .Values.server.existingSecret .Values.server.slackWebhook }}
            - name: UPGRADESCOPE_SLACK_WEBHOOK
              valueFrom:
                secretKeyRef:
                  name: {{ include "upgradescope.serverSecretName" . }}
                  key: slackWebhook
                  {{- if .Values.server.existingSecret }}
                  optional: true
                  {{- end }}
            {{- end }}
            {{- if or .Values.server.existingSecret .Values.server.webhook }}
            - name: UPGRADESCOPE_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "upgradescope.serverSecretName" . }}
                  key: webhook
                  {{- if .Values.server.existingSecret }}
                  optional: true
                  {{- end }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.server.service.port }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources: {{- toYaml .Values.server.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          {{- if .Values.server.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "upgradescope.serverFullname" . }}-data
          {{- else }}
          emptyDir: {}
          {{- end }}
{{- end }}
