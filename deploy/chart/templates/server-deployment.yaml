{{- if .Values.server.enabled }}
{{- $postgres := include "upgradescope.postgres" . }}
{{- $tls := include "upgradescope.serverTLSSecret" . }}
{{- $memLimit := include "upgradescope.goMemLimit" (dict "resources" .Values.server.resources "extraEnv" .Values.server.extraEnv) }}
{{- $secretFiles := include "upgradescope.serverSecretFiles" . | fromJson }}
{{- $hasSecretFiles := or $secretFiles.required $secretFiles.optional }}
{{- if and (gt (int .Values.server.replicas) 1) (not $postgres) }}
{{- fail "server.replicas > 1 needs server.database.existingSecret (Postgres): SQLite on a ReadWriteOnce volume has a single writer" }}
{{- end }}
{{- /*
SQLite's temp directory (SQLITE_TMPDIR=/tmp) is the chart's sqlite-tmp
emptyDir, unless server.extraVolumeMounts already mounts a volume of the
user's at /tmp: then that one is the temp directory and the chart adds none,
since two mounts at one path make the Deployment invalid.
*/}}
{{- $ownTmp := not $postgres }}
{{- if $ownTmp }}
{{- range .Values.server.extraVolumeMounts }}
{{- if eq (trimSuffix "/" (toString .mountPath)) "/tmp" }}
{{- $ownTmp = false }}
{{- end }}
{{- end }}
{{- end }}
{{- if $ownTmp }}
{{- range .Values.server.extraVolumes }}
{{- if eq (toString .name) "sqlite-tmp" }}
{{- fail "server.extraVolumes names a volume sqlite-tmp, the name of the chart's SQLite temp volume (server.tmp). Rename yours, or mount it at /tmp (server.extraVolumeMounts) to use it as the temp directory instead" }}
{{- end }}
{{- end }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "upgradescope.serverFullname" . }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "upgradescope.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  replicas: {{ .Values.server.replicas }}
  strategy:
    {{- if $postgres }}
    # Postgres serializes writers across replicas (and migrations take an
    # advisory lock), so pods can overlap during a rollout.
    type: RollingUpdate
    {{- else }}
    # One SQLite writer on a ReadWriteOnce volume: stop the old pod first.
    type: Recreate
    {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "upgradescope.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        {{- /* the selector labels below win: a duplicate key would be invalid YAML */}}
        {{- with omit .Values.server.podLabels "app.kubernetes.io/name" "app.kubernetes.io/instance" "app.kubernetes.io/component" }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        app.kubernetes.io/name: {{ include "upgradescope.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: server
      {{- if or .Values.server.podAnnotations .Values.server.teamMap }}
      annotations:
        {{- with .Values.server.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with .Values.server.teamMap }}
        # serve reads --team-map at startup: roll the pods when it changes.
        checksum/team-map: {{ toYaml . | sha256sum }}
        {{- end }}
      {{- end }}
    spec:
      {{- with include "upgradescope.serverServiceAccountName" . }}
      serviceAccountName: {{ . }}
      {{- end }}
      # serve never calls the Kubernetes API.
      automountServiceAccountToken: false
      {{- include "upgradescope.podOptions" (dict "root" . "c" .Values.server) | trim | nindent 6 }}
      {{- with .Values.server.topologySpreadConstraints }}
      topologySpreadConstraints: {{- toYaml . | nindent 8 }}
      {{- else }}
      {{- if and .Values.server.defaultTopologySpread (gt (int .Values.server.replicas) 1) }}
      # Replicas on different nodes, as far as the cluster allows: soft, so a
      # small cluster still schedules them all.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: {{ include "upgradescope.name" . }}
              app.kubernetes.io/instance: {{ .Release.Name }}
              app.kubernetes.io/component: server
      {{- end }}
      {{- end }}
      containers:
        - name: server
          image: {{ include "upgradescope.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - serve
            # The listen port is not the Service port: the pod runs as a
            # non-root user with no capabilities, which cannot bind below 1024
            # on runtimes that do not lower net.ipv4.ip_unprivileged_port_start.
            - {{ printf "--listen=:%d" (int .Values.server.containerPort) | quote }}
            {{- if not $postgres }}
            - --db=/data/upgradescope.sqlite
            {{- end }}
            {{- if not (include "upgradescope.readTokenEnabled" .) }}
            {{- if include "upgradescope.readAnonymous" . }}
            # server.allowAnonymousRead (or server.ingress.allowAnonymousRead)
            # opts into an OPEN read API: open while no read credential
            # exists, and open again when the database is lost or restored.
            - --allow-anonymous-read
            {{- else }}
            # No read token: the read API is closed whatever the database
            # holds. Reads return 401 until one is minted (see the install
            # notes); a lost or restored database cannot reopen it.
            - --require-read-credential
            {{- end }}
            {{- end }}
            {{- with .Values.server.targets }}
            - {{ printf "--targets=%s" (join "," .) | quote }}
            {{- end }}
            - {{ printf "--retention=%v" .Values.server.retention | quote }}
            - {{ printf "--stale-after=%s" (include "upgradescope.staleAfter" .) | quote }}
            {{- if .Values.server.teamMap }}
            - "--team-map=/etc/upgradescope/team-map/team-map.yaml"
            {{- end }}
            {{- if $tls }}
            # HTTPS with the server.tls Secret. serve re-reads the pair when
            # the kubelet updates the mount (no subPath, so it can), so a
            # renewed certificate needs no restart.
            - --tls-cert-file=/etc/upgradescope/tls/tls.crt
            - --tls-key-file=/etc/upgradescope/tls/tls.key
            {{- end }}
            # The names serve answers for when it checks the Host (a trusted
            # team header, or a loopback --listen): the Service's, which the
            # in-chart agent pushes to, the Ingress host and
            # server.allowedHosts. Probes and scrapes of the pod's IP need
            # none: the guard answers for the address a request arrives on.
            # The Service names are the cut ones (upgradescope.serverService),
            # the names the Service actually has.
            {{- $svc := include "upgradescope.serverService" . }}
            {{- $hosts := list $svc (printf "%s.%s" $svc .Release.Namespace) (printf "%s.%s.svc" $svc .Release.Namespace) (include "upgradescope.serverFQDN" .) }}
            {{- if and .Values.server.ingress.enabled .Values.server.ingress.host }}
            {{- $hosts = append $hosts (lower .Values.server.ingress.host) }}
            {{- end }}
            {{- $hosts = concat $hosts .Values.server.allowedHosts | uniq }}
            - {{ printf "--allowed-host=%s" (join "," $hosts) | quote }}
            # Tokens, webhook URLs and the webhook key reach serve as files
            # mounted from the Secret (no subPath, so the kubelet updates
            # them): never argv, never the Deployment. serve re-reads a file
            # when it changes, so a rotated value needs no restart.
            {{- range $key := $secretFiles.required }}
            - {{ printf "--%s-file=/etc/upgradescope/secret-files/%s" (include "upgradescope.serverSecretFlag" $key) $key | quote }}
            {{- end }}
            {{- range $key := $secretFiles.optional }}
            - {{ printf "--%s-file=/etc/upgradescope/secret-files-optional/%s" (include "upgradescope.serverSecretFlag" $key) $key | quote }}
            {{- end }}
            {{- with $secretFiles.optional }}
            # Keys of the existing Secret that may be absent.
            {{- $names := list }}
            {{- range $key := . }}
            {{- $names = append $names (include "upgradescope.serverSecretFlag" $key) }}
            {{- end }}
            - {{ printf "--optional-secret-file=%s" (join "," $names) | quote }}
            {{- end }}
            {{- range .Values.server.extraArgs }}
            {{- $arg := toString . }}
            {{- if and (or (eq $arg "--allow-anonymous-read") (hasPrefix "--allow-anonymous-read=" $arg)) (not (include "upgradescope.readTokenEnabled" $)) (not (include "upgradescope.readAnonymous" $)) }}
            {{- fail "server.extraArgs sets --allow-anonymous-read, but with no read token the chart passes --require-read-credential, which serve refuses together with it. Set server.allowAnonymousRead=true to open the read API (and remove the argument), or remove the argument to keep it closed" }}
            {{- end }}
            {{- range $key := concat $secretFiles.required $secretFiles.optional }}
            {{- $flag := include "upgradescope.serverSecretFlag" $key }}
            {{- if or (eq $arg (printf "--%s" $flag)) (hasPrefix (printf "--%s=" $flag) $arg) }}
            {{- fail (printf "server.extraArgs sets --%s, but the chart already passes --%s-file for that secret, and serve refuses both. Remove the argument and set server.%s (or that key of server.existingSecret) instead" $flag $flag $key) }}
            {{- end }}
            {{- end }}
            - {{ . | quote }}
            {{- end }}
          # The database URL reaches serve through the environment (it reads
          # UPGRADESCOPE_DB_URL when the flag is unset), never argv, and never
          # appears in the Deployment: only the Secret holds it. A connection
          # is opened once, so changing it needs a restart.
          env:
            {{- with $memLimit }}
            # 90% of the memory limit: the Go runtime does not read it.
            - name: GOMEMLIMIT
              value: {{ . | quote }}
            {{- end }}
            {{- if not $postgres }}
            # SQLite spills a large delete (the retention prune, deleting a
            # cluster) into a temp file, and the root filesystem is read-only:
            # without a writable temp directory the delete fails with
            # "disk I/O error (6410)" and history grows without bound. /tmp
            # is the chart's sqlite-tmp volume, or the user's own at /tmp.
            - name: SQLITE_TMPDIR
              value: /tmp
            {{- end }}
            {{- if $postgres }}
            - name: UPGRADESCOPE_DB_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.server.database.existingSecret }}
                  key: {{ .Values.server.database.key }}
            {{- end }}
            {{- with .Values.server.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ int .Values.server.containerPort }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
              {{- if $tls }}
              scheme: HTTPS
              {{- end }}
            initialDelaySeconds: 5
            periodSeconds: 15
          # /readyz pings the database, so the pod leaves the Service while
          # it is unreachable; liveness (/healthz) never restarts it for that.
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
              {{- if $tls }}
              scheme: HTTPS
              {{- end }}
            initialDelaySeconds: 2
            periodSeconds: 5
          {{- with .Values.server.securityContext }}
          securityContext: {{- toYaml . | nindent 12 }}
          {{- end }}
          resources: {{- toYaml .Values.server.resources | nindent 12 }}
          {{- if or (not $postgres) .Values.server.teamMap $tls $hasSecretFiles .Values.server.extraVolumeMounts }}
          volumeMounts:
            {{- if not $postgres }}
            - name: data
              mountPath: /data
            {{- end }}
            {{- if $ownTmp }}
            - name: sqlite-tmp
              mountPath: /tmp
            {{- end }}
            {{- if .Values.server.teamMap }}
            - name: team-map
              mountPath: /etc/upgradescope/team-map
              readOnly: true
            {{- end }}
            {{- if $tls }}
            - name: tls
              mountPath: /etc/upgradescope/tls
              readOnly: true
            {{- end }}
            {{- if $secretFiles.required }}
            # No subPath: a subPath mount never sees the kubelet's update.
            - name: secret-files
              mountPath: /etc/upgradescope/secret-files
              readOnly: true
            {{- end }}
            {{- if $secretFiles.optional }}
            - name: secret-files-optional
              mountPath: /etc/upgradescope/secret-files-optional
              readOnly: true
            {{- end }}
            {{- with .Values.server.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
      {{- if or (not $postgres) .Values.server.teamMap $tls $hasSecretFiles .Values.server.extraVolumes }}
      volumes:
        {{- if $tls }}
        - name: tls
          secret:
            secretName: {{ $tls }}
            items:
              - {key: tls.crt, path: tls.crt}
              - {key: tls.key, path: tls.key}
        {{- end }}
        {{- if $secretFiles.required }}
        - name: secret-files
          secret:
            secretName: {{ include "upgradescope.serverSecretName" . }}
            items:
              {{- range $key := $secretFiles.required }}
              - {key: {{ $key }}, path: {{ $key }}}
              {{- end }}
        {{- end }}
        {{- if $secretFiles.optional }}
        - name: secret-files-optional
          secret:
            secretName: {{ include "upgradescope.serverSecretName" . }}
            # A key the Secret lacks is skipped, not an error.
            optional: true
            items:
              {{- range $key := $secretFiles.optional }}
              - {key: {{ $key }}, path: {{ $key }}}
              {{- end }}
        {{- end }}
        {{- if not $postgres }}
        - name: data
          {{- if .Values.server.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "upgradescope.derived" (dict "root" . "suffix" "-server-data") }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- end }}
        {{- if $ownTmp }}
        # SQLITE_TMPDIR: scratch space for a large delete (see server.tmp in
        # values.yaml). Node ephemeral storage, gone with the pod.
        - name: sqlite-tmp
          emptyDir:
            sizeLimit: {{ .Values.server.tmp.sizeLimit | quote }}
        {{- end }}
        {{- if .Values.server.teamMap }}
        - name: team-map
          configMap:
            name: {{ include "upgradescope.derived" (dict "root" . "suffix" "-server-team-map") }}
        {{- end }}
        {{- with .Values.server.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
{{- end }}
