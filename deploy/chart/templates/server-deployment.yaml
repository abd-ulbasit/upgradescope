{{- if .Values.server.enabled }}
{{- $postgres := include "upgradescope.postgres" . }}
{{- $tls := include "upgradescope.serverTLSSecret" . }}
{{- $memLimit := include "upgradescope.goMemLimit" (dict "resources" .Values.server.resources "extraEnv" .Values.server.extraEnv) }}
{{- if and (gt (int .Values.server.replicas) 1) (not $postgres) }}
{{- fail "server.replicas > 1 needs server.database.existingSecret (Postgres): SQLite on a ReadWriteOnce volume has a single writer" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "upgradescope.serverFullname" . }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "upgradescope.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  replicas: {{ .Values.server.replicas }}
  strategy:
    {{- if $postgres }}
    # Postgres serializes writers across replicas (and migrations take an
    # advisory lock), so pods can overlap during a rollout.
    type: RollingUpdate
    {{- else }}
    # One SQLite writer on a ReadWriteOnce volume: stop the old pod first.
    type: Recreate
    {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "upgradescope.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        {{- /* the selector labels below win: a duplicate key would be invalid YAML */}}
        {{- with omit .Values.server.podLabels "app.kubernetes.io/name" "app.kubernetes.io/instance" "app.kubernetes.io/component" }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        app.kubernetes.io/name: {{ include "upgradescope.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: server
      {{- $secretSum := include "upgradescope.serverSecretChecksum" . }}
      {{- if or .Values.server.podAnnotations .Values.server.teamMap $secretSum }}
      annotations:
        {{- with .Values.server.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with .Values.server.teamMap }}
        # serve reads --team-map at startup: roll the pods when it changes.
        checksum/team-map: {{ toYaml . | sha256sum }}
        {{- end }}
        {{- with $secretSum }}
        # The tokens and webhook URLs reach serve as environment variables
        # read at start: roll the pods when the chart-managed Secret changes.
        # An existingSecret cannot be hashed; restart the pods after rotating it.
        checksum/secret: {{ . }}
        {{- end }}
      {{- end }}
    spec:
      {{- with include "upgradescope.serverServiceAccountName" . }}
      serviceAccountName: {{ . }}
      {{- end }}
      # serve never calls the Kubernetes API.
      automountServiceAccountToken: false
      {{- include "upgradescope.podOptions" (dict "root" . "c" .Values.server) | trim | nindent 6 }}
      {{- with .Values.server.topologySpreadConstraints }}
      topologySpreadConstraints: {{- toYaml . | nindent 8 }}
      {{- else }}
      {{- if and .Values.server.defaultTopologySpread (gt (int .Values.server.replicas) 1) }}
      # Replicas on different nodes, as far as the cluster allows: soft, so a
      # small cluster still schedules them all.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: {{ include "upgradescope.name" . }}
              app.kubernetes.io/instance: {{ .Release.Name }}
              app.kubernetes.io/component: server
      {{- end }}
      {{- end }}
      containers:
        - name: server
          image: {{ include "upgradescope.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - serve
            # The listen port is not the Service port: the pod runs as a
            # non-root user with no capabilities, which cannot bind below 1024
            # on runtimes that do not lower net.ipv4.ip_unprivileged_port_start.
            - {{ printf "--listen=:%d" (int .Values.server.containerPort) | quote }}
            {{- if not $postgres }}
            - --db=/data/upgradescope.sqlite
            {{- end }}
            {{- if not (include "upgradescope.readTokenEnabled" .) }}
            # serve refuses an open read API on a non-loopback address
            # unless told otherwise; see server.readToken in values.yaml.
            - --allow-anonymous-read
            {{- end }}
            {{- with .Values.server.targets }}
            - {{ printf "--targets=%s" (join "," .) | quote }}
            {{- end }}
            - {{ printf "--retention=%v" .Values.server.retention | quote }}
            - {{ printf "--stale-after=%s" (include "upgradescope.staleAfter" .) | quote }}
            {{- if .Values.server.teamMap }}
            - "--team-map=/etc/upgradescope/team-map/team-map.yaml"
            {{- end }}
            {{- if $tls }}
            # HTTPS with the server.tls Secret. serve re-reads the pair when
            # the kubelet updates the mount (no subPath, so it can), so a
            # renewed certificate needs no restart.
            - --tls-cert-file=/etc/upgradescope/tls/tls.crt
            - --tls-key-file=/etc/upgradescope/tls/tls.key
            {{- end }}
            # The names serve answers for when it checks the Host (a trusted
            # team header, or a loopback --listen): the Service's, which the
            # in-chart agent pushes to, the Ingress host and
            # server.allowedHosts. Probes and scrapes of the pod's IP need
            # none: the guard answers for the address a request arrives on.
            {{- $svc := include "upgradescope.serverFullname" . }}
            {{- $hosts := list $svc (printf "%s.%s" $svc .Release.Namespace) (printf "%s.%s.svc" $svc .Release.Namespace) (include "upgradescope.serverFQDN" .) }}
            {{- if and .Values.server.ingress.enabled .Values.server.ingress.host }}
            {{- $hosts = append $hosts (lower .Values.server.ingress.host) }}
            {{- end }}
            {{- $hosts = concat $hosts .Values.server.allowedHosts | uniq }}
            - {{ printf "--allowed-host=%s" (join "," $hosts) | quote }}
            {{- range .Values.server.extraArgs }}
            - {{ . | quote }}
            {{- end }}
          # Tokens, webhook URLs and the database URL reach serve only
          # through the environment (it reads UPGRADESCOPE_* when the flag is
          # unset), never argv, and never appear in the Deployment: only the
          # Secrets hold them.
          env:
            {{- with $memLimit }}
            # 90% of the memory limit: the Go runtime does not read it.
            - name: GOMEMLIMIT
              value: {{ . | quote }}
            {{- end }}
            {{- if not $postgres }}
            # SQLite spills a large delete (the retention prune, deleting a
            # cluster) into a temp file, and the root filesystem is read-only:
            # without a writable temp directory the delete fails with
            # "disk I/O error (6410)" and history grows without bound.
            - name: SQLITE_TMPDIR
              value: /tmp
            {{- end }}
            {{- if .Values.server.sharedIngestToken }}
            - name: UPGRADESCOPE_INGEST_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "upgradescope.serverSecretName" . }}
                  key: ingestToken
                  {{- if and .Values.server.existingSecret (not .Values.agent.enabled) }}
                  # No in-chart agent: a hub may accept per-cluster tokens only.
                  optional: true
                  {{- end }}
            {{- end }}
            {{- if include "upgradescope.readTokenEnabled" . }}
            - name: UPGRADESCOPE_READ_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "upgradescope.serverSecretName" . }}
                  key: readToken
            {{- end }}
            {{- if include "upgradescope.adminTokenEnabled" . }}
            - name: UPGRADESCOPE_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "upgradescope.serverSecretName" . }}
                  key: adminToken
            {{- end }}
            {{- if $postgres }}
            - name: UPGRADESCOPE_DB_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.server.database.existingSecret }}
                  key: {{ .Values.server.database.key }}
            {{- end }}
            {{- if or .Values.server.existingSecret .Values.server.slackWebhook }}
            - name: UPGRADESCOPE_SLACK_WEBHOOK
              valueFrom:
                secretKeyRef:
                  name: {{ include "upgradescope.serverSecretName" . }}
                  key: slackWebhook
                  {{- if .Values.server.existingSecret }}
                  optional: true
                  {{- end }}
            {{- end }}
            {{- if or .Values.server.existingSecret .Values.server.webhook }}
            - name: UPGRADESCOPE_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "upgradescope.serverSecretName" . }}
                  key: webhook
                  {{- if .Values.server.existingSecret }}
                  optional: true
                  {{- end }}
            {{- end }}
            {{- if or .Values.server.existingSecret .Values.server.webhookSecret }}
            - name: UPGRADESCOPE_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "upgradescope.serverSecretName" . }}
                  key: webhookSecret
                  {{- if .Values.server.existingSecret }}
                  optional: true
                  {{- end }}
            {{- end }}
            {{- with .Values.server.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ int .Values.server.containerPort }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
              {{- if $tls }}
              scheme: HTTPS
              {{- end }}
            initialDelaySeconds: 5
            periodSeconds: 15
          # /readyz pings the database, so the pod leaves the Service while
          # it is unreachable; liveness (/healthz) never restarts it for that.
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
              {{- if $tls }}
              scheme: HTTPS
              {{- end }}
            initialDelaySeconds: 2
            periodSeconds: 5
          {{- with .Values.server.securityContext }}
          securityContext: {{- toYaml . | nindent 12 }}
          {{- end }}
          resources: {{- toYaml .Values.server.resources | nindent 12 }}
          {{- if or (not $postgres) .Values.server.teamMap $tls .Values.server.extraVolumeMounts }}
          volumeMounts:
            {{- if not $postgres }}
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
            {{- end }}
            {{- if .Values.server.teamMap }}
            - name: team-map
              mountPath: /etc/upgradescope/team-map
              readOnly: true
            {{- end }}
            {{- if $tls }}
            - name: tls
              mountPath: /etc/upgradescope/tls
              readOnly: true
            {{- end }}
            {{- with .Values.server.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
      {{- if or (not $postgres) .Values.server.teamMap $tls .Values.server.extraVolumes }}
      volumes:
        {{- if $tls }}
        - name: tls
          secret:
            secretName: {{ $tls }}
            items:
              - {key: tls.crt, path: tls.crt}
              - {key: tls.key, path: tls.key}
        {{- end }}
        {{- if not $postgres }}
        - name: data
          {{- if .Values.server.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "upgradescope.derived" (dict "root" . "suffix" "-server-data") }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        # SQLITE_TMPDIR: scratch space for a large delete (see server.tmp in
        # values.yaml). Node ephemeral storage, gone with the pod.
        - name: tmp
          emptyDir:
            sizeLimit: {{ .Values.server.tmp.sizeLimit | quote }}
        {{- end }}
        {{- if .Values.server.teamMap }}
        - name: team-map
          configMap:
            name: {{ include "upgradescope.derived" (dict "root" . "suffix" "-server-team-map") }}
        {{- end }}
        {{- with .Values.server.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
{{- end }}
