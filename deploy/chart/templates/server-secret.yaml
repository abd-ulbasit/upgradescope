{{- if and .Values.server.enabled (not .Values.server.existingSecret) }}
{{- $name := include "upgradescope.serverSecretName" . }}
{{- /* No ingestToken given: keep the one a previous install generated
       (lookup sees the live Secret on install/upgrade; helm template and
       GitOps renderers see nothing and get a fresh token), else generate. */}}
{{- $ingest := .Values.server.ingestToken }}
{{- if not $ingest }}
{{- $prev := (lookup "v1" "Secret" .Release.Namespace $name).data | default dict }}
{{- $ingest = get $prev "ingestToken" | b64dec | default (randAlphaNum 40) }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "upgradescope.labels" . | nindent 4 }}
type: Opaque
{{- /* Every key goes under data, not stringData: the API server turns
       stringData into data and keeps no record of it, so a key that an
       upgrade drops from stringData stays in the Secret and keeps working
       (a revoked read token, say). Under data, dropping a value removes its
       key. */}}
{{- $data := dict }}
{{- if .Values.server.sharedIngestToken }}
{{- $_ := set $data "ingestToken" $ingest }}
{{- end }}
{{- range $key := list "readToken" "slackWebhook" "webhook" "adminToken" "webhookSecret" }}
{{- with get $.Values.server $key }}
{{- $_ := set $data $key . }}
{{- end }}
{{- end }}
{{- with $data }}
data:
  {{- range $k, $v := . }}
  {{ $k }}: {{ $v | b64enc | quote }}
  {{- end }}
{{- end }}
{{- end }}
