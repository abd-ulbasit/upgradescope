{{- if and .Values.metrics.prometheusRule.enabled (or .Values.agent.enabled .Values.server.enabled) }}
{{- $agentJob := include "upgradescope.service" (dict "root" . "suffix" "-agent-metrics") }}
{{- $serverJob := include "upgradescope.serverService" . }}
{{- /* server.retention 0 (0, 0d, 0h...) keeps everything: no prune runs and
the server exports no retention series, so there is nothing to alert on. */}}
{{- $retentionOff := regexMatch "^(0+(\\.0*)?[dhms]?)+$" (toString .Values.server.retention) }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "upgradescope.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "upgradescope.labels" . | nindent 4 }}
    {{- with .Values.metrics.prometheusRule.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    {{- if .Values.agent.enabled }}
    - name: upgradescope-agent
      rules:
        - alert: UpgradescopeUpgradeBlocked
          expr: upgradescope_readiness_verdict{job="{{ $agentJob }}",verdict="blocked"} == 1
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: {{ `Upgrade to Kubernetes {{ $labels.target }} is blocked` | quote }}
            description: {{ `The upgradescope agent ({{ $labels.namespace }}/{{ $labels.pod }}) found blockers for target {{ $labels.target }}. kubectl get clusterreadiness -o yaml lists them.` | quote }}
        - alert: UpgradescopeVerdictUnknown
          expr: upgradescope_readiness_verdict{job="{{ $agentJob }}",verdict="unknown"} == 1
          for: 1h
          labels:
            severity: info
          annotations:
            summary: {{ `Upgrade readiness for {{ $labels.target }} has been unknown for over 1h` | quote }}
            description: {{ `No blockers were found for target {{ $labels.target }}, but a required check was not assessed, so the cluster cannot be called ready. status.notAssessed on the ClusterReadiness object says which and why (usually missing RBAC).` | quote }}
        - alert: UpgradescopeAgentNotTicking
          # Two missed intervals plus the 5m tick deadline, or no agent
          # being scraped at all. The job label is the one the chart's
          # ServiceMonitor produces: scraped any other way, give the job
          # this name or the absent() arm fires forever.
          expr: |-
            time() - upgradescope_agent_last_success_timestamp_seconds{job="{{ $agentJob }}"}
              > 2 * upgradescope_agent_interval_seconds{job="{{ $agentJob }}"} + 300
            or absent(up{job="{{ $agentJob }}"} == 1)
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: The upgradescope agent has not completed a tick recently
            description: {{ printf "The ClusterReadiness status is going stale. kubectl -n %s logs deploy/%s shows each tick's error." .Release.Namespace (include "upgradescope.derived" (dict "root" . "suffix" "-agent")) | quote }}
    {{- end }}
    {{- if .Values.server.enabled }}
    - name: upgradescope-server
      rules:
        - alert: UpgradescopeClusterStale
          expr: upgradescope_cluster_last_push_age_seconds{job="{{ $serverJob }}"} > {{ include "upgradescope.clusterStaleAfterSeconds" . }}
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: {{ `Cluster {{ $labels.cluster }} stopped pushing snapshots` | quote }}
            description: {{ `The upgradescope server has had no snapshot from {{ $labels.cluster }} for {{ $value | humanizeDuration }}. Its agent is down, cannot reach the server, or its token was revoked; the fleet view shows its last known state.` | quote }}
        {{- if not $retentionOff }}
        - alert: UpgradescopeRetentionStale
          # Three arms, for the three ways a server stops pruning. 1: the
          # last completed prune is over 2 days old (the server has run
          # that long since a success, and its daily prunes fail). 2: the
          # gauge is absent, because the first prune of the process never
          # completed, and the oldest process is over 2 days old. 3: the
          # gauge is absent and a failure has been counted: a prune failed
          # in a process that has completed none, however young it is, so
          # a server that restarts every hour or every 12h, whose startup
          # prune keeps failing, is covered where the other two never
          # hold. Arm 3 reads the counter's value and not its increase:
          # the startup prune fails within milliseconds, before the first
          # scrape of the new process, so the series is first seen at 1
          # and increase() over it is 0. The counter and the gauge both
          # restart with the process, so a process that has not failed
          # yet, or that restarted after a prune succeeded, counts 0 and
          # stays quiet. Job label as for the other server alerts.
          expr: |-
            time() - upgradescope_retention_last_success_timestamp_seconds{job="{{ $serverJob }}"} > 172800
            or
            (absent(upgradescope_retention_last_success_timestamp_seconds{job="{{ $serverJob }}"})
              and on() (time() - min(process_start_time_seconds{job="{{ $serverJob }}"}) > 172800))
            or
            (absent(upgradescope_retention_last_success_timestamp_seconds{job="{{ $serverJob }}"})
              and on() max(upgradescope_retention_prune_failures_total{job="{{ $serverJob }}"}) > 0)
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: The upgradescope server has not pruned its history in over 2 days
            description: {{ printf "Retention prunes fail or never finish, so the database keeps growing until the volume fills. kubectl -n %s logs deploy/%s shows the 'server: retention:' lines with the error; upgradescope_retention_prune_failures_total counts them. The server keeps serving: /readyz does not depend on it." .Release.Namespace (include "upgradescope.derived" (dict "root" . "suffix" "-server")) | quote }}
        {{- end }}
    {{- end }}
{{- end }}
