{{- if and .Values.server.enabled .Values.server.podDisruptionBudget.enabled (gt (int .Values.server.replicas) 1) }}
{{- /* Only with more than one replica: with one, minAvailable 1 would block
       every node drain. */}}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "upgradescope.serverFullname" . }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "upgradescope.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  {{- /* 0 is a value (a number is falsy in a template), "" and null are not. */}}
  {{- $pdb := .Values.server.podDisruptionBudget }}
  {{- $max := "" }}
  {{- if not (kindIs "invalid" $pdb.maxUnavailable) }}{{ $max = toString $pdb.maxUnavailable }}{{ end }}
  {{- $min := "" }}
  {{- if not (kindIs "invalid" $pdb.minAvailable) }}{{ $min = toString $pdb.minAvailable }}{{ end }}
  {{- if ne $max "" }}
  maxUnavailable: {{ $pdb.maxUnavailable }}
  {{- else if ne $min "" }}
  minAvailable: {{ $pdb.minAvailable }}
  {{- else }}
  {{- fail "server.podDisruptionBudget needs minAvailable or maxUnavailable: both are empty, which is not a budget. Set one, or server.podDisruptionBudget.enabled=false" }}
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "upgradescope.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: server
{{- end }}
