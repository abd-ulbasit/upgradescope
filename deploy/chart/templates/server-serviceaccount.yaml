{{- if and .Values.server.enabled .Values.server.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "upgradescope.serverServiceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "upgradescope.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
# No RBAC is bound to it and the pod mounts no token: serve never calls the
# Kubernetes API.
automountServiceAccountToken: false
{{- end }}
