{{- if and .Values.agent.enabled (include "upgradescope.pushEnabled" .) (not .Values.agent.existingSecret) .Values.agent.serverToken }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "upgradescope.agentTokenSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "upgradescope.labels" . | nindent 4 }}
type: Opaque
data:
  serverToken: {{ .Values.agent.serverToken | b64enc | quote }}
{{- end }}
