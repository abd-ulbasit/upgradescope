{{- if and .Values.server.enabled .Values.server.ingress.enabled }}
{{- $ing := .Values.server.ingress }}
{{- $host := required "server.ingress.host is required with server.ingress.enabled" $ing.host }}
{{- if and (include "upgradescope.readAnonymous" .) (not $ing.allowAnonymousRead) }}
{{- fail "server.ingress.enabled would publish an open read API (server.allowAnonymousRead=true, no read token): set server.ingress.allowAnonymousRead=true too when an auth layer such as oauth2-proxy fronts the Ingress, or drop server.allowAnonymousRead and mint read tokens (the chart then closes the read API: --require-read-credential)" }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "upgradescope.serverFullname" . }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "upgradescope.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
  {{- $annotations := $ing.annotations | default dict }}
  {{- if include "upgradescope.serverTLSSecret" . }}
  {{- /* serve speaks HTTPS (server.tls); the operator's own value wins. */}}
  {{- $annotations = merge (dict) $annotations (dict "nginx.ingress.kubernetes.io/backend-protocol" "HTTPS") }}
  {{- end }}
  {{- with $annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with $ing.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if $ing.tls.enabled }}
  tls:
    - hosts:
        - {{ $host | quote }}
      secretName: {{ $ing.tls.secretName | default (include "upgradescope.derived" (dict "root" . "suffix" "-server-tls")) }}
  {{- end }}
  rules:
    - host: {{ $host }}
      http:
        paths:
          - path: {{ $ing.path }}
            pathType: {{ $ing.pathType }}
            backend:
              service:
                name: {{ include "upgradescope.serverService" . }}
                port:
                  name: http
{{- end }}
