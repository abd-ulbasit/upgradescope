apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "upgradescope.fullname" . }}-agent
  namespace: {{ .Release.Namespace }}
  labels: {{- include "upgradescope.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "upgradescope.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: agent
  template:
    metadata:
      labels:
        {{- /* the selector labels below win: a duplicate key would be invalid YAML */}}
        {{- with omit .Values.agent.podLabels "app.kubernetes.io/name" "app.kubernetes.io/instance" "app.kubernetes.io/component" }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        app.kubernetes.io/name: {{ include "upgradescope.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: agent
      {{- with .Values.agent.podAnnotations }}
      annotations: {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "upgradescope.serviceAccountName" . }}
      {{- include "upgradescope.podOptions" (dict "root" . "c" .Values.agent) | trim | nindent 6 }}
      containers:
        - name: agent
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - agent
            - {{ printf "--interval=%s" .Values.agent.interval | quote }}
            - {{ printf "--cr-name=%s" .Values.agent.crName | quote }}
            - {{ printf "--team-label=%s" .Values.agent.teamLabel | quote }}
            - {{ printf "--manage-crd=%t" .Values.agent.manageCRD | quote }}
            - {{ printf "--health-addr=:%d" (int .Values.agent.healthPort) | quote }}
            - {{ printf "--log-format=%s" .Values.agent.logFormat | quote }}
            - {{ printf "--log-level=%s" .Values.agent.logLevel | quote }}
            {{- with .Values.agent.targets }}
            - {{ printf "--targets=%s" (join "," .) | quote }}
            {{- end }}
            {{- with .Values.agent.clusterName }}
            - {{ printf "--cluster-name=%s" . | quote }}
            {{- end }}
            {{- if include "upgradescope.pushEnabled" . }}
            - {{ printf "--server-url=%s" (include "upgradescope.serverUrl" .) | quote }}
            {{- end }}
            {{- range .Values.agent.extraArgs }}
            - {{ . | quote }}
            {{- end }}
          {{- if or (include "upgradescope.pushEnabled" .) .Values.agent.extraEnv }}
          env:
            {{- if include "upgradescope.pushEnabled" . }}
            # The push token reaches the agent only through the environment,
            # never argv (argv is readable via /proc/<pid>/cmdline).
            - name: UPGRADESCOPE_SERVER_TOKEN
              valueFrom:
                secretKeyRef: {{- include "upgradescope.agentTokenRef" . | nindent 18 }}
            {{- end }}
            {{- with .Values.agent.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
          # /healthz, /readyz and /metrics.
          ports:
            - name: http
              containerPort: {{ .Values.agent.healthPort }}
          # Liveness is the process: each tick runs under a deadline, so a
          # live agent always ticks again. Readiness means a tick succeeded
          # within two intervals, so `kubectl get pods` and Argo CD show an
          # agent that stopped evaluating.
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          {{- with .Values.agent.securityContext }}
          securityContext: {{- toYaml . | nindent 12 }}
          {{- end }}
          resources: {{- toYaml .Values.agent.resources | nindent 12 }}
          {{- with .Values.agent.extraVolumeMounts }}
          volumeMounts: {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.agent.extraVolumes }}
      volumes: {{- toYaml . | nindent 8 }}
      {{- end }}
