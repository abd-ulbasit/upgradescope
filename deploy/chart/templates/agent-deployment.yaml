{{- if .Values.agent.enabled }}
{{- $memLimit := include "upgradescope.goMemLimit" (dict "resources" .Values.agent.resources "extraEnv" .Values.agent.extraEnv) }}
{{- $serverCA := include "upgradescope.agentTrustsServerCA" . }}
{{- $caFile := include "upgradescope.agentServerCA" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "upgradescope.derived" (dict "root" . "suffix" "-agent") }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "upgradescope.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "upgradescope.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: agent
  template:
    metadata:
      labels:
        {{- /* the selector labels below win: a duplicate key would be invalid YAML */}}
        {{- with omit .Values.agent.podLabels "app.kubernetes.io/name" "app.kubernetes.io/instance" "app.kubernetes.io/component" }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        app.kubernetes.io/name: {{ include "upgradescope.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: agent
      {{- if or .Values.agent.podAnnotations .Values.agent.extraRegistry }}
      annotations:
        {{- with .Values.agent.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with .Values.agent.extraRegistry }}
        # agent reads --registry-dir at startup: roll the pod when it changes.
        checksum/registry: {{ toYaml . | sha256sum }}
        {{- end }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "upgradescope.serviceAccountName" . }}
      {{- include "upgradescope.podOptions" (dict "root" . "c" .Values.agent) | trim | nindent 6 }}
      containers:
        - name: agent
          image: {{ include "upgradescope.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - agent
            - {{ printf "--interval=%s" .Values.agent.interval | quote }}
            - {{ printf "--cr-name=%s" .Values.agent.crName | quote }}
            - {{ printf "--team-label=%s" .Values.agent.teamLabel | quote }}
            - {{ printf "--manage-crd=%t" .Values.agent.manageCRD | quote }}
            - {{ printf "--health-addr=:%d" (int .Values.agent.healthPort) | quote }}
            - {{ printf "--log-format=%s" .Values.agent.logFormat | quote }}
            - {{ printf "--log-level=%s" .Values.agent.logLevel | quote }}
            {{- with .Values.agent.targets }}
            - {{ printf "--targets=%s" (join "," .) | quote }}
            {{- end }}
            {{- with .Values.agent.clusterName }}
            - {{ printf "--cluster-name=%s" . | quote }}
            {{- end }}
            {{- if include "upgradescope.pushEnabled" . }}
            - {{ printf "--server-url=%s" (include "upgradescope.serverUrl" .) | quote }}
            {{- end }}
            {{- if $caFile }}
            # agent.serverCA, trusted for pushes on top of the image's roots.
            - "--server-ca-file=/etc/upgradescope/server-ca/ca.crt"
            {{- end }}
            {{- if .Values.agent.extraRegistry }}
            - "--registry-dir=/etc/upgradescope/registry"
            {{- end }}
            {{- range .Values.agent.extraArgs }}
            - {{ . | quote }}
            {{- end }}
          {{- if or (include "upgradescope.pushEnabled" .) .Values.agent.extraEnv $memLimit }}
          env:
            {{- with $memLimit }}
            # 90% of the memory limit: the Go runtime does not read it.
            - name: GOMEMLIMIT
              value: {{ . | quote }}
            {{- end }}
            {{- if and $serverCA (not (include "upgradescope.setsEnv" (dict "env" .Values.agent.extraEnv "name" "SSL_CERT_DIR"))) }}
            # Trust the in-chart server's CA (its TLS Secret's caKey, when it
            # has one) on top of the image's roots.
            - name: SSL_CERT_DIR
              value: /etc/upgradescope/server-ca
            {{- end }}
            {{- if include "upgradescope.pushEnabled" . }}
            # The push token reaches the agent only through the environment,
            # never argv (argv is readable via /proc/<pid>/cmdline).
            - name: UPGRADESCOPE_SERVER_TOKEN
              valueFrom:
                secretKeyRef: {{- include "upgradescope.agentTokenRef" . | nindent 18 }}
            {{- end }}
            {{- with .Values.agent.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
          # /healthz, /readyz and /metrics.
          ports:
            - name: http
              containerPort: {{ .Values.agent.healthPort }}
          # Liveness is the process: each tick runs under a deadline, so a
          # live agent always ticks again. Readiness means a tick succeeded
          # within two intervals, so `kubectl get pods` and Argo CD show an
          # agent that stopped evaluating.
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          {{- with .Values.agent.securityContext }}
          securityContext: {{- toYaml . | nindent 12 }}
          {{- end }}
          resources: {{- toYaml .Values.agent.resources | nindent 12 }}
          {{- if or $serverCA $caFile .Values.agent.extraRegistry .Values.agent.extraVolumeMounts }}
          volumeMounts:
            {{- if or $serverCA $caFile }}
            - name: server-ca
              mountPath: /etc/upgradescope/server-ca
              readOnly: true
            {{- end }}
            {{- if .Values.agent.extraRegistry }}
            - name: extra-registry
              mountPath: /etc/upgradescope/registry
              readOnly: true
            {{- end }}
            {{- with .Values.agent.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
      {{- if or $serverCA $caFile .Values.agent.extraRegistry .Values.agent.extraVolumes }}
      volumes:
        {{- with .Values.agent.serverCA }}
        {{- if .configMap }}
        - name: server-ca
          configMap:
            name: {{ .configMap }}
            items:
              - {key: {{ .key | quote }}, path: ca.crt}
        {{- else if .secret }}
        - name: server-ca
          secret:
            secretName: {{ .secret }}
            items:
              - {key: {{ .key | quote }}, path: ca.crt}
        {{- end }}
        {{- end }}
        {{- if $serverCA }}
        # Only the CA: the agent never sees the server's private key.
        - name: server-ca
          secret:
            secretName: {{ include "upgradescope.serverTLSSecret" . }}
            optional: true
            items:
              - {key: {{ .Values.server.tls.caKey | quote }}, path: ca.crt}
        {{- end }}
        {{- if .Values.agent.extraRegistry }}
        - name: extra-registry
          configMap:
            name: {{ include "upgradescope.derived" (dict "root" . "suffix" "-agent-registry") }}
        {{- end }}
        {{- with .Values.agent.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
{{- end }}
