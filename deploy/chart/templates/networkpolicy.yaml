{{- if and .Values.networkPolicy.enabled .Values.server.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "upgradescope.serverFullname" . }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "upgradescope.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "upgradescope.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: server
  policyTypes: ["Ingress"]
  ingress:
    - ports:
        - port: http
          protocol: TCP
      from:
        # This release's agent (snapshot pushes).
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ include "upgradescope.name" . }}
              app.kubernetes.io/instance: {{ .Release.Name }}
              app.kubernetes.io/component: agent
        {{- with .Values.networkPolicy.serverIngressFrom }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
{{- end }}
