{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "upgradescope.fullname" . }}-agent
  labels: {{- include "upgradescope.labels" . | nindent 4 }}
rules:
  # Every rule names its resources: no wildcard groups, resources or verbs,
  # so no subresource (nodes/proxy, pods/log, pods/exec) is ever covered.
  # Reads are get/list only; the agent polls, it never watches.
  #
  # versions: kube-system UID (cluster ID), namespace labels (teams),
  # kubelet versions, control-plane pods; add-ons: container images.
  - apiGroups: [""]
    resources: ["namespaces", "nodes", "pods"]
    verbs: ["get", "list"]
  # /version (server version) and /metrics (apiserver_requested_deprecated_apis:
  # who still calls deprecated APIs).
  - nonResourceURLs: ["/version", "/metrics"]
    verbs: ["get"]
  {{- if .Values.rbac.helmSecrets }}
  # Helm release detection reads Secrets of type helm.sh/release.v1. RBAC
  # cannot filter Secrets by type, so this is get/list on EVERY Secret in
  # the cluster. rbac.helmSecrets=false drops it; Helm releases are then
  # reported as not assessed.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list"]
  {{- end }}
  # --- files/kb-rbac-rules.yaml ---
  {{- .Files.Get "files/kb-rbac-rules.yaml" | nindent 2 }}
  {{- if .Values.agent.manageCRD }}
  # --manage-crd: keep the ClusterReadiness CRD schema in step with the
  # binary (server-side apply). Only that one CRD; no create, since crds/
  # installs it.
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    resourceNames: ["clusterreadinesses.upgradescope.dev"]
    verbs: ["get", "update", "patch"]
  {{- end }}
  # The ClusterReadiness CR: the agent creates it if missing (create cannot
  # be scoped by name), and writes only the one named agent.crName.
  - apiGroups: ["upgradescope.dev"]
    resources: ["clusterreadinesses"]
    verbs: ["get", "list", "create"]
  - apiGroups: ["upgradescope.dev"]
    resources: ["clusterreadinesses"]
    resourceNames: [{{ .Values.agent.crName | quote }}]
    verbs: ["update", "patch"]
  - apiGroups: ["upgradescope.dev"]
    resources: ["clusterreadinesses/status"]
    resourceNames: [{{ .Values.agent.crName | quote }}]
    verbs: ["get", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "upgradescope.fullname" . }}-agent
  labels: {{- include "upgradescope.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "upgradescope.fullname" . }}-agent
subjects:
  - kind: ServiceAccount
    name: {{ include "upgradescope.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
