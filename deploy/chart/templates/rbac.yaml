{{- if and .Values.agent.enabled .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "upgradescope.derived" (dict "root" . "suffix" "-agent") }}
  labels: {{- include "upgradescope.labels" . | nindent 4 }}
rules:
  # Every rule names its resources: no wildcard groups, resources or verbs,
  # so no subresource (nodes/proxy, pods/log, pods/exec) is ever covered.
  # Reads are get/list only; the agent polls, it never watches.
  #
  # versions: kube-system UID (cluster ID), namespace labels (teams),
  # kubelet versions, control-plane pods; add-ons: container images and
  # labels (and IngressClass controllers, which the KB rules below grant);
  # crds: CustomResourceDefinitions, also granted by the KB rules. No custom
  # resource is granted, so the agent cannot check which ones use a
  # deprecated or unserved CRD version, and reports crds as partial then.
  - apiGroups: [""]
    resources: ["namespaces", "nodes", "pods"]
    verbs: ["get", "list"]
  # /version (server version) and /metrics (apiserver_requested_deprecated_apis:
  # whether any client still calls deprecated APIs, not which).
  - nonResourceURLs: ["/version", "/metrics"]
    verbs: ["get"]
  {{- if and .Values.rbac.helmSecrets (not .Values.rbac.helmSecretsNamespaces) }}
  # Helm release detection lists Secrets labelled owner=helm metadata-only
  # and GETs one per release (Helm's default secrets driver). RBAC cannot
  # filter Secrets by label or type, so this is get/list on EVERY Secret in
  # the cluster. rbac.helmSecrets=false drops it and the ConfigMap rule
  # below; Helm releases are then reported as not assessed.
  # rbac.helmSecretsNamespaces replaces both with a Role per namespace (end
  # of this file).
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list"]
  # Releases stored by Helm's configmaps driver (HELM_DRIVER=configmap):
  # ConfigMaps labelled owner=helm, read the same way.
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list"]
  {{- end }}
  {{- if .Values.rbac.gitops.argocd }}
  # rbac.gitops.argocd: the charts Argo CD deploys, read from Application
  # spec.source and spec.sources (chart, repoURL, targetRevision). Only
  # applications; not AppProjects, ApplicationSets or the Secrets that hold
  # repository credentials.
  - apiGroups: ["argoproj.io"]
    resources: ["applications"]
    verbs: ["get", "list"]
  {{- end }}
  {{- if .Values.rbac.gitops.flux }}
  # rbac.gitops.flux: the charts Flux deploys, read from HelmRelease
  # spec.chart and spec.chartRef, and a chartRef to an OCIRepository (URL and
  # tag), listed (one list, not a GET per chartRef, #248; get is the
  # fallback where only that is granted).
  - apiGroups: ["helm.toolkit.fluxcd.io"]
    resources: ["helmreleases"]
    verbs: ["get", "list"]
  - apiGroups: ["source.toolkit.fluxcd.io"]
    resources: ["ocirepositories"]
    verbs: ["get", "list"]
  {{- end }}
  # --- files/kb-rbac-rules.yaml ---
  {{- .Files.Get "files/kb-rbac-rules.yaml" | nindent 2 }}
  {{- if .Values.agent.manageCRD }}
  # --manage-crd: keep the ClusterReadiness CRD schema in step with the
  # binary (server-side apply). Only that one CRD; no create, since crds/
  # installs it. manageCRD=false drops only this write rule: the KB rules
  # above still grant get/list on all CRDs (apiextensions v1beta1 is in the
  # KB).
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    resourceNames: ["clusterreadinesses.upgradescope.basit.engineer"]
    verbs: ["get", "update", "patch"]
  {{- end }}
  # The ClusterReadiness CR: the agent creates it if missing (create cannot
  # be scoped by name), and writes only the one named agent.crName.
  - apiGroups: ["upgradescope.basit.engineer"]
    resources: ["clusterreadinesses"]
    verbs: ["get", "list", "create"]
  - apiGroups: ["upgradescope.basit.engineer"]
    resources: ["clusterreadinesses"]
    resourceNames: [{{ .Values.agent.crName | quote }}]
    verbs: ["update", "patch"]
  - apiGroups: ["upgradescope.basit.engineer"]
    resources: ["clusterreadinesses/status"]
    resourceNames: [{{ .Values.agent.crName | quote }}]
    verbs: ["get", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "upgradescope.derived" (dict "root" . "suffix" "-agent") }}
  labels: {{- include "upgradescope.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "upgradescope.derived" (dict "root" . "suffix" "-agent") }}
subjects:
  - kind: ServiceAccount
    name: {{ include "upgradescope.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- if .Values.rbac.helmSecrets }}
{{- range .Values.rbac.helmSecretsNamespaces }}
---
# rbac.helmSecretsNamespaces: Helm release detection in this namespace only
# (the agent's --helm-namespaces), in place of the cluster-wide rules. Still
# get/list on EVERY Secret and ConfigMap of the namespace: RBAC cannot
# filter them by label or type.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "upgradescope.derived" (dict "root" $ "suffix" "-agent-helm") }}
  namespace: {{ . }}
  labels: {{- include "upgradescope.labels" $ | nindent 4 }}
rules:
  # Releases stored by Helm's secrets driver (the default), listed
  # metadata-only by the label owner=helm and read one GET per release.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list"]
  # Releases stored by Helm's configmaps driver, read the same way.
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "upgradescope.derived" (dict "root" $ "suffix" "-agent-helm") }}
  namespace: {{ . }}
  labels: {{- include "upgradescope.labels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "upgradescope.derived" (dict "root" $ "suffix" "-agent-helm") }}
subjects:
  - kind: ServiceAccount
    name: {{ include "upgradescope.serviceAccountName" $ }}
    namespace: {{ $.Release.Namespace }}
{{- end }}
{{- end }}
{{- end }}
