# Default values for upgradescope.

image:
  repository: ghcr.io/abd-ulbasit/upgradescope
  # Empty = the chart's appVersion, i.e. the release this chart was
  # published with. Release tags are immutable, so IfNotPresent is safe.
  tag: ""
  pullPolicy: IfNotPresent

serviceAccount:
  # Create the agent ServiceAccount. Set false to bring your own (set name).
  create: true
  name: ""

rbac:
  # Create the agent ClusterRole/ClusterRoleBinding. Every rule is listed
  # and explained in templates/rbac.yaml and the chart README: get/list on
  # namespaces, nodes, pods and the API group/resources the embedded KB
  # flags as deprecated; get on /version and /metrics; writes only to the
  # ClusterReadiness CR named agent.crName (and, with agent.manageCRD, to the
  # clusterreadinesses.upgradescope.dev CRD). No wildcards, no watch, no
  # subresources such as nodes/proxy or pods/log.
  create: true
  # Cluster-wide get/list on Secrets, for Helm release detection (Secrets of
  # type helm.sh/release.v1). RBAC cannot filter Secrets by type, so true
  # means the agent can read EVERY Secret in the cluster. false removes the
  # rule; the Helm collector then reports "not assessed (secrets list
  # forbidden)" and Helm chart findings are missing from the report.
  helmSecrets: true

agent:
  # Evaluation interval (minimum 1m).
  interval: 10m
  # Name of the ClusterReadiness object the agent manages.
  crName: cluster
  # Namespace label used for team attribution.
  teamLabel: team
  # Human-readable cluster name sent to the server (default: cluster UID).
  clusterName: ""
  # Keep the ClusterReadiness CRD schema in step with the agent binary at
  # startup (agent --manage-crd). Grants get/update/patch on that one CRD
  # only. The CRD itself is installed by the chart's crds/ directory; set
  # false when the CRD is managed elsewhere (e.g. GitOps) to drop all CRD
  # permissions.
  manageCRD: true
  # Target Kubernetes minors to evaluate, e.g. ["1.37", "1.38"], passed to
  # the agent as --targets. The chart never renders the ClusterReadiness
  # object: the agent creates it and, when targets is non-empty, resets
  # spec.targets to this list on every tick, so this value wins over
  # `kubectl edit`. Empty = the agent leaves spec.targets alone; set them
  # with `kubectl patch ucr cluster --type merge -p '{"spec":{"targets":["1.37"]}}'`
  # or let it default to the next minor above the server version.
  targets: []
  # URL of an upgradescope server to push snapshots to. Empty = CRD-only
  # mode. If server.enabled=true and this is empty, it defaults to the
  # in-chart server Service.
  serverUrl: ""
  # Bearer token for snapshot pushes, stored in a chart Secret. Ignored when
  # existingSecret is set. When both are empty and server.enabled=true, the
  # agent uses the in-chart server's ingest token (key ingestToken of its
  # Secret, generated or server.existingSecret).
  serverToken: ""
  # Name of an existing Secret with key "serverToken" (preferred over an
  # inline token for anything beyond dev). The token reaches the agent as
  # $UPGRADESCOPE_SERVER_TOKEN from a secretKeyRef, never as an argument.
  existingSecret: ""
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

server:
  # Run the upgradescope server in-cluster too (single-cluster combined
  # install). The agent will push to it automatically.
  enabled: false
  # Shared bearer token agents must present on POST /api/v1/snapshots.
  # Empty = the chart generates a random 40-character token into its Secret
  # on first install and keeps it on upgrades (Helm lookup). NOTES.txt
  # prints the command to read it back for agents in other clusters
  # (Secret <fullname>-server-tokens, e.g. upgradescope-server-tokens).
  # Renderers without cluster access (helm template, Argo CD) cannot look
  # the old token up and generate a new one on every render: under GitOps
  # set this or existingSecret. Ignored when existingSecret is set.
  ingestToken: ""
  # Optional bearer token for the read API. EMPTY = READ API IS OPEN —
  # acceptable behind a ClusterIP Service on a private cluster, but set one
  # before exposing the Service in any way. Ignored when existingSecret is
  # set (use readTokenFromSecret).
  readToken: ""
  # Name of an existing Secret to use instead of the chart's. Keys:
  #   ingestToken   required; the in-chart agent pushes with it too
  #   readToken     read when readTokenFromSecret=true
  #   slackWebhook  optional; Slack notifications when present
  #   webhook       optional; generic webhook when present
  existingSecret: ""
  # With existingSecret: protect the read API with its readToken key.
  readTokenFromSecret: false
  # Optional Slack incoming-webhook URL for finding-delta notifications.
  # Stored in the chart Secret and passed as $UPGRADESCOPE_SLACK_WEBHOOK; it
  # never appears in the Deployment. Ignored when existingSecret is set.
  slackWebhook: ""
  # Optional generic webhook URL (POSTs the Event JSON). Stored like
  # slackWebhook, as $UPGRADESCOPE_WEBHOOK_URL.
  webhook: ""
  # Extra targets evaluated on every accepted snapshot, e.g. ["1.37","1.38"].
  targets: []
  service:
    type: ClusterIP
    port: 8080
  persistence:
    # PVC for the SQLite database. false = emptyDir (history lost on
    # pod restart — demo only).
    enabled: true
    size: 1Gi
    storageClass: ""
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
