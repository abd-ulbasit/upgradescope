name: ci

on:
  push:
    branches: [main]
  pull_request:
  # Weekly, with no commit needed: new advisories reach the vuln DB, new
  # Kubernetes and Postgres patch images ship, and the published Action's
  # release-install path can break, whether or not anyone pushes. The
  # scheduled run is the vuln gate, the full Kubernetes (1.29-1.37) and
  # Postgres (14-18) matrices, the envtest apiserver matrix (1.24-1.28,
  # the same legs as on a PR), the Action check and KB freshness.
  schedule:
    - cron: '41 5 * * 1' # Mondays 05:41 UTC
  # On demand, from any branch: `gh workflow run ci.yml --ref <branch>`
  # proves the weekly matrices before the schedule does (a new kind node
  # image, a change to hack/e2e.sh); -f full-matrix=false runs the PR sets.
  # A dispatched run's checks land on the commit but do not count on a PR
  # (its check rollup ignores a workflow_dispatch suite, so they cannot
  # satisfy the required ci-ok there). A kb-refresh bot PR's own
  # pull_request runs are held for approval instead; kb-refresh.yml tries
  # to approve them, and otherwise a maintainer does (CONTRIBUTING.md).
  # Dispatching on a bot branch only checks it by hand.
  workflow_dispatch:
    inputs:
      full-matrix:
        description: 'Every Kubernetes minor in hack/kind-node-images.txt (1.29-1.37) and Postgres 14-18; false runs the PR sets'
        type: boolean
        default: true
      upload-fixture-sarif:
        description: "Upload the action job's fixture SARIF to code scanning, to check GitHub still accepts it (refused on the default branch, where its two blockers would be open alerts)"
        type: boolean
        default: false
  # release.yml calls this workflow for every v* tag, so a release is gated on
  # the whole suite, vuln gate and kind e2e included, at the tagged commit.
  workflow_call:
    inputs:
      # A called run carries the caller's event, so a release re-dispatched
      # on its tag would look like a workflow_dispatch here and take the
      # weekly sets: older kind images that may stop booting (see
      # hack/kind-node-images.txt), and the Action check against a release
      # that may be half-published. release: true keeps the PR sets.
      release:
        type: boolean
        default: false

# Least privilege: nothing here writes to the repository.
permissions:
  contents: read

# No cache on the release path (IR-22, #244). Any job can write the
# Actions cache with the runner's own token, whatever its permissions:
# block, and a run on a tag restores entries written on main, kb-refresh's
# job that builds freshly bumped, unreviewed modules included. So when
# release.yml calls this workflow (inputs.release, on a tag ref), every
# job restores nothing: setup-go cache false, no setup-node cache, the
# actions/cache step skipped. PRs, main and the schedule keep their
# caches. hack/release-caches_test.sh evaluates this and checks every
# step that could restore a cache.
env:
  RESTORE_CACHES: ${{ !inputs.release && github.ref_type != 'tag' }}

# A new push to a PR cancels that PR's superseded run (one group per PR).
# Everything else gets a group of its own: groups are repository-wide, and a
# PENDING run is cancelled whenever another run joins its group, even with
# cancel-in-progress false. When release.yml calls this workflow, github.* is
# the tag push (event push, the tagged sha), so without the ref a tag's CI
# would share main's group for the same commit and be cancelled by a re-run
# of main's kind e2e, or by tagging rc.1 and final on one commit, and the
# release would publish nothing. Keyed by event, ref and (outside PRs)
# commit, a tag run never shares a group with main or with another tag.
# hack/ci-concurrency_test.sh (make hack-test) evaluates this for each kind
# of run.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Third-party actions are pinned to commit SHAs (the comment names the
# release; Dependabot keeps both current). Every checkout drops its token
# (persist-credentials: false), and Go comes from go.mod, the same toolchain
# the Dockerfile builds with (make check-toolchain).
#
# Each job's core is one `make` target backed by a hack/ script, so a laptop
# reproduces a job byte for byte (CONTRIBUTING.md, "What CI runs"). Tools the
# scripts download (kind, kubectl, kubeconform, govulncheck, GoReleaser) are
# pinned in the scripts; kind/kubectl/kubeconform are also sha256-verified.
jobs:
  # Which areas a PR or main push touches, for the jobs too expensive to run
  # on everything: docs-only changes skip the kind e2e. Skipped on the
  # schedule, workflow_dispatch and release (tag) runs, which run everything.
  changes:
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read # paths-filter lists PR files through the API
    outputs:
      # hack/e2e.sh runs the server-gate command from the CI gate page, so
      # that one docs page counts as code for the e2e.
      e2e: ${{ (steps.code.outputs.e2e == 'true' || steps.code.outputs.e2e_doc == 'true') && 'true' || 'false' }}
      release: ${{ steps.paths.outputs.release }}
      action: ${{ steps.paths.outputs.action }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: code
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          # 'every': a file counts only if it matches all patterns, i.e. it
          # is anything other than docs.
          predicate-quantifier: every
          filters: |
            e2e:
              - '**'
              - '!docs/**'
              - '!**/*.md'
            e2e_doc:
              - 'docs/getting-started/ci-gate.md'
      # Two filters, one per job they gate: release-check (GoReleaser
      # snapshot and multi-arch images, the slowest PR job) runs only for
      # packaging changes; the action job for the action and the scan code
      # it drives. hack/action_test.sh (make action-test) keeps the
      # action's files in the action filter and out of the release one.
      - id: paths
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            release:
              - '.goreleaser.yml'
              - 'Dockerfile*'
              - '.github/workflows/release.yml'
              - '.github/workflows/ci.yml'
              # its asset="..." line: release-check matches it against the
              # archive names GoReleaser builds
              - 'action/run.sh'
              - 'Makefile'
              - 'hack/release-check.sh'
              - 'hack/check-asset-names.sh'
              - 'hack/check-host-leak.sh'
              - 'hack/dashboard-smoke.sh'
              # the sizes release-check compares with the build
              - 'hack/check-doc-sizes.sh'
              - 'hack/flags-diff.sh'
              - 'README.md'
              - 'docs/operations/install.md'
              - 'go.mod'
              - 'deploy/chart/Chart.yaml'
              # what the archives, packages and images ship besides the binary
              - 'tools/gen-docs/**'
              - 'LICENSE'
              - 'NOTICE'
              - 'THIRD_PARTY_NOTICES'
            action:
              - 'action.yml'
              - 'action/**'
              - 'hack/action_test.sh'
              - '.github/workflows/ci.yml'
              - 'Makefile'
              # run.sh drives the whole binary, so anything it is built from:
              # every package it links, the KB, registry and api/ schema data embedded in
              # it, and the module graph. hack/action_test.sh checks this
              # list against `go list -deps ./cmd/upgradescope`.
              - 'cmd/**'
              - 'internal/**'
              - 'api/**'
              - 'registry/**'
              - 'go.mod'
              - 'go.sum'

  lint:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: ${{ env.RESTORE_CACHES == 'true' }} # no cache on the release path (IR-22)
      # go vet + staticcheck, pinned in the Makefile: golangci-lint-action
      # lags Go releases, and an unpinned linter turns an upstream release
      # into a red build on an unrelated PR.
      - run: make lint

  test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: ${{ env.RESTORE_CACHES == 'true' }} # no cache on the release path (IR-22)
          cache-dependency-path: |
            go.sum
            tools/*/go.sum
      # gofmt, go vet and go test -race -count=1, main module and every
      # tools/ module. The ITs stay env-gated, so this is the unit set.
      - run: make test
      # The golang base image pins GOTOOLCHAIN=local, so a Dockerfile behind
      # go.mod's `go` directive fails at `go mod download` (the images and
      # kube jobs); GoReleaser must be one pinned version that go.mod's Go
      # can build (make release-check).
      - run: make check-toolchain
      # The hack/ scripts every other job runs, driven offline through their
      # pass, fail and fail-closed paths with stubs and fixtures.
      - run: make hack-test
      # docs/claims.md maps each public claim to its tests; a renamed or
      # deleted test, e2e gate or job it names fails here.
      - name: every test the claims ledger names exists
        run: make claims-check

  # The heap-bound tests skip (or shrink) under the race detector, so
  # `make test` above never runs them in full; they are the proofs the
  # claims ledger and docs/operations.md cite for the server's memory
  # bounds. hack/test-heap.sh finds every test that reads raceEnabled and
  # runs it without -race, failing on a skip. They take ~11.5 minutes on
  # an Apple silicon laptop; a hosted runner is slower.
  test-heap:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: ${{ env.RESTORE_CACHES == 'true' }} # no cache on the release path (IR-22)
      - run: make test-heap

  # The binary and the dashboard it embeds, then every package (tests
  # included) compiled and vetted for each platform the release ships: lint
  # and test run on linux only, and a windows- or darwin-only break would
  # otherwise first fail in a tag's CI (#128), long after its PR merged.
  build:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: ${{ env.RESTORE_CACHES == 'true' }} # no cache on the release path (IR-22)
      - run: make build
      # The real go:embed bundle through Server's routing: GET / and every
      # asset index.html references, each 200 with its content type. A 200
      # index.html whose JS and CSS 404 is a blank dashboard (#128).
      - name: the binary serves the dashboard and every asset it references
        run: make dashboard-smoke
      - name: compile for linux, darwin and windows (amd64, arm64)
        run: make cross-build
      # The README's `go install` path: the binary names a real version
      # and commit, and serves the dashboard with every asset it references.
      - run: make go-install-check

  # THIRD_PARTY_NOTICES (shipped in every archive, package and image) is
  # current, and every Go module and bundled npm package carries a license
  # on the allowlist: unknown, GPL, AGPL and SSPL fail the build.
  notices:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: ${{ env.RESTORE_CACHES == 'true' }} # no cache on the release path (IR-22)
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24' # the Dockerfile's
          package-manager-cache: false # only the cache: below, which the release path turns off (IR-22)
          cache: ${{ env.RESTORE_CACHES == 'true' && 'npm' || '' }}
          cache-dependency-path: web/package-lock.json
      - run: make notices-check

  # Reachable vulnerabilities in the shipped binary. Weekly too, because new
  # advisories land without any commit here.
  vuln:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: ${{ env.RESTORE_CACHES == 'true' }} # no cache on the release path (IR-22)
      # The gate lives in hack/vulncheck.sh so `make vuln` reproduces it byte
      # for byte on a laptop. It pins govulncheck, scans the linux/amd64
      # binary, and fails closed; accepted advisories are in
      # hack/vuln-allowlist.txt, one ID each, with an expiry.
      - name: vuln gate self-test (stub scanner, offline)
        run: make vuln-test
      - name: govulncheck (binary mode, per-advisory allowlist)
        run: make vuln
      # The CI-only Renovate validator's lockfile (hack/renovate), bumped by
      # hand: an advisory not accepted in hack/renovate/osv-scanner.toml,
      # with a reason and an expiry, fails here, weekly too (#244).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24' # Renovate's engines
          package-manager-cache: false # only the cache: below, which the release path turns off (IR-22)
      - name: npm audit of hack/renovate (per-advisory ignore list)
        run: make renovate-audit

  # Dashboard: npm ci, vitest, typecheck + vite build, production advisories,
  # and the committed go:embed copy equals the fresh build.
  web:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # The maintained LTS lines; the Dockerfile builds on 24.
        node: ['22', '24']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false # only the cache: below, which the release path turns off (IR-22)
          cache: ${{ env.RESTORE_CACHES == 'true' && 'npm' || '' }}
          cache-dependency-path: web/package-lock.json
      - run: make web-test

  # Chart: lint --strict, the values render matrix, kubeconform on every
  # render at 1.29 and 1.37, and hack/test-chart.sh's contract assertions,
  # which run Go tests (deploy/chart, and tools/promrule-test, which
  # evaluates the PrometheusRule expressions with the Prometheus PromQL
  # engine). So the job has the go.mod toolchain and the Go caches, keyed on
  # the main go.sum and every tools/ one, like the test job.
  # timeout-minutes is 15, up from 10. Estimate: a cold run (a cache miss, or
  # the release path, which restores no cache) downloads 94 modules (~800 MB,
  # ~100 s on the dev laptop's network) and compiles 781 packages (32 s wall,
  # 120 s CPU on 8 cores), so ~2 to 4 min of Go work on a 4-vCPU hosted
  # runner, on top of the job's lint, render matrix and kubeconform, whose
  # time was not measured. A warm run is the 31 s measured with warm caches.
  helm:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: ${{ env.RESTORE_CACHES == 'true' }} # no cache on the release path (IR-22)
          cache-dependency-path: |
            go.sum
            tools/*/go.sum
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.0 # keep in step with the kube job and release.yml HELM_VERSION
      - run: make helm-test

  # The example policies and the Renovate preset under examples/, without a
  # cluster: kyverno test and gator verify (pinned, sha256-verified) against
  # ready, not-ready, stale, unassessed and missing ClusterReadiness fixtures,
  # and renovate-config-validator (pinned in hack/renovate) on the preset.
  examples:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24' # Renovate's engines
          package-manager-cache: false # only the cache: below, which the release path turns off (IR-22)
      - run: make examples-test

  # Every Dockerfile for both architectures the release publishes, pushing
  # nothing. The from-source build cross-compiles from the runner's platform
  # and Dockerfile.release only COPYs a binary, so no emulation is needed.
  images:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        dockerfile: [Dockerfile, Dockerfile.release]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/dockerhub-mirror # Docker Hub's anonymous pull limit (429): pull through mirror.gcr.io
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod # Dockerfile.release's binaries are built on the runner
          cache: ${{ env.RESTORE_CACHES == 'true' }} # no cache on the release path (IR-22)
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          cache-binary: false # it installs no buildx (no version: input); never from the Actions cache
          # The docker-container builder runs its own BuildKit, which does not
          # read the daemon's registry-mirrors: give it the mirror too (the
          # dockerhub-mirror step above covers the daemon, which pulls the
          # builder image itself). That image is pinned by digest, the one
          # buildx-stable-1 names today: the mirror serves a digest from its
          # cache, but the first pull of the moving tag in a job went to
          # Docker Hub and timed out. Bump it by hand, in every workflow
          # (hack/dockerhub-mirror_test.sh checks they agree).
          driver-opts: image=moby/buildkit:buildx-stable-1@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]
      - name: build ${{ matrix.dockerfile }} (linux/amd64, linux/arm64)
        env:
          IMAGES_DOCKERFILES: ${{ matrix.dockerfile }}
        run: make images

  # When a branch changes registry/: its entries validate, and they match the
  # live endoflife.date data. On PRs (kb-refresh's registry PR included, once
  # its held run is approved), and on a dispatched run, e.g. by hand on a
  # bot branch, which is diffed against the default branch. Not on a release
  # re-dispatch: upstream drift must not gate a tag.
  # hack/kb-refresh-ci_test.sh (make hack-test) runs the diff step against a
  # scratch remote.
  registry:
    name: registry dataset valid + in sync with endoflife.date
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && !inputs.release)
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The three-dot diff below needs the merge base: in a depth-1
          # checkout it found none, and the job passed without checking.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: ${{ env.RESTORE_CACHES == 'true' }} # no cache on the release path (IR-22)
      - name: Did this branch touch registry/?
        id: changed
        env:
          BASE: ${{ github.base_ref || github.event.repository.default_branch }}
        run: |
          git fetch --no-tags origin "$BASE"
          # An assignment, so a failed diff fails the step rather than
          # reading as "registry/ untouched".
          files="$(git diff --name-only "origin/$BASE...HEAD")"
          if grep -q '^registry/' <<<"$files"; then
            echo "registry=true" >> "$GITHUB_OUTPUT"
          else
            echo "registry=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Validate registry entries
        if: steps.changed.outputs.registry == 'true'
        run: go test ./registry/ -count=1
      - name: Registry in sync with endoflife.date
        if: steps.changed.outputs.registry == 'true'
        run: make eol-check

  # The Postgres majors pg-conformance runs on, from hack/pg-images.txt, each
  # pinned by digest (#244: postgres:<major> was pulled by its moving tag,
  # in the release-gating run too): 17 on PRs, pushes and releases, 14-18
  # on the schedule and on demand (workflow_dispatch, unless
  # full-matrix=false), by the same rule as the kube job's minors.
  # hack/pg-images_test.sh covers the table and this wiring.
  pg-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      images: ${{ steps.matrix.outputs.images }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: matrix
        env:
          EVENT: ${{ github.event_name }}
          RELEASE: ${{ inputs.release == true }}
          FULL_MATRIX: ${{ inputs.full-matrix }}
        run: |
          set="$(hack/kind-images.sh set "$EVENT" "$RELEASE" "$FULL_MATRIX")"
          images="$(hack/pg-images.sh matrix "$set")"
          echo "Postgres images ($set): $images"
          echo "images=$images" >> "$GITHUB_OUTPUT"

  # Store conformance against a real Postgres: 17 on every PR and push, the
  # supported range 14-18 on the schedule (and on demand).
  pg-conformance:
    name: postgres store conformance (postgres:${{ matrix.pg }})
    needs: pg-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.pg-matrix.outputs.images) }}
    services:
      postgres:
        # zizmor cannot follow a matrix built from a job output, so it cannot
        # see the digest: every row is postgres:<major>@sha256:<index digest>
        # from hack/pg-images.txt, which hack/pg-images.sh rejects unless
        # pinned (hack/pg-images_test.sh checks this line and that no other
        # workflow line ignores a zizmor audit).
        # Services start before the first step, so the daemon mirror
        # (.github/actions/dockerhub-mirror, whose restart would kill them)
        # cannot apply: the image is pulled by name from mirror.gcr.io, the
        # same digest Docker Hub serves (hack/dockerhub-mirror_test.sh).
        image: mirror.gcr.io/library/${{ matrix.image }} # zizmor: ignore[unpinned-images] pinned by digest in hack/pg-images.txt
        env:
          POSTGRES_PASSWORD: ci-test
          POSTGRES_DB: upgradescope
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d upgradescope"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: ${{ env.RESTORE_CACHES == 'true' }} # no cache on the release path (IR-22)
      - name: wait for postgres (entrypoint restarts once after initdb)
        run: |
          for _ in $(seq 1 60); do
            if PGPASSWORD=ci-test psql -h 127.0.0.1 -p 5432 -U postgres -d upgradescope -c 'SELECT 1' >/dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          echo "::error::postgres not ready after 60s"
          exit 1
      # With a DSN, hack/pg-test.sh uses this service instead of starting a
      # container, and fails if the conformance suite skipped.
      - run: make pg-test
        env:
          UPGRADESCOPE_PG_TEST_DSN: postgres://postgres:ci-test@127.0.0.1:5432/upgradescope?sslmode=disable

  # Prove the packaging before a tag does, on packaging changes: config
  # valid for the pinned GoReleaser, every archive and per-arch image builds,
  # archive names still match what the Action downloads, and the binary
  # serves the dashboard and its assets. Publishes and signs nothing. Code
  # changes get the cross-platform compile and dashboard check in the build
  # job instead.
  release-check:
    needs: changes
    if: >-
      !cancelled() && github.event_name != 'schedule' &&
      (needs.changes.outputs.release == 'true' || needs.changes.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # goreleaser derives the snapshot version from tags
          persist-credentials: false
      - uses: ./.github/actions/dockerhub-mirror # Docker Hub's anonymous pull limit (429): pull through mirror.gcr.io
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: ${{ env.RESTORE_CACHES == 'true' }} # no cache on the release path (IR-22)
      # In snapshot mode dockers_v2 still builds (and --loads, never pushes)
      # the linux/amd64 and linux/arm64 images from Dockerfile.release.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          cache-binary: false # it installs no buildx (no version: input); never from the Actions cache
          # The docker-container builder runs its own BuildKit, which does not
          # read the daemon's registry-mirrors: give it the mirror too (the
          # dockerhub-mirror step above covers the daemon, which pulls the
          # builder image itself). That image is pinned by digest, the one
          # buildx-stable-1 names today: the mirror serves a digest from its
          # cache, but the first pull of the moving tag in a job went to
          # Docker Hub and timed out. Bump it by hand, in every workflow
          # (hack/dockerhub-mirror_test.sh checks they agree).
          driver-opts: image=moby/buildkit:buildx-stable-1@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]
      - run: make release-check
      # The CLI as the last release shipped it against this tree, through
      # `--help`: a removed flag, a changed default or usage line must be
      # named under CHANGELOG.md's Changed (#167). Needs the tags, hence the
      # full checkout above. It runs where the changelog is judged, with the
      # release; hack/flags-diff.sh is a release input, and `make flags-diff`
      # runs it before a release PR.
      - name: every CLI break since the last release is in the changelog
        run: make flags-diff

  # The Action as a consumer runs it, on Linux and macOS runners. make
  # action-test drives action/run.sh offline (input validation, the
  # checksum-verified install, outputs, annotations, step summary, an
  # injection payload). Then, for real:
  #   - action/action.yml (the original path) installs the latest release
  #     archive, sha256-checked against its checksums.txt (not the go
  #     install fallback), and fails the gate on a removed API;
  #   - action.yml (the root, Marketplace path) runs this tree's binary
  #     (version: preinstalled) on a removed API and on a clean set, then
  #     with an ignore rule per removed API (config: the gate passes, the
  #     summary lists them as suppressed) and against a baseline (only the
  #     new finding fails the gate; write-baseline's file then passes it).
  # On main, the SARIF goes to code scanning, proving GitHub accepts it.
  action:
    needs: changes
    if: >-
      !cancelled() &&
      (github.event_name == 'schedule' ||
       (github.event_name == 'workflow_dispatch' && !inputs.release) ||
       needs.changes.outputs.action == 'true')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write # upload-sarif below, on a dispatched fixture run only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: ${{ env.RESTORE_CACHES == 'true' }} # no cache on the release path (IR-22)
      - run: make action-test

      - id: release
        uses: ./action
        continue-on-error: true # the gate is expected to fail
        with:
          path: action/testdata/removed # networking.k8s.io/v1beta1 Ingress, batch/v1beta1 CronJob
          target: '1.36'
          version: latest
      - name: release archive verified and installed, gate failed with exit 2, outputs set
        env:
          OUTCOME: ${{ steps.release.outcome }}
          SARIF: ${{ steps.release.outputs.sarif-file }}
          VERDICT: ${{ steps.release.outputs.verdict }}
          BLOCKERS: ${{ steps.release.outputs.blockers }}
        run: |
          set -uo pipefail
          [ "$OUTCOME" = failure ] || { echo "::error::gate step outcome=$OUTCOME, want failure"; exit 1; }
          got="$(command -v upgradescope)"
          [ "$got" = "$RUNNER_TEMP/upgradescope-bin/upgradescope" ] \
            || { echo "::error::upgradescope resolved to '$got', not the release archive (go install fallback?)"; exit 1; }
          upgradescope --version
          code=0
          upgradescope scan --files action/testdata/removed --target 1.36 --output sarif > /dev/null || code=$?
          [ "$code" -eq 2 ] || { echo "::error::scan exit code $code, want 2 (gate failed)"; exit 1; }
          jq -e '[.runs[0].results[] | select(.level == "error")] | length > 0' "$SARIF" \
            || { echo "::error::SARIF at $SARIF has no error-level result"; exit 1; }
          [ "$VERDICT" = blocked ] && [ "$BLOCKERS" -gt 0 ] \
            || { echo "::error::outputs verdict='$VERDICT' blockers='$BLOCKERS', want blocked and > 0"; exit 1; }

      # The real provenance check: latest above is v0.1.x, which predates
      # provenance, so the install takes the warning path. v0.2.0-rc.2 has
      # attestations; the action must verify one with the runner's gh and
      # this job's token, then install the archive. A later step cannot read
      # an earlier one's log, so a gh ahead of the runner's on PATH records
      # each call the action makes (arguments and exit status) for the check
      # after it.
      - name: record the gh calls of the next step
        run: |
          set -euo pipefail
          real="$(command -v gh)"
          mkdir -p "$RUNNER_TEMP/gh-spy"
          {
            echo '#!/usr/bin/env bash'
            echo 'rc=0'
            printf '%q "$@" || rc=$?\n' "$real"
            printf 'printf "rc=%%s gh %%s\\n" "$rc" "$*" >> %q\n' "$RUNNER_TEMP/gh-calls.log"
            echo 'exit "$rc"'
          } > "$RUNNER_TEMP/gh-spy/gh"
          chmod +x "$RUNNER_TEMP/gh-spy/gh"
          cat "$RUNNER_TEMP/gh-spy/gh"
          echo "$RUNNER_TEMP/gh-spy" >> "$GITHUB_PATH"
      - id: attested
        uses: ./action
        with:
          path: action/testdata/clean
          target: '1.36'
          fail-on: never # this step tests the install; the gate is tested above and below
          version: v0.2.0-rc.2
      - name: v0.2.0-rc.2 verified with gh attestation verify, then installed from its archive
        run: |
          set -uo pipefail
          fail() { echo "::error::$*"; exit 1; }
          case "$(uname -s)/$(uname -m)" in
            Linux/x86_64) asset=upgradescope_linux_amd64.tar.gz ;;
            Linux/aarch64) asset=upgradescope_linux_arm64.tar.gz ;;
            Darwin/x86_64) asset=upgradescope_darwin_amd64.tar.gz ;;
            Darwin/arm64) asset=upgradescope_darwin_arm64.tar.gz ;;
            *) fail "unexpected runner $(uname -s)/$(uname -m)" ;;
          esac
          cat "$RUNNER_TEMP/gh-calls.log" || fail "the action ran no gh"
          [ "$(wc -l < "$RUNNER_TEMP/gh-calls.log")" -eq 1 ] || fail "the action ran gh more than once"
          want="rc=0 gh attestation verify $RUNNER_TEMP/upgradescope-dl."
          want2="/$asset --repo abd-ulbasit/upgradescope --signer-workflow abd-ulbasit/upgradescope/.github/workflows/release.yml --source-ref refs/tags/v0.2.0-rc.2 --deny-self-hosted-runners"
          got="$(cat "$RUNNER_TEMP/gh-calls.log")"
          case "$got" in
            "$want"*"$want2") ;;
            *) fail "want one passing '${want}XXXXXX$want2'" ;;
          esac
          got="$(command -v upgradescope)"
          [ "$got" = "$RUNNER_TEMP/upgradescope-bin/upgradescope" ] \
            || fail "upgradescope resolved to '$got', not the release archive"
          version="$(upgradescope --version | sed -n 1p)"
          [ "$version" = "upgradescope 0.2.0-rc.2" ] || fail "upgradescope --version says '$version', want 'upgradescope 0.2.0-rc.2'"

      # This tree's binary first on PATH, for version: preinstalled.
      - run: make build && echo "$GITHUB_WORKSPACE/bin" >> "$GITHUB_PATH"
      - id: removed
        uses: ./
        continue-on-error: true # the gate is expected to fail
        with:
          path: action/testdata/removed
          target: '1.36'
          version: preinstalled
      - id: clean
        uses: ./
        continue-on-error: true # asserted below, with a reason on failure
        with:
          path: action/testdata/clean
          target: '1.36'
          version: preinstalled
      - name: root action fails on removed APIs, passes a clean set, outputs set
        env:
          REMOVED_OUTCOME: ${{ steps.removed.outcome }}
          REMOVED_OUTPUTS: ${{ toJSON(steps.removed.outputs) }}
          CLEAN_OUTCOME: ${{ steps.clean.outcome }}
          CLEAN_OUTPUTS: ${{ toJSON(steps.clean.outputs) }}
        run: |
          set -uo pipefail
          fail() { echo "::error::$*"; exit 1; }
          got="$(command -v upgradescope)"
          [ "$got" = "$GITHUB_WORKSPACE/bin/upgradescope" ] || fail "upgradescope resolved to '$got', not this tree's build"
          echo "removed: $REMOVED_OUTCOME $REMOVED_OUTPUTS"
          echo "clean: $CLEAN_OUTCOME $CLEAN_OUTPUTS"
          [ "$REMOVED_OUTCOME" = failure ] || fail "removed-API gate outcome=$REMOVED_OUTCOME, want failure"
          jq -e '.verdict == "blocked" and .ready == "false" and .blockers == "2" and .warnings == "0"
                 and (.score | tonumber) < 100' <<<"$REMOVED_OUTPUTS" \
            || fail "removed-API outputs are not blocked with 2 blockers"
          sarif="$(jq -r '."sarif-file"' <<<"$REMOVED_OUTPUTS")"
          jq -e '.runs[0].results | length == 2 and all(.[]; .locations[0].physicalLocation.artifactLocation.uri == "action/testdata/removed/all.yaml")' "$sarif" \
            || fail "SARIF at $sarif does not place both results in action/testdata/removed/all.yaml"
          jq -e '.findings | length == 2' "$(jq -r '."report-json"' <<<"$REMOVED_OUTPUTS")" \
            || fail "report-json does not hold the 2 findings"
          [ "$CLEAN_OUTCOME" = success ] || fail "clean gate outcome=$CLEAN_OUTCOME, want success"
          jq -e '.verdict == "ready" and .ready == "true" and .score == "100" and .blockers == "0" and .warnings == "0"' <<<"$CLEAN_OUTPUTS" \
            || fail "clean outputs are not ready, 100, 0 blockers, 0 warnings"

      # An ignore rule per removed API: the gate passes (exit 0).
      - id: suppressed
        uses: ./
        continue-on-error: true # asserted below, with a reason on failure
        with:
          path: action/testdata/removed
          target: '1.36'
          version: preinstalled
          config: action/testdata/ignore-removed.yaml
      # A baseline holding only the CronJob: the Ingress is new and fails
      # the gate. The step writes the full baseline the next one reads,
      # against which nothing is new.
      - id: baseline
        uses: ./
        continue-on-error: true # the gate is expected to fail
        with:
          path: action/testdata/removed
          target: '1.36'
          version: preinstalled
          baseline: action/testdata/baseline-cronjob.json
          write-baseline: ${{ runner.temp }}/upgradescope-baseline.json
      - id: rebaselined
        uses: ./
        continue-on-error: true # asserted below, with a reason on failure
        with:
          path: action/testdata/removed
          target: '1.36'
          version: preinstalled
          baseline: ${{ runner.temp }}/upgradescope-baseline.json
      - name: ignore rules and baselines decide the gate, and the summary says why
        env:
          SUPPRESSED_OUTCOME: ${{ steps.suppressed.outcome }}
          SUPPRESSED_OUTPUTS: ${{ toJSON(steps.suppressed.outputs) }}
          BASELINE_OUTCOME: ${{ steps.baseline.outcome }}
          BASELINE_OUTPUTS: ${{ toJSON(steps.baseline.outputs) }}
          REBASELINED_OUTCOME: ${{ steps.rebaselined.outcome }}
          REBASELINED_OUTPUTS: ${{ toJSON(steps.rebaselined.outputs) }}
        run: |
          set -uo pipefail
          fail() { echo "::error::$*"; exit 1; }
          summary() { jq -r '."summary-file"' <<<"$1"; }
          echo "suppressed: $SUPPRESSED_OUTCOME $SUPPRESSED_OUTPUTS"
          echo "baseline: $BASELINE_OUTCOME $BASELINE_OUTPUTS"
          echo "rebaselined: $REBASELINED_OUTCOME $REBASELINED_OUTPUTS"

          [ "$SUPPRESSED_OUTCOME" = success ] || fail "suppressed gate outcome=$SUPPRESSED_OUTCOME, want success"
          jq -e '.verdict == "ready" and .blockers == "0" and .suppressed == "2"' <<<"$SUPPRESSED_OUTPUTS" \
            || fail "suppressed outputs are not ready with 0 blockers and 2 suppressed"
          s="$(summary "$SUPPRESSED_OUTPUTS")"
          grep -qF 'No findings left after suppression.' "$s" && grep -qF '**Suppressed (2).**' "$s" \
            && grep -qF "shop's legacy Ingress is replaced before the upgrade (test fixture)" "$s" \
            || fail "summary at $s does not list the suppressed findings with their reasons"

          [ "$BASELINE_OUTCOME" = failure ] || fail "baseline gate outcome=$BASELINE_OUTCOME, want failure (new Ingress)"
          jq -e '.verdict == "blocked" and .blockers == "2" and ."new-blockers" == "1"' <<<"$BASELINE_OUTPUTS" \
            || fail "baseline outputs are not 2 blockers, 1 new"
          s="$(summary "$BASELINE_OUTPUTS")"
          grep -qF '**Baseline:** 1 new, 1 unchanged.' "$s" && grep -qF '| blocker | **new** | networking.k8s.io/v1beta1 Ingress' "$s" \
            || fail "summary at $s does not mark the Ingress new against the baseline"
          jq -e '.findings | length == 2' "$RUNNER_TEMP/upgradescope-baseline.json" \
            || fail "write-baseline did not write both findings"

          [ "$REBASELINED_OUTCOME" = success ] || fail "rebaselined gate outcome=$REBASELINED_OUTCOME, want success (nothing new)"
          jq -e '.verdict == "blocked" and .blockers == "2" and ."new-blockers" == "0"' <<<"$REBASELINED_OUTPUTS" \
            || fail "rebaselined outputs are not 2 blockers, 0 new"
          grep -qF '**Baseline:** 0 new, 2 unchanged.' "$(summary "$REBASELINED_OUTPUTS")" \
            || fail "rebaselined summary does not say nothing is new"

      # The fixture's SARIF holds two blockers on purpose. Uploaded from main
      # (as every push did until #244), they became open error alerts in the
      # public Security tab, which read as the project failing its own gate.
      # The SARIF the binary writes is checked against what code scanning
      # requires by TestWriteGitHubAcceptable, and its locations above. To
      # see GitHub itself accept it, dispatch this workflow on a branch other
      # than the default with upload-fixture-sarif: the alerts are then
      # filed under that branch, in a category of their own, and never on
      # main. hack/ci-sarif_test.sh pins this condition.
      - name: GitHub code scanning accepts the SARIF
        if: >-
          github.event_name == 'workflow_dispatch' && inputs.upload-fixture-sarif == true &&
          github.ref != format('refs/heads/{0}', github.event.repository.default_branch) &&
          matrix.os == 'ubuntu-latest'
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: ${{ steps.removed.outputs.sarif-file }}
          category: upgradescope-action-fixture

  # The Kubernetes minors the kube job runs on, from
  # hack/kind-node-images.txt: the `pr` rows (1.31, the oldest with the
  # flowcontrol v1beta3 window, and 1.37, the newest) on PRs, pushes and
  # releases; every minor 1.29-1.37 on the schedule and on demand
  # (workflow_dispatch, unless full-matrix=false). hack/kind-images.sh set
  # makes that choice; hack/kind-images_test.sh covers each kind of run.
  kube-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      minors: ${{ steps.matrix.outputs.minors }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: matrix
        env:
          EVENT: ${{ github.event_name }}
          RELEASE: ${{ inputs.release == true }}
          FULL_MATRIX: ${{ inputs.full-matrix }}
        run: |
          set="$(hack/kind-images.sh set "$EVENT" "$RELEASE" "$FULL_MATRIX")"
          minors="$(hack/kind-images.sh matrix "$set")"
          echo "Kubernetes minors ($set): $minors"
          echo "minors=$minors" >> "$GITHUB_OUTPUT"

  # kind e2e per minor (make e2e, hack/e2e.sh): pinned node image, kind and
  # kubectl pinned and sha256-verified, the zero-false-blocker regression,
  # scan's live behaviour (unreachable server, deprecated-API authorship,
  # EOL add-on, --keep-history release; hack/e2e/deprecated-api.txt picks
  # the API per minor), scan + agent ITs, the chart from this tree's image,
  # ClusterReadiness verdict, server ingest, agent.targets upgrade, clean
  # uninstall, then the API server's audit log of the whole run
  # (hack/e2e/audit-policy.yaml): scan and the agent make no deprecated-API
  # request outside hack/e2e/deprecated-request-allowlist.txt, the agent
  # writes only its ClusterReadiness (+ CRD), Secrets are read only through
  # Helm's selector, and scan writes nothing (#99). Checks that guard a fix
  # not on main yet are best-effort and reported PASS/FAIL in the job
  # summary rather than silently ignored.
  kube:
    name: kube (kind e2e, Kubernetes ${{ matrix.minor }})
    needs: [changes, kube-matrix]
    if: >-
      !cancelled() && needs.kube-matrix.result == 'success' &&
      (needs.changes.outputs.e2e == 'true' || needs.changes.result == 'skipped')
    runs-on: ubuntu-latest # Docker preinstalled
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        minor: ${{ fromJSON(needs.kube-matrix.outputs.minors) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/dockerhub-mirror # Docker Hub's anonymous pull limit (429): pull through mirror.gcr.io
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: ${{ env.RESTORE_CACHES == 'true' }} # no cache on the release path (IR-22)
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.0 # keep in step with the helm job and release.yml HELM_VERSION
      - name: kind e2e on Kubernetes ${{ matrix.minor }}
        env:
          E2E_MINOR: ${{ matrix.minor }}
        run: make e2e E2E_MINOR="$E2E_MINOR"

  # The live collector and engine against a real kube-apiserver and etcd
  # (controller-runtime's envtest, no Docker) for the Kubernetes minors
  # kind's node images do not cover, 1.24 to 1.28 (hack/envtest-versions.txt;
  # #135, #69): GA-only objects give no removed-API finding, a second scan of
  # an unchanged cluster is identical, an object written through a beta API
  # that minor still serves blocks at its removal, and what an apiserver
  # without nodes cannot answer is reported as not assessed. It is cheap (a
  # few seconds of test and a bundle download), so every minor runs wherever
  # the kube job does, the PR set included. make envtest reproduces a leg on
  # a laptop. hack/envtest.sh pins setup-envtest and its bundle index, and
  # the downloads are sha512-verified.
  envtest:
    name: envtest (Kubernetes ${{ matrix.minor }})
    needs: changes
    if: >-
      !cancelled() &&
      (needs.changes.outputs.e2e == 'true' || needs.changes.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        minor: ['1.24', '1.25', '1.26', '1.27', '1.28']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: ${{ env.RESTORE_CACHES == 'true' }} # no cache on the release path (IR-22)
      # setup-envtest and this minor's kube-apiserver and etcd bundle. The
      # key changes with the pins, so a bump downloads afresh.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: env.RESTORE_CACHES == 'true' # no cache on the release path (IR-22)
        with:
          path: bin/envtest
          key: envtest-${{ runner.os }}-${{ matrix.minor }}-${{ hashFiles('hack/envtest.sh', 'hack/envtest-versions.txt') }}
      - name: envtest on Kubernetes ${{ matrix.minor }}
        env:
          ENVTEST_MINOR: ${{ matrix.minor }}
        run: make envtest ENVTEST_MINOR="$ENVTEST_MINOR"

  kb-freshness:
    name: kb dataset is not stale
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: ${{ env.RESTORE_CACHES == 'true' }} # no cache on the release path (IR-22)
          cache-dependency-path: |
            go.sum
            tools/gen-kb/go.sum
      - name: gen-kb unit tests (separate module)
        run: cd tools/gen-kb && go test ./...
      # make gen-kb = go generate: import list, go mod tidy, dataset. Any
      # diff means a generated file was hand-edited or not regenerated.
      - run: make gen-kb
      - name: generated files are up to date
        run: |
          git status --porcelain tools/gen-kb internal/kb/data
          git diff tools/gen-kb internal/kb/data
          test -z "$(git status --porcelain tools/gen-kb internal/kb/data)" \
            || { echo "::error::generated KB files are stale — run 'make gen-kb' and commit the result"; exit 1; }
      # The checks above only compare against the pinned k8s.io/api; this
      # one notices upstream moving on (a warning, not a failure).
      - name: newer k8s.io/api release?
        working-directory: tools/gen-kb
        run: |
          pinned="$(go list -m -f '{{.Version}}' k8s.io/api)"
          latest="$(go list -m -f '{{.Version}}' k8s.io/api@latest)"
          if [ "$pinned" != "$latest" ]; then
            echo "::warning::k8s.io/api $latest is available but gen-kb pins $pinned — check the kb-refresh PR or the 'kb-refresh is failing' issue"
          fi

  # The one check to require in a branch ruleset (#58). The kube job names
  # change with the matrix and most jobs skip on some events (docs-only PRs
  # skip kube), so none of them is a stable required check. This job always
  # runs and fails if anything it needs failed or was cancelled; skipped is
  # fine, that is a job not meant for this event. A skipped required check
  # counts as passing, hence if: always(). hack/ci-ok_test.sh (make
  # hack-test) fails if a job is missing from needs.
  ci-ok:
    if: always()
    needs: [changes, lint, test, test-heap, build, notices, vuln, web, helm, examples, images, registry, pg-matrix, pg-conformance, release-check, action, kube-matrix, kube, envtest, kb-freshness]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: every job passed or was skipped
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key) \(.value.result)"' <<<"$NEEDS" | sort | tee "$RUNNER_TEMP/results"
          if bad=$(grep -Ev ' (success|skipped)$' "$RUNNER_TEMP/results"); then
            echo "::error::not every job passed: $(tr '\n' ' ' <<<"$bad")"
            exit 1
          fi
