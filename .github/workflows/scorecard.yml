name: scorecard

# OpenSSF Scorecard: an outside, repeatable measure of this repository's
# supply-chain practices (pinned dependencies, token permissions, branch and
# tag protection, signed releases, ...). The results go to code scanning
# (SARIF) and, with publish_results, to the public OpenSSF API that the
# README badge reads.
#
# With publish_results: true, the scorecard API accepts results only from a
# workflow it can trust: one job, no top-level env or defaults, no run:
# steps, and only checkout, upload-artifact, codeql upload-sarif and
# scorecard-action itself. Keep it that way.
on:
  push:
    branches: [main]
  # Also when branch or tag protection changes, which Scorecard scores.
  branch_protection_rule:
  schedule:
    - cron: '23 4 * * 2' # Tuesdays 04:23 UTC
  workflow_dispatch:

# Read-only by default; the one job asks only for what it needs.
permissions:
  contents: read

jobs:
  analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read # Scorecard reads workflow runs (e.g. for CI-Tests)
      security-events: write # upload the SARIF to code scanning
      id-token: write # publish_results: the OIDC token proves the source
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5
      - uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: results.sarif
          category: scorecard
