name: release

# A release is a pushed semver tag (v0.2.0, or v0.2.0-rc.1 for a
# pre-release), cut from CI and never from a laptop. In order:
#
#   preflight  the tag is vX.Y.Z[-pre] and deploy/chart/Chart.yaml's
#              appVersion is that tag (it is the image tag the chart pulls by
#              default, so a chart that names another release is refused);
#   ci         the whole ci.yml suite (workflow_call) at the tagged commit:
#              unit/race, vuln gate, web, chart, images, Postgres, kind e2e,
#              release-check. Nothing below runs unless it passed;
#   goreleaser linux/darwin/windows amd64+arm64 archives (dashboard
#              embedded), checksums.txt, one SPDX SBOM per archive, a keyless
#              cosign bundle, and a GitHub build-provenance attestation over
#              every archive; the multi-arch image
#              ghcr.io/abd-ulbasit/upgradescope:{X.Y.Z,vX.Y.Z,latest} from
#              Dockerfile.release, with an SBOM and max-mode provenance
#              attached and a cosign signature;
#   chart      oci://ghcr.io/abd-ulbasit/charts/upgradescope, version X.Y.Z /
#              appVersion vX.Y.Z, signed;
#   verify     anonymously, on a fresh kind cluster: the image pulls for both
#              arches and verifies, the published chart installs and runs it;
#   major-tag  for a stable tag only, moves the floating major tag (v0) that
#              `uses: abd-ulbasit/upgradescope/action@v0` resolves to.
#
# Dry run: ci.yml's release-check job (make release-check) builds the same
# snapshot on any PR that touches the release inputs, or on workflow_dispatch.
# To re-run a release that failed half-way, re-run the failed jobs, or
# dispatch this workflow on the tag: published assets are replaced (see
# .goreleaser.yml), image and chart tags re-pushed from the same commit.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'
  workflow_dispatch: # run it on a tag ref; preflight refuses anything else

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false # never abandon a half-published release

env:
  IMAGE: ghcr.io/abd-ulbasit/upgradescope
  CHART_REPO: oci://ghcr.io/abd-ulbasit/charts
  HELM_VERSION: v4.3.0 # keep in step with ci.yml's helm and kube jobs

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: the tag is vX.Y.Z[-pre] and the chart pulls the image it publishes
        id: check
        env:
          REF_TYPE: ${{ github.ref_type }}
        run: |
          tag="$GITHUB_REF_NAME"
          if [ "$REF_TYPE" != tag ] || ! printf '%s' "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::'$tag' is not a vMAJOR.MINOR.PATCH[-PRERELEASE] tag; releases run only on one"
            exit 1
          fi
          app=$(sed -n 's/^appVersion: *//p' deploy/chart/Chart.yaml | tr -d '"')
          if [ "$app" != "$tag" ]; then
            echo "::error file=deploy/chart/Chart.yaml::appVersion is '$app' but the tag is '$tag'. appVersion is the image tag the chart installs by default; set version and appVersion to the tag in the release commit and tag again."
            exit 1
          fi
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

  ci:
    needs: preflight
    uses: ./.github/workflows/ci.yml
    with:
      release: true # the PR matrices even when this run was dispatched
    permissions:
      contents: read
      pull-requests: read # ci.yml's changes job declares it (skipped on tags)

  # GoReleaser publishes the archives and the image together: the image
  # packages the exact linux binaries in the archives (Dockerfile.release).
  goreleaser:
    needs: [preflight, ci]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write # the GitHub release and its assets
      packages: write # the GHCR image
      id-token: write # cosign keyless signing and the provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # changelog + version from tags
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Exactly go.mod's toolchain, the one ci just vuln-gated and the
          # Dockerfile builds with. This reverses a308496 ('1.26.x' with
          # check-latest): a newer patch would be a toolchain no gate ran
          # on, and the binary-mode vuln gate already fails the release on
          # any reachable stdlib advisory that has a fix, so a stale
          # go.mod patch blocks the tag instead of shipping. Bump go.mod.
          go-version-file: go.mod
          # No caches in a release job: a tag build can restore caches
          # written by main-branch runs, and release inputs should come only
          # from the tagged commit and the module proxy.
          cache: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
      # Dockerfile.release only COPYs a prebuilt binary (no RUN), so the
      # arm64 image needs no QEMU; buildx's docker-container driver does the
      # multi-platform build, the attestations and the push.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.17.1 # GORELEASER_VERSION in the Makefile; make check-toolchain compares them
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # checksums.txt names every archive, so one attestation covers them all:
      # `gh attestation verify <archive> -R abd-ulbasit/upgradescope`.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt

  chart:
    needs: [preflight, goreleaser]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write # the GHCR chart
      id-token: write # cosign keyless signing
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Package the chart (version/appVersion = the tag) and check it
        run: |
          helm package deploy/chart --version "$VERSION" --app-version "$GITHUB_REF_NAME" -d dist/chart
          pkg="dist/chart/upgradescope-$VERSION.tgz"
          got_version="$(helm show chart "$pkg" | sed -n 's/^version: *//p')"
          got_app="$(helm show chart "$pkg" | sed -n 's/^appVersion: *//p' | tr -d '"')"
          if [ "$got_version" != "$VERSION" ] || [ "$got_app" != "$GITHUB_REF_NAME" ]; then
            echo "::error::packaged chart has version=$got_version appVersion=$got_app, want $VERSION / $GITHUB_REF_NAME"
            exit 1
          fi
          helm template upgradescope "$pkg" | grep -F "image: \"$IMAGE:$GITHUB_REF_NAME\"" >/dev/null \
            || { echo "::error::packaged chart does not default to $IMAGE:$GITHUB_REF_NAME"; exit 1; }
      - name: Push and sign the chart
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GH_TOKEN" | helm registry login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          helm push "dist/chart/upgradescope-$VERSION.tgz" "$CHART_REPO" 2>&1 | tee "$RUNNER_TEMP/push.log"
          digest="$(sed -n 's/^Digest: *//p' "$RUNNER_TEMP/push.log")"
          [ -n "$digest" ] || { echo "::error::no digest in helm push output"; exit 1; }
          cosign sign --yes "${CHART_REPO#oci://}/upgradescope@$digest"

  # What a user does after reading the release notes, with no credentials.
  # GHCR packages are private on first push: if this fails on the first
  # release, make the upgradescope and charts/upgradescope packages public
  # and re-run this job.
  verify:
    needs: [preflight, goreleaser, chart]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Image is anonymously pullable for amd64 and arm64, signed, and attested
        run: |
          docker logout ghcr.io >/dev/null 2>&1 || true
          platforms="$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{json .Manifest}}' \
            | jq -r '.manifests[] | select(.platform.os=="linux") | "\(.platform.os)/\(.platform.architecture)"' | sort -u)"
          echo "$platforms"
          for p in linux/amd64 linux/arm64; do
            echo "$platforms" | grep -qx "$p" || { echo "::error::$IMAGE:$VERSION has no $p image"; exit 1; }
          done
          docker buildx imagetools inspect "$IMAGE:$GITHUB_REF_NAME" >/dev/null
          # BuildKit attaches the SBOM and the provenance as attestation
          # manifests (dockers_v2 sbom + --provenance=mode=max).
          for field in SBOM Provenance; do
            got="$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format "{{ json .$field }}")"
            case "$got" in '' | null | '{}') echo "::error::$IMAGE:$VERSION carries no $field attestation"; exit 1 ;; esac
            echo "$field attestation present"
          done
          cosign verify "$IMAGE:$VERSION" \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@${GITHUB_REF}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com >/dev/null
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}
      # Same pinned, sha256-verified kind and node image as ci.yml's kube job.
      - name: kind cluster (newest tested minor)
        run: |
          kind="$(hack/install-tool.sh kind)"
          hack/install-tool.sh kubectl >/dev/null # same directory as kind
          dirname "$kind" >> "$GITHUB_PATH"
          "$kind" create cluster --name release-verify --image "$(hack/kind-images.sh image 1.37)" --wait 120s
      - name: Published chart installs and reaches Ready (no side-loading)
        run: |
          helm --kube-context kind-release-verify install upgradescope "$CHART_REPO/upgradescope" --version "$VERSION" \
            --namespace upgradescope --create-namespace \
            --set server.enabled=true --set server.ingestToken=verify \
            --wait --timeout 5m
          kubectl --context kind-release-verify -n upgradescope get pods -o wide
          kubectl --context kind-release-verify -n upgradescope get deploy \
            -o jsonpath='{range .items[*]}{.spec.template.spec.containers[0].image}{"\n"}{end}' \
            | grep -qxF "$IMAGE:$GITHUB_REF_NAME"

  # Actions convention: v0 names the newest stable v0.x.y. Only a stable tag
  # moves it, and only once the release is published and verified. Through
  # the API, so no checkout holds a write token.
  major-tag:
    needs: [verify]
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # move the tag
    # GITHUB_TOKEN moves v0 through the refs API. A tag ruleset on
    # refs/tags/v* (#58) must exclude v0, or grant this workflow a bypass,
    # or this job fails after everything else has published.
    steps:
      - name: point the major tag at this release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          major="${GITHUB_REF_NAME%%.*}"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$major" >/dev/null 2>&1; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$major" -f sha="$GITHUB_SHA" -F force=true >/dev/null
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$major" -f sha="$GITHUB_SHA" >/dev/null
          fi
          echo "$major -> $GITHUB_REF_NAME ($GITHUB_SHA)" >> "$GITHUB_STEP_SUMMARY"
