name: release

# A release is a pushed semver tag (v0.2.0, or v0.2.0-rc.1 for a
# pre-release), cut from CI and never from a laptop. In order:
#
#   preflight  the tag is vX.Y.Z[-pre], deploy/chart/Chart.yaml's
#              appVersion is that tag (it is the image tag the chart pulls by
#              default, so a chart that names another release is refused),
#              the tagged commit is on main (a tag pushed on a branch
#              commit is refused: hack/check-release-ancestry.sh), and
#              CHANGELOG.md has entries for it (hack/check-changelog.sh);
#   ci         the whole ci.yml suite (workflow_call) at the tagged commit:
#              unit/race, vuln gate, web, chart, images, Postgres, kind e2e,
#              release-check. Nothing below runs unless it passed;
#   goreleaser linux/darwin/windows amd64+arm64 archives (dashboard
#              embedded, with completions, man pages and license notices),
#              deb/rpm/apk packages, the published contracts (api/:
#              report and webhook schemas, OpenAPI), checksums.txt over
#              all of them, one SPDX SBOM per
#              archive, a keyless cosign bundle, and a GitHub
#              build-provenance attestation over every archive; the
#              multi-arch image ghcr.io/abd-ulbasit/upgradescope:{X.Y.Z,
#              vX.Y.Z,latest} from Dockerfile.release, with an SBOM and
#              max-mode provenance attached and a cosign signature on the
#              index and on every platform image. All of it reproducible
#              from the tag (make release-repro);
#   chart      oci://ghcr.io/abd-ulbasit/charts/upgradescope, version X.Y.Z /
#              appVersion vX.Y.Z, its image pinned by the digest goreleaser
#              just pushed and Artifact Hub annotations stamped
#              (hack/chart-release-annotations.sh), signed; plus the
#              Artifact Hub repository metadata (artifacthub.io tag);
#   verify     anonymously, on a fresh kind cluster: the image pulls for both
#              arches, every platform image verifies and carries /licenses,
#              the published chart installs and runs the pinned image;
#   major-tag  for a stable tag only, and only while it is the highest
#              stable release of its major, moves the floating major tag
#              (v0) that `uses: abd-ulbasit/upgradescope@v0` (and
#              .../action@v0) resolves to; action/README.md tells users to
#              pin @vX.Y.Z or a SHA instead when they need a reproducible
#              gate;
#   krew       for a stable tag only, once the plugin is in krew-index
#              (repository variable KREW_PLUGIN_IN_INDEX=true): the version
#              bump PR to kubernetes-sigs/krew-index, rendered from .krew.yaml.
#
# Only the highest stable release moves what users follow without pinning
# (#244): GitHub's Latest release (what the Action's `version: latest` and
# @v0 install), the image's :latest and the major tag. A run on any other
# tag (a re-run or re-dispatch of an older release, or the slower of two
# releases racing) publishes its own assets and leaves all three where they
# were. hack/release-newest.sh decides, from the published releases, at
# three points: preflight (whether major-tag runs), just before GoReleaser
# (the :latest image tag, always an explicit true or false) and inside
# major-tag (re-checked under one repository-wide concurrency group).
#
# GitHub's Latest and the image's :latest are set differently on purpose
# (#304). GoReleaser sets the image's :latest itself, when it pushes the
# image. It never sets GitHub's Latest: .goreleaser.yml hard-codes
# make_latest "false", because GoReleaser publishes the release before
# actions/attest-build-provenance has run, and the Action's `version: latest`
# (and @v0, and an untagged SHA) installs only a release whose attestation
# verifies. A Latest set by GoReleaser would be a release with no attestation
# until the next step finishes, for good when it fails, and again on every
# re-run of the job. Instead, the last step of the goreleaser job points
# GitHub's Latest, and :latest, at the highest published stable release,
# after the attestation exists (it runs only when every step before it
# succeeded, so a failed attestation leaves Latest where it was); whichever
# of two racing runs publishes last, both end on the higher one.
# hack/release-newest_test.sh runs these steps against a stub gh and pins
# the order.
#
# The Homebrew tap (abd-ulbasit/homebrew-tap) is not pushed from here: it
# pulls each stable release on a schedule and verifies checksums.txt against
# this workflow's signature (packaging/homebrew-tap). Release tags
# (vX.Y.Z[-pre], refs/tags/v*.*.*) are protected by
# .github/rulesets/release-tags.json. Floating major tags (v0, v1, ...) have
# no dots, so they stay outside it and the major-tag job can move them;
# .github/rulesets/README.md says why v0 itself has no ruleset.
#
# Dry run: ci.yml's release-check job (make release-check) builds the same
# snapshot on any PR that touches the release inputs, or on workflow_dispatch.
# To re-run a release that failed half-way, re-run the failed jobs, or
# dispatch this workflow on the tag: published assets are replaced (see
# .goreleaser.yml), image and chart tags re-pushed from the same commit.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'
  workflow_dispatch: # run it on a tag ref; preflight refuses anything else

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false # never abandon a half-published release

env:
  IMAGE: ghcr.io/abd-ulbasit/upgradescope
  CHART_REPO: oci://ghcr.io/abd-ulbasit/charts
  HELM_VERSION: v4.3.0 # keep in step with ci.yml's helm and kube jobs

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.check.outputs.version }}
      newest: ${{ steps.newest.outputs.newest }} # the highest stable release
      major-newest: ${{ steps.newest.outputs.major-newest }} # the highest stable release of its major
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # origin/main's history, for the ancestry check below
          persist-credentials: false
      - name: the tag is vX.Y.Z[-pre] and the chart pulls the image it publishes
        id: check
        env:
          REF_TYPE: ${{ github.ref_type }}
        run: |
          tag="$GITHUB_REF_NAME"
          if [ "$REF_TYPE" != tag ] || ! printf '%s' "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::'$tag' is not a vMAJOR.MINOR.PATCH[-PRERELEASE] tag; releases run only on one"
            exit 1
          fi
          app=$(sed -n 's/^appVersion: *//p' deploy/chart/Chart.yaml | tr -d '"')
          if [ "$app" != "$tag" ]; then
            echo "::error file=deploy/chart/Chart.yaml::appVersion is '$app' but the tag is '$tag'. appVersion is the image tag the chart installs by default; set version and appVersion to the tag in the release commit and tag again."
            exit 1
          fi
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
      - name: is this the highest stable release?
        id: newest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          hack/release-newest.sh published >"$RUNNER_TEMP/releases"
          newest=$(hack/release-newest.sh is-newest "$GITHUB_REF_NAME" <"$RUNNER_TEMP/releases")
          major=$(hack/release-newest.sh is-newest --major "$GITHUB_REF_NAME" <"$RUNNER_TEMP/releases")
          echo "newest=$newest" >>"$GITHUB_OUTPUT"
          echo "major-newest=$major" >>"$GITHUB_OUTPUT"
          echo "$GITHUB_REF_NAME: the highest stable release: $newest; the highest of ${GITHUB_REF_NAME%%.*}: $major" >>"$GITHUB_STEP_SUMMARY"
      - name: the tagged commit is on main
        run: hack/check-release-ancestry.sh
      - name: CHANGELOG.md says what this release changes
        run: hack/check-changelog.sh "$GITHUB_REF_NAME"

  ci:
    needs: preflight
    uses: ./.github/workflows/ci.yml
    with:
      release: true # the PR matrices even when this run was dispatched
    # A called job may ask for no more than this grants, or GitHub refuses
    # to start the run (v0.2.0-rc.1: startup_failure).
    # hack/release-ci-permissions_test.sh keeps it in step with ci.yml.
    permissions:
      contents: read
      pull-requests: read # ci.yml's changes job declares it (skipped on tags)
      security-events: write # ci.yml's action job declares it; it uploads SARIF only on a dispatched fixture run, never on a tag

  # GoReleaser publishes the archives and the image together: the image
  # packages the exact linux binaries in the archives (Dockerfile.release).
  goreleaser:
    needs: [preflight, ci]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write # the GitHub release and its assets
      packages: write # the GHCR image
      id-token: write # cosign keyless signing and the provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # changelog + version from tags
          persist-credentials: false
      - uses: ./.github/actions/dockerhub-mirror # Docker Hub's anonymous pull limit (429): pull through mirror.gcr.io
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Exactly go.mod's toolchain, the one ci just vuln-gated and the
          # Dockerfile builds with. This reverses a308496 ('1.26.x' with
          # check-latest): a newer patch would be a toolchain no gate ran
          # on, and the binary-mode vuln gate already fails the release on
          # any reachable stdlib advisory that has a fix, so a stale
          # go.mod patch blocks the tag instead of shipping. Bump go.mod.
          go-version-file: go.mod
          # No caches in a release job: a tag build can restore caches
          # written by main-branch runs, and release inputs should come only
          # from the tagged commit and the module proxy.
          cache: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      # Dockerfile.release only COPYs a prebuilt binary (no RUN), so the
      # arm64 image needs no QEMU; buildx's docker-container driver does the
      # multi-platform build, the attestations and the push.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          cache-binary: false # it installs no buildx (no version: input); never from the Actions cache
          # The docker-container builder runs its own BuildKit, which does not
          # read the daemon's registry-mirrors: give it the mirror too (the
          # dockerhub-mirror step above covers the daemon, which pulls the
          # builder image itself). That image is pinned by digest, the one
          # buildx-stable-1 names today: the mirror serves a digest from its
          # cache, but the first pull of the moving tag in a job went to
          # Docker Hub and timed out. Bump it by hand, in every workflow
          # (hack/dockerhub-mirror_test.sh checks they agree).
          driver-opts: image=moby/buildkit:buildx-stable-1@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Re-checked here, not taken from preflight: a newer release may have
      # published while ci ran. .goreleaser.yml reads it for the :latest
      # image tag only: GitHub's Latest is set by the last step of this job,
      # after the attestation (#304).
      # The release list goes to a file first, never through a pipe: a run:
      # step without shell: runs under `bash -e`, with no pipefail, so a
      # failed `gh release list` piped into is-newest would read as an empty
      # list and print true (#244). Every step that calls release-newest.sh
      # does the same; hack/release-newest_test.sh runs them under `bash -e`
      # with a failing gh.
      - name: is this still the highest stable release?
        id: newest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          hack/release-newest.sh published >"$RUNNER_TEMP/releases"
          newest=$(hack/release-newest.sh is-newest "$GITHUB_REF_NAME" <"$RUNNER_TEMP/releases")
          echo "newest=$newest" >>"$GITHUB_OUTPUT"
          echo "the image's :latest moves to $GITHUB_REF_NAME: $newest" >>"$GITHUB_STEP_SUMMARY"
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.17.1 # GORELEASER_VERSION in the Makefile; make check-toolchain compares them
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPGRADESCOPE_NEWEST: ${{ steps.newest.outputs.newest }}
      # checksums.txt names every archive (and package and contract), so one
      # attestation covers them all:
      # `gh attestation verify <archive> -R abd-ulbasit/upgradescope`.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt
      # The only place GitHub's Latest is set (GoReleaser's make_latest is
      # "false"), so it must stay after the attestation step above and keep
      # the implicit success() condition: a failed attestation then never
      # moves Latest, and the release is not what `version: latest` installs
      # until a re-run attests it (#304).
      # Two stable releases racing: each decided :latest before the other
      # published, so the one that published last took :latest, whichever
      # tag it was. Every stable run ends by pointing both Latest and
      # :latest at the highest published stable release; the last run to get
      # here sees both releases. A no-op when they already name it. When
      # the highest release is another run's, still publishing (its release
      # is out but its image is not yet pushed), :latest is left to that
      # run, which ends with this same step.
      - name: GitHub's Latest and the image's :latest name the highest stable release
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          hack/release-newest.sh published >"$RUNNER_TEMP/releases"
          highest=$(hack/release-newest.sh highest <"$RUNNER_TEMP/releases")
          latest=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name) || latest=
          if [ "$latest" != "$highest" ]; then
            id=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$highest" --jq .id)
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$id" -f make_latest=true >/dev/null
            echo "GitHub Latest: ${latest:-none} -> $highest" >>"$GITHUB_STEP_SUMMARY"
          fi
          want=$(docker buildx imagetools inspect "$IMAGE:$highest" --format '{{json .Manifest}}' | jq -r .digest) || want=
          case "$want" in
            sha256:*) ;;
            *)
              if [ "$highest" = "$GITHUB_REF_NAME" ]; then
                echo "::error::no digest for $IMAGE:$highest"
                exit 1
              fi
              echo "::notice::$IMAGE:$highest is not pushed yet: its release run is still publishing, and points :latest at it when it ends"
              echo "$IMAGE:latest left to $highest's release run (its image is not pushed yet)" >>"$GITHUB_STEP_SUMMARY"
              exit 0
              ;;
          esac
          got=$(docker buildx imagetools inspect "$IMAGE:latest" --format '{{json .Manifest}}' | jq -r .digest) || got=
          if [ "$got" != "$want" ]; then
            oras="$(hack/install-tool.sh oras)" # pinned, sha256-verified; logged in through docker's config
            "$oras" tag "$IMAGE@$want" latest
            echo "$IMAGE:latest: ${got:-none} -> $highest ($want)" >>"$GITHUB_STEP_SUMMARY"
          fi

  chart:
    needs: [preflight, goreleaser]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write # the GHCR chart
      id-token: write # cosign keyless signing
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      # The image package is private until made public after the first
      # release; reading its digest needs the token.
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Package the chart (version/appVersion = the tag, image pinned by digest) and check it
        run: |
          # The multi-arch index goreleaser pushed for this tag.
          digest="$(docker buildx imagetools inspect "$IMAGE:$GITHUB_REF_NAME" --format '{{json .Manifest}}' | jq -r .digest)"
          case "$digest" in sha256:*) ;; *) echo "::error::no digest for $IMAGE:$GITHUB_REF_NAME"; exit 1 ;; esac
          echo "$IMAGE:$GITHUB_REF_NAME@$digest" >> "$GITHUB_STEP_SUMMARY"
          # Stamp a copy: image.digest, the Artifact Hub image, prerelease
          # and changes (from CHANGELOG.md).
          cp -R deploy/chart "$RUNNER_TEMP/upgradescope"
          hack/chart-release-annotations.sh "$RUNNER_TEMP/upgradescope" "$GITHUB_REF_NAME" "$digest"
          helm lint --strict "$RUNNER_TEMP/upgradescope"
          helm package "$RUNNER_TEMP/upgradescope" --version "$VERSION" --app-version "$GITHUB_REF_NAME" -d dist/chart
          pkg="dist/chart/upgradescope-$VERSION.tgz"
          got_version="$(helm show chart "$pkg" | sed -n 's/^version: *//p')"
          got_app="$(helm show chart "$pkg" | sed -n 's/^appVersion: *//p' | tr -d '"')"
          if [ "$got_version" != "$VERSION" ] || [ "$got_app" != "$GITHUB_REF_NAME" ]; then
            echo "::error::packaged chart has version=$got_version appVersion=$got_app, want $VERSION / $GITHUB_REF_NAME"
            exit 1
          fi
          helm template upgradescope "$pkg" | grep -F "image: \"$IMAGE:$GITHUB_REF_NAME@$digest\"" >/dev/null \
            || { echo "::error::packaged chart does not default to $IMAGE:$GITHUB_REF_NAME@$digest"; exit 1; }
      - name: Push and sign the chart
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GH_TOKEN" | helm registry login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          helm push "dist/chart/upgradescope-$VERSION.tgz" "$CHART_REPO" 2>&1 | tee "$RUNNER_TEMP/push.log"
          digest="$(sed -n 's/^Digest: *//p' "$RUNNER_TEMP/push.log")"
          [ -n "$digest" ] || { echo "::error::no digest in helm push output"; exit 1; }
          cosign sign --yes "${CHART_REPO#oci://}/upgradescope@$digest"
      # Artifact Hub reads repository metadata (owners, repository ID) from
      # the artifacthub.io tag of the chart's OCI repository. Registering the
      # repository on artifacthub.io is a one-time manual step
      # (packaging/README.md). hack/release-artifacthub-workflow_test.sh
      # (make hack-test) runs this step offline against a stub oras.
      - name: Push the Artifact Hub repository metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          oras="$(hack/install-tool.sh oras)" # pinned, sha256-verified
          printf '%s' "$GH_TOKEN" | "$oras" login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          cd packaging/artifacthub
          "$oras" push "${CHART_REPO#oci://}/upgradescope:artifacthub.io" \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml

  # What a user does after reading the release notes, with no credentials.
  # GHCR packages are private on first push: if this fails on the first
  # release, make the upgradescope and charts/upgradescope packages public
  # and re-run this job.
  verify:
    needs: [preflight, goreleaser, chart]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/dockerhub-mirror # Docker Hub's anonymous pull limit (429): pull through mirror.gcr.io
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Image is anonymously pullable for amd64 and arm64, signed, and attested
        run: |
          docker logout ghcr.io >/dev/null 2>&1 || true
          platforms="$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{json .Manifest}}' \
            | jq -r '.manifests[] | select(.platform.os=="linux") | "\(.platform.os)/\(.platform.architecture)"' | sort -u)"
          echo "$platforms"
          for p in linux/amd64 linux/arm64; do
            echo "$platforms" | grep -qx "$p" || { echo "::error::$IMAGE:$VERSION has no $p image"; exit 1; }
          done
          docker buildx imagetools inspect "$IMAGE:$GITHUB_REF_NAME" >/dev/null
          # BuildKit attaches the SBOM and the provenance as attestation
          # manifests (dockers_v2 sbom + --provenance=mode=max).
          for field in SBOM Provenance; do
            got="$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format "{{ json .$field }}")"
            case "$got" in '' | null | '{}') echo "::error::$IMAGE:$VERSION carries no $field attestation"; exit 1 ;; esac
            echo "$field attestation present"
          done
          identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@${GITHUB_REF}"
          cosign verify "$IMAGE:$VERSION" --certificate-identity "$identity" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com >/dev/null
          # What a node pulls is a platform image, not the index: each one
          # is signed (docker_signs --recursive) and verifies on its own.
          for d in $(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{json .Manifest}}' \
              | jq -r '.manifests[] | select(.platform.os=="linux") | .digest'); do
            cosign verify "$IMAGE@$d" --certificate-identity "$identity" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com >/dev/null
            echo "platform image $d signed"
          done
      - name: The image carries LICENSE, NOTICE and THIRD_PARTY_NOTICES in /licenses
        run: |
          cid="$(docker create --platform linux/amd64 "$IMAGE:$VERSION")"
          docker cp "$cid:/licenses" "$RUNNER_TEMP/licenses"
          docker rm "$cid" >/dev/null
          for f in LICENSE NOTICE THIRD_PARTY_NOTICES; do
            cmp "$RUNNER_TEMP/licenses/$f" "$f" || { echo "::error::/licenses/$f in $IMAGE:$VERSION is missing or differs"; exit 1; }
          done
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}
      # Same pinned, sha256-verified kind and node image as ci.yml's kube job.
      - name: kind cluster (newest tested minor)
        run: |
          kind="$(hack/install-tool.sh kind)"
          hack/install-tool.sh kubectl >/dev/null # same directory as kind
          dirname "$kind" >> "$GITHUB_PATH"
          "$kind" create cluster --name release-verify --image "$(hack/kind-images.sh image 1.37)" --wait 120s
      - name: Published chart installs and reaches Ready, on the pinned image (no side-loading)
        run: |
          digest="$(docker buildx imagetools inspect "$IMAGE:$GITHUB_REF_NAME" --format '{{json .Manifest}}' | jq -r .digest)"
          helm --kube-context kind-release-verify install upgradescope "$CHART_REPO/upgradescope" --version "$VERSION" \
            --namespace upgradescope --create-namespace \
            --set server.enabled=true --set server.ingestToken=verify \
            --wait --timeout 5m
          kubectl --context kind-release-verify -n upgradescope get pods -o wide
          kubectl --context kind-release-verify -n upgradescope get deploy \
            -o jsonpath='{range .items[*]}{.spec.template.spec.containers[0].image}{"\n"}{end}' \
            | grep -qxF "$IMAGE:$GITHUB_REF_NAME@$digest"

  # Actions convention: v0 names the newest stable v0.x.y. Only a stable tag
  # that is the highest stable release of its major moves it, and only once
  # the release is published and verified. Through the API, so the checkout
  # (for hack/release-newest.sh) holds no token.
  major-tag:
    needs: [preflight, verify]
    if: ${{ !contains(github.ref_name, '-') && needs.preflight.outputs.major-newest == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # move the tag
    # One at a time across the repository, and the check repeated inside:
    # of two releases racing, the lower one finds the higher published and
    # leaves the tag. (GitHub keeps one pending job per group: a third
    # release arriving while one runs and one waits cancels the waiting
    # one, which then needs a re-run if it was the highest.)
    concurrency:
      group: release-major-tag
      cancel-in-progress: false
    # GITHUB_TOKEN moves v0 through the refs API. A tag ruleset that covers
    # v0 without a bypass this token qualifies for makes this job fail after
    # everything else has published, so release-tags.json (#58) protects
    # only release tags (refs/tags/v*.*.*), never a major tag
    # (.github/rulesets/README.md).
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: point the major tag at this release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          major="${GITHUB_REF_NAME%%.*}"
          # To a file first, as in the goreleaser job: no pipefail here.
          hack/release-newest.sh published >"$RUNNER_TEMP/releases"
          newest=$(hack/release-newest.sh is-newest --major "$GITHUB_REF_NAME" <"$RUNNER_TEMP/releases")
          if [ "$newest" != true ]; then
            echo "::notice::$major stays: a higher $major release than $GITHUB_REF_NAME is published"
            echo "$major stays: a higher $major release than $GITHUB_REF_NAME is published" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$major" >/dev/null 2>&1; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$major" -f sha="$GITHUB_SHA" -F force=true >/dev/null
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$major" -f sha="$GITHUB_SHA" >/dev/null
          fi
          echo "$major -> $GITHUB_REF_NAME ($GITHUB_SHA)" >> "$GITHUB_STEP_SUMMARY"

  # krew-index update PR for a stable tag, rendered from .krew.yaml by
  # krew-release-bot. The bot only bumps a plugin krew-index already lists;
  # the first submission is a manual PR (packaging/README.md), after which
  # set the repository variable KREW_PLUGIN_IN_INDEX=true. It reads the
  # published archives anonymously and needs no token from this repository.
  krew:
    needs: [verify]
    if: ${{ !contains(github.ref_name, '-') && vars.KREW_PLUGIN_IN_INDEX == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The SHA pins the action definition only: its action.yml runs
      # docker://ghcr.io/rajatjindal/krew-release-bot:v0.0.50 by tag, so the
      # code it runs is that image tag's, not frozen by this pin; the job's
      # token is read-only, which bounds what a changed image could do here.
      - uses: rajatjindal/krew-release-bot@c970b8a8f6dbc2f2285a26e3ae160903b87002c3 # v0.0.51
