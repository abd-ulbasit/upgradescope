name: release

# Pushing a vX.Y.Z tag publishes, from CI and never from a laptop:
#   - linux/darwin/windows amd64+arm64 archives (dashboard embedded),
#     checksums.txt, one SPDX SBOM per archive, keyless cosign bundle
#   - ghcr.io/abd-ulbasit/upgradescope:{X.Y.Z,vX.Y.Z,latest} (amd64+arm64),
#     signed
#   - the Helm chart at oci://ghcr.io/abd-ulbasit/charts/upgradescope,
#     version X.Y.Z / appVersion vX.Y.Z, signed
# Before publishing, it fails on a stale committed dashboard and on a
# linux/amd64 build that does not serve it at /. After publishing, it checks,
# anonymously and on a fresh kind cluster, that what it published is
# installable.
#
# workflow_dispatch with snapshot=true runs the same build with nothing
# published or signed (no tag needed) and uploads dist/ as an artifact.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      snapshot:
        description: Build everything but publish nothing (no tag needed)
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false # never abandon a half-published release

env:
  IMAGE: ghcr.io/abd-ulbasit/upgradescope
  CHART_REPO: oci://ghcr.io/abd-ulbasit/charts
  # Publish only from a v* tag: on tag push, or a dispatch on a tag with
  # snapshot=false (re-running a failed release: assets already on the
  # release are replaced, see .goreleaser.yml, and image/chart tags are
  # re-pushed from the same commit). Anything else is a dry run.
  PUBLISH: ${{ startsWith(github.ref, 'refs/tags/v') && (github.event_name == 'push' || !inputs.snapshot) }}
  HELM_VERSION: v4.3.0

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write # GitHub release and its assets
      packages: write # GHCR image and chart
      id-token: write # cosign keyless signing (Sigstore OIDC)
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # changelog + version from tags

      - name: Tag is vX.Y.Z[-pre]
        id: version
        if: env.PUBLISH == 'true'
        run: |
          tag="$GITHUB_REF_NAME"
          if ! printf '%s' "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::tag '$tag' is not vMAJOR.MINOR.PATCH[-PRERELEASE]"
            exit 1
          fi
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Latest 1.26 patch (go.mod's 1.26.8 is only the floor), so a
          # release always carries the newest stdlib security fixes.
          go-version: '1.26.x'
          check-latest: true
          # No caches in the release job: a tag build can restore caches
          # written by main-branch runs, and release inputs should come
          # only from the tagged commit and the module proxy.
          cache: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false

      # The binaries embed the committed internal/server/webdist. Rebuild it
      # here and refuse to release if the commit's copy is stale.
      - name: Build dashboard; committed webdist must match
        run: |
          make web
          if [ -n "$(git status --porcelain -- internal/server/webdist)" ]; then
            git status --short -- internal/server/webdist
            echo "::error::internal/server/webdist is stale for this commit — run 'make web' and commit before tagging"
            exit 1
          fi

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: env.PUBLISH == 'true'
      - uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        if: env.PUBLISH == 'true'

      # Dockerfile.release only COPYs a prebuilt binary (no RUN), so the
      # arm64 image needs no QEMU; buildx's docker-container driver does the
      # multi-platform build and push.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: env.PUBLISH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The gate before anything is published (the release is not a draft,
      # so a check after GoReleaser could only turn the run red). Build the
      # linux/amd64 binary from the same .goreleaser.yml build — flags,
      # ldflags, embedded webdist — and require it to serve the dashboard.
      - name: GoReleaser (linux/amd64 binary for the pre-publish check)
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: '~> v2'
          args: >-
            build --single-target --clean --output ${{ runner.temp }}/upgradescope
            ${{ env.PUBLISH != 'true' && '--snapshot' || '' }}
        env:
          GOOS: linux
          GOARCH: amd64

      - name: Binary serves the dashboard at / (before publishing)
        run: |
          bin="$RUNNER_TEMP/upgradescope"
          "$bin" --version
          "$bin" serve --listen 127.0.0.1:18080 --ingest-token smoke --db "$RUNNER_TEMP/smoke.sqlite" &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT # also on failure: a live server would hold the step open
          for _ in $(seq 1 50); do curl -fsS -o /dev/null http://127.0.0.1:18080/healthz && break; sleep 0.2; done
          got="$(curl -sS -o /dev/null -w '%{http_code} %{content_type}' http://127.0.0.1:18080/)"
          case "$got" in
            '200 text/html'*) echo "GET / -> $got" ;;
            *) echo "::error::GET / returned '$got', want 200 text/html (dashboard missing from the binary)"; exit 1 ;;
          esac

      - name: GoReleaser (publish)
        if: env.PUBLISH == 'true'
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: GoReleaser (snapshot, nothing published)
        if: env.PUBLISH != 'true'
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --snapshot --clean --skip=publish,sign,sbom

      - name: Package Helm chart (version/appVersion from the tag)
        if: env.PUBLISH == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          helm package deploy/chart --version "$VERSION" --app-version "$GITHUB_REF_NAME" -d dist/chart
          pkg="dist/chart/upgradescope-$VERSION.tgz"
          got_version="$(helm show chart "$pkg" | sed -n 's/^version: *//p')"
          got_app="$(helm show chart "$pkg" | sed -n 's/^appVersion: *//p' | tr -d '"')"
          if [ "$got_version" != "$VERSION" ] || [ "$got_app" != "$GITHUB_REF_NAME" ]; then
            echo "::error::packaged chart has version=$got_version appVersion=$got_app, want $VERSION / $GITHUB_REF_NAME"
            exit 1
          fi
          helm template upgradescope "$pkg" | grep -F "image: \"$IMAGE:$GITHUB_REF_NAME\"" >/dev/null \
            || { echo "::error::packaged chart does not default to $IMAGE:$GITHUB_REF_NAME"; exit 1; }

      - name: Push and sign Helm chart
        if: env.PUBLISH == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GH_TOKEN" | helm registry login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          helm push "dist/chart/upgradescope-$VERSION.tgz" "$CHART_REPO" 2>&1 | tee "$RUNNER_TEMP/push.log"
          digest="$(sed -n 's/^Digest: *//p' "$RUNNER_TEMP/push.log")"
          [ -n "$digest" ] || { echo "::error::no digest in helm push output"; exit 1; }
          cosign sign --yes "${CHART_REPO#oci://}/upgradescope@$digest"

      - name: Upload snapshot dist/
        if: env.PUBLISH != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: snapshot-dist
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
          retention-days: 7

  # What a user does after reading the release notes, with no credentials.
  # GHCR packages are private on first push: if this fails on the first
  # release, make the upgradescope and charts/upgradescope packages public
  # and re-run this job.
  verify:
    needs: goreleaser
    if: needs.goreleaser.outputs.version != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERSION: ${{ needs.goreleaser.outputs.version }}
    steps:
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Image is anonymously pullable for amd64 and arm64, and signed
        run: |
          docker logout ghcr.io >/dev/null 2>&1 || true
          platforms="$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{json .Manifest}}' \
            | jq -r '.manifests[] | select(.platform.os=="linux") | "\(.platform.os)/\(.platform.architecture)"' | sort -u)"
          echo "$platforms"
          for p in linux/amd64 linux/arm64; do
            echo "$platforms" | grep -qx "$p" || { echo "::error::$IMAGE:$VERSION has no $p image"; exit 1; }
          done
          docker buildx imagetools inspect "$IMAGE:$GITHUB_REF_NAME" >/dev/null
          cosign verify "$IMAGE:$VERSION" \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@${GITHUB_REF}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com >/dev/null
      - uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0
        with:
          cluster_name: release-verify
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}
      - name: Published chart installs and reaches Ready (no side-loading)
        run: |
          helm install upgradescope "$CHART_REPO/upgradescope" --version "$VERSION" \
            --namespace upgradescope --create-namespace \
            --set server.enabled=true --set server.ingestToken=verify \
            --wait --timeout 5m
          kubectl -n upgradescope get pods -o wide
          kubectl -n upgradescope get deploy -o jsonpath='{range .items[*]}{.spec.template.spec.containers[0].image}{"\n"}{end}' \
            | grep -qxF "$IMAGE:$GITHUB_REF_NAME"
