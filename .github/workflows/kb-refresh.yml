name: kb-refresh

# Weekly knowledge-base refresh, as two independent jobs so one failing can
# never hold back the other (a gen-kb build break used to skip the registry
# sync for weeks):
#  - api-lifecycle: bump tools/gen-kb to the latest tagged k8s.io/api (and the
#    matching apiextensions-apiserver / kube-aggregator releases), then
#    `make gen-kb` = `go generate ./...`, which regenerates the import list,
#    tidies go.mod and rewrites internal/kb/data/apilifecycle.json;
#  - registry: sync registry entries against the live endoflife.date API.
# Each opens (or updates) its own PR; CI on the PR re-validates everything.
# If either job fails, report-failure opens or comments on the
# "kb-refresh is failing" issue, so a broken refresh is never silent.
#
# How the bot PRs get CI without a PAT or App secret (#11).
# create-pull-request pushes the bot branch and opens the PR with this run's
# GITHUB_TOKEN, so the PR comes from github-actions[bot]. GitHub does create
# the PR's pull_request runs (ci, docs), but holds them for a maintainer's
# approval: status completed, conclusion action_required, no checks on the
# PR, so the ruleset's required ci-ok never reports and the PR stays BLOCKED
# (why #97 looked like "zero checks"). #151 dispatched ci.yml on the bot
# branch instead; that run passed and put its check runs, ci-ok included, on
# the head commit, but a PR's check rollup ignores a workflow_dispatch check
# suite, so PR #152 stayed BLOCKED (kb-refresh run 36987833658, dispatched
# ci.yml run 36987887553). What worked: POST
# repos/<repo>/actions/runs/<id>/approve on the held runs (ci 36987887798,
# docs 36987887811) with a maintainer's token; they then ran as ordinary
# pull_request runs and reported on the PR.
#
# So when a job creates or updates its PR (the action's
# pull-request-operation output; 'none' means the branch did not move), its
# "Approve the PR's CI runs" step polls the head commit's pull_request runs
# for up to about five minutes and approves each held one (conclusion or
# status action_required), with this job's GITHUB_TOKEN and actions: write
# on that job only. Whether GitHub lets GITHUB_TOKEN approve runs its own
# bot triggered is not documented, so the step is fail-soft: no runs, a
# failed listing or a refused approval is a ::warning:: and a job-summary
# line with the maintainer's commands (`gh run list --branch <bot branch>
# --status action_required`, then `gh api -X POST
# repos/<repo>/actions/runs/<id>/approve`, or "Approve and run" on the PR),
# never a failed refresh. hack/kb-refresh-ci_test.sh (make hack-test) runs
# the step against a stub gh.

on:
  schedule:
    - cron: '17 6 * * 1' # Mondays 06:17 UTC
  workflow_dispatch:

# Each job asks for what it writes.
permissions:
  contents: read

jobs:
  api-lifecycle:
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the bot branch
      pull-requests: write # open or update its PR
      actions: write # approve its PR's held CI runs (see the top of this file)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.x'
          cache-dependency-path: |
            go.sum
            tools/gen-kb/go.sum

      - name: Bump gen-kb to the latest k8s.io/api release
        working-directory: tools/gen-kb
        run: |
          V="$(go list -m -f '{{.Version}}' k8s.io/api@latest)"
          echo "latest k8s.io/api: $V"
          # The extra API modules are released in lockstep with k8s.io/api.
          go get "k8s.io/api@$V" "k8s.io/apimachinery@$V" \
            "k8s.io/apiextensions-apiserver@$V" "k8s.io/kube-aggregator@$V"

      - name: Regenerate import list, go.mod and dataset
        run: make gen-kb

      - name: Validate the regenerated KB
        run: |
          go test ./internal/kb/ ./internal/engine/
          cd tools/gen-kb && go test ./...

      - name: Open PR if anything changed
        id: pr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: bot/kb-refresh-api
          add-paths: |
            tools/gen-kb
            internal/kb/data
          commit-message: |
            chore(kb): weekly API lifecycle refresh

            Automated: tools/gen-kb bumped to the latest k8s.io/api and
            regenerated with `go generate ./...`.
          title: 'chore(kb): weekly API lifecycle refresh'
          body: |
            Automated weekly refresh:
            - `tools/gen-kb` bumped to the latest tagged `k8s.io/api` (plus matching `apiextensions-apiserver` / `kube-aggregator`)
            - `go generate ./...`: import list, `go.mod`, `internal/kb/data/apilifecycle.json`

            Review checklist:
            - [ ] CI green (kb-freshness, internal/kb dataset tests)
            - [ ] Entries carried forward with `"removedInferred": true` really are gone upstream
          labels: kb-refresh
          delete-branch: true

      # The PR's CI: see the top of this file. Fail-soft: a problem here is a
      # warning with the maintainer's commands, never a failed refresh.
      - name: Approve the PR's CI runs
        if: steps.pr.outputs.pull-request-operation == 'created' || steps.pr.outputs.pull-request-operation == 'updated'
        timeout-minutes: 10 # the poll below is bounded at about five minutes
        continue-on-error: true # a hung gh call must not fail the refresh; the PR still needs its runs approved by hand then
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ steps.pr.outputs.pull-request-branch }}
          HEAD_SHA: ${{ steps.pr.outputs.pull-request-head-sha }}
        run: |
          runs="repos/$GH_REPO/actions/runs?head_sha=$HEAD_SHA&event=pull_request&per_page=100"
          # One line per run: id, held or not, name. A held run is completed
          # with conclusion action_required; status action_required counts
          # too. ('waiting' is an environment's deployment review, which this
          # endpoint does not approve.)
          filter='.workflow_runs[] | [.id, (if .conclusion == "action_required" or .status == "action_required" then "held" else "not-held" end), .name] | @tsv'
          list_cmd="gh run list --branch $BRANCH --commit $HEAD_SHA --event pull_request --status action_required"
          manual() {
            echo "::warning::$1 The PR's checks (and the required ci-ok) stay pending until a maintainer approves its held runs: $list_cmd, then $2 (or 'Approve and run' on the PR)."
            echo "- $1 Approve the PR's held CI runs: \`$list_cmd\`, then \`$2\` (or *Approve and run* on the PR)." >>"${GITHUB_STEP_SUMMARY:-/dev/null}"
          }
          approved='' refused='' seen=''
          for attempt in $(seq 30); do
            [ "$attempt" = 1 ] || sleep 10
            list=$(gh api "$runs" --jq "$filter") || { echo "listing the PR's runs failed (attempt $attempt)"; continue; }
            waiting=''
            while IFS=$'\t' read -r id state name; do
              [ -n "$id" ] || continue
              seen=1
              [ "$state" = held ] || continue
              case " $approved " in *" $id "*) continue ;; esac
              waiting=1
              if gh api -X POST "repos/$GH_REPO/actions/runs/$id/approve" >/dev/null </dev/null; then
                echo "approved run $id ($name)"
                approved="$approved $id"
              else
                refused="$refused $id"
              fi
            done <<<"$list"
            # Done once runs exist and none is left waiting; a refusal will
            # not change on retry.
            [ -z "$refused" ] || break
            [ -z "$seen" ] || [ -n "$waiting" ] || break
          done
          if [ -n "$refused" ]; then
            cmds=''
            for id in $refused; do cmds="${cmds:+$cmds; }gh api -X POST repos/$GH_REPO/actions/runs/$id/approve"; done
            manual "GITHUB_TOKEN could not approve the held run(s)$refused on $BRANCH (approved:${approved:- none})." "$cmds"
          elif [ -n "$approved" ]; then
            echo "approved the PR's held CI runs:$approved"
            echo "- Approved the PR's held CI runs on \`$BRANCH\`:$approved" >>"${GITHUB_STEP_SUMMARY:-/dev/null}"
          elif [ -n "$seen" ]; then
            echo "the PR's pull_request runs at $HEAD_SHA are not awaiting approval; nothing to approve"
          else
            manual "No pull_request run for $BRANCH at $HEAD_SHA could be listed within five minutes." "gh api -X POST repos/$GH_REPO/actions/runs/<id>/approve for each"
          fi

  registry:
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the bot branch
      pull-requests: write # open or update its PR
      actions: write # approve its PR's held CI runs (see the top of this file)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.x'
          cache-dependency-path: go.sum # tools/eol-sync has no dependencies

      - name: Sync registry with endoflife.date
        run: make eol-sync

      - name: Open PR if anything changed
        id: pr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: bot/kb-refresh-registry
          add-paths: registry/data
          commit-message: |
            chore(registry): weekly endoflife.date sync

            Automated: tools/eol-sync against the endoflife.date API.
          title: 'chore(registry): weekly endoflife.date sync'
          body: |
            Automated weekly `tools/eol-sync` run against the live endoflife.date API.

            Review checklist:
            - [ ] CI green (registry job)
            - [ ] Any `status: eol` flips are real (check the cited endoflife.date page)
          labels: kb-refresh
          delete-branch: true

      # The PR's CI: see the top of this file. Fail-soft: a problem here is a
      # warning with the maintainer's commands, never a failed refresh.
      - name: Approve the PR's CI runs
        if: steps.pr.outputs.pull-request-operation == 'created' || steps.pr.outputs.pull-request-operation == 'updated'
        timeout-minutes: 10 # the poll below is bounded at about five minutes
        continue-on-error: true # a hung gh call must not fail the refresh; the PR still needs its runs approved by hand then
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ steps.pr.outputs.pull-request-branch }}
          HEAD_SHA: ${{ steps.pr.outputs.pull-request-head-sha }}
        run: |
          runs="repos/$GH_REPO/actions/runs?head_sha=$HEAD_SHA&event=pull_request&per_page=100"
          # One line per run: id, held or not, name. A held run is completed
          # with conclusion action_required; status action_required counts
          # too. ('waiting' is an environment's deployment review, which this
          # endpoint does not approve.)
          filter='.workflow_runs[] | [.id, (if .conclusion == "action_required" or .status == "action_required" then "held" else "not-held" end), .name] | @tsv'
          list_cmd="gh run list --branch $BRANCH --commit $HEAD_SHA --event pull_request --status action_required"
          manual() {
            echo "::warning::$1 The PR's checks (and the required ci-ok) stay pending until a maintainer approves its held runs: $list_cmd, then $2 (or 'Approve and run' on the PR)."
            echo "- $1 Approve the PR's held CI runs: \`$list_cmd\`, then \`$2\` (or *Approve and run* on the PR)." >>"${GITHUB_STEP_SUMMARY:-/dev/null}"
          }
          approved='' refused='' seen=''
          for attempt in $(seq 30); do
            [ "$attempt" = 1 ] || sleep 10
            list=$(gh api "$runs" --jq "$filter") || { echo "listing the PR's runs failed (attempt $attempt)"; continue; }
            waiting=''
            while IFS=$'\t' read -r id state name; do
              [ -n "$id" ] || continue
              seen=1
              [ "$state" = held ] || continue
              case " $approved " in *" $id "*) continue ;; esac
              waiting=1
              if gh api -X POST "repos/$GH_REPO/actions/runs/$id/approve" >/dev/null </dev/null; then
                echo "approved run $id ($name)"
                approved="$approved $id"
              else
                refused="$refused $id"
              fi
            done <<<"$list"
            # Done once runs exist and none is left waiting; a refusal will
            # not change on retry.
            [ -z "$refused" ] || break
            [ -z "$seen" ] || [ -n "$waiting" ] || break
          done
          if [ -n "$refused" ]; then
            cmds=''
            for id in $refused; do cmds="${cmds:+$cmds; }gh api -X POST repos/$GH_REPO/actions/runs/$id/approve"; done
            manual "GITHUB_TOKEN could not approve the held run(s)$refused on $BRANCH (approved:${approved:- none})." "$cmds"
          elif [ -n "$approved" ]; then
            echo "approved the PR's held CI runs:$approved"
            echo "- Approved the PR's held CI runs on \`$BRANCH\`:$approved" >>"${GITHUB_STEP_SUMMARY:-/dev/null}"
          elif [ -n "$seen" ]; then
            echo "the PR's pull_request runs at $HEAD_SHA are not awaiting approval; nothing to approve"
          else
            manual "No pull_request run for $BRANCH at $HEAD_SHA could be listed within five minutes." "gh api -X POST repos/$GH_REPO/actions/runs/<id>/approve for each"
          fi

  report-failure:
    needs: [api-lifecycle, registry]
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      API_RESULT: ${{ needs.api-lifecycle.result }}
      REGISTRY_RESULT: ${{ needs.registry.result }}
    steps:
      - name: Open or update the tracking issue
        run: |
          title='kb-refresh is failing'
          body="$(printf 'The weekly kb-refresh failed: %s\n\n- api-lifecycle: %s\n- registry: %s\n\nThe embedded KB stays stale until this is fixed.' \
            "$RUN_URL" "$API_RESULT" "$REGISTRY_RESULT")"
          gh label create kb-refresh --color 0e8a16 \
            --description 'Automated knowledge-base refresh' --force
          number="$(gh issue list --state open --label kb-refresh --search "\"$title\" in:title" \
            --json number,title --jq "map(select(.title == \"$title\")) | .[0].number // empty")"
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$title" --label kb-refresh --body "$body"
          fi
