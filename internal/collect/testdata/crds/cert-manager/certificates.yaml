apiVersion: cert-manager.io/v1alpha2
kind: Certificate
metadata:
  name: web-tls
  namespace: shop
spec:
  secretName: web-tls
  issuerRef: {name: letsencrypt, kind: ClusterIssuer}
  dnsNames: [shop.example.com]
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: api-tls
  namespace: shop
spec:
  secretName: api-tls
  issuerRef: {name: letsencrypt, kind: ClusterIssuer}
  dnsNames: [api.example.com]
---
# No ClusterIssuer CRD is in these files: its version cannot be judged.
apiVersion: cert-manager.io/v1alpha2
kind: ClusterIssuer
metadata:
  name: letsencrypt
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
