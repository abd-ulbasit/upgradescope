apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: clusterreadinesses.upgradescope.dev
spec:
  group: upgradescope.dev
  scope: Cluster
  names:
    plural: clusterreadinesses
    singular: clusterreadiness
    kind: ClusterReadiness
    listKind: ClusterReadinessList
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Target
          type: string
          jsonPath: .status.targets[0].target
        - name: Score
          type: integer
          jsonPath: .status.targets[0].score
        - name: Ready
          type: boolean
          jsonPath: .status.targets[0].ready
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                targets:
                  description: Kubernetes minor versions to evaluate against, e.g. "1.36". Empty means the agent targets the next minor above the observed server version.
                  type: array
                  items:
                    type: string
                    pattern: '^[0-9]+\.[0-9]+$'
            status:
              type: object
              properties:
                observedServerVersion:
                  type: string
                kbVersion:
                  type: string
                lastEvaluated:
                  type: string
                  format: date-time
                agentVersion:
                  type: string
                notAssessed:
                  type: array
                  items:
                    type: string
                targets:
                  type: array
                  items:
                    type: object
                    required: [target, score, ready, blockers, warnings, infos]
                    properties:
                      target:
                        type: string
                      score:
                        type: integer
                      ready:
                        type: boolean
                      blockers:
                        type: integer
                      warnings:
                        type: integer
                      infos:
                        type: integer
                      byCategory:
                        type: object
                        additionalProperties:
                          type: integer
                      topFindings:
                        type: array
                        maxItems: 20
                        items:
                          type: object
                          required: [category, severity, title]
                          properties:
                            category:
                              type: string
                            severity:
                              type: string
                            title:
                              type: string
                            remediation:
                              type: string
