# Flags a workload that asks for an upgrade to a Kubernetes minor upgradescope
# has not cleared.
#
# An "upgrade request" here is a workload annotated
#
#     upgradescope.dev/upgrade-target: "1.37"
#
# (the Constraint in constraint.yaml picks the kinds). The template reads the
# ClusterReadiness the agent keeps from Gatekeeper's replicated data (config.yaml
# syncs it) and reports a violation when
# status.targets[target=<annotation value>].ready is false.
#
# Fails open, on purpose, when it cannot tell: no ClusterReadiness in the
# replicated data (not synced yet, agent not installed, another --cr-name), no
# entry for the target (it was never assessed), or status.lastEvaluated older
# than parameters.maxAgeSeconds (default 3600; the agent's default interval is
# 10m). A guardrail that blocks on data nobody has refreshed is worse than none.
apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: upgradescopereadytarget
  annotations:
    metadata.gatekeeper.sh/title: Require a ready upgradescope target
    description: >-
      An upgrade request annotated upgradescope.dev/upgrade-target must name a
      Kubernetes minor that the ClusterReadiness reports as ready. Fails open
      when the readiness data is missing, does not cover the target, or is
      older than maxAgeSeconds.
spec:
  crd:
    spec:
      names:
        kind: UpgradescopeReadyTarget
      validation:
        openAPIV3Schema:
          type: object
          properties:
            crName:
              description: Name of the ClusterReadiness (the chart's agent.crName).
              type: string
            maxAgeSeconds:
              description: Older than this, status.lastEvaluated counts as stale and the policy allows.
              type: integer
              minimum: 1
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package upgradescopereadytarget

        violation[{"msg": msg}] {
          requested := input.review.object.metadata.annotations["upgradescope.dev/upgrade-target"]
          name := object.get(input.parameters, "crName", "cluster")
          cr := data.inventory.cluster["upgradescope.dev/v1alpha1"].ClusterReadiness[name]
          fresh(cr)
          entry := cr.status.targets[_]
          entry.target == requested
          entry.ready == false
          msg := sprintf(
            "upgradescope: Kubernetes %v is not ready (score %v, %v blockers, verdict %v). Run `kubectl get ucr %v -o yaml` for the findings.",
            [requested, entry.score, entry.blockers, object.get(entry, "verdict", "not reported"), name],
          )
        }

        # Evaluated recently enough to trust. A missing or unparsable timestamp
        # is not fresh.
        fresh(cr) {
          evaluated := time.parse_rfc3339_ns(cr.status.lastEvaluated)
          max_age := object.get(input.parameters, "maxAgeSeconds", 3600)
          time.now_ns() - evaluated <= max_age * 1000000000
        }
