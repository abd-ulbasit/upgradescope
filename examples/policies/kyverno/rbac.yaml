# Lets Kyverno read the ClusterReadiness the policy looks up. The chart grants
# those verbs to the agent only, so without this the apiCall is forbidden,
# and what Kyverno then does with the rule is not verified (see the README). The aggregate-to labels are Kyverno's: its admission
# controller (live requests) and background controller (the policy report scan
# of existing objects) pick the rules up from here. Read-only.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kyverno:upgradescope-clusterreadiness-reader
  labels:
    rbac.kyverno.io/aggregate-to-admission-controller: "true"
    rbac.kyverno.io/aggregate-to-background-controller: "true"
rules:
  - apiGroups: ["upgradescope.basit.engineer"]
    resources: ["clusterreadinesses"]
    verbs: ["get", "list", "watch"]
