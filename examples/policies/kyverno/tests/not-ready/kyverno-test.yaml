# Case: the agent evaluated recently, 1.37 is not ready (3 blockers) and 1.36
# is. See ../ready for why "fresh" is the year 2200.
apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: not-ready
policies:
  - ../../upgradescope-ready-target.yaml
resources:
  - ../resources.yaml
apiCallResponses:
  - urlPath: /apis/upgradescope.basit.engineer/v1alpha1/clusterreadinesses/cluster
    method: GET
    response:
      body:
        apiVersion: upgradescope.basit.engineer/v1alpha1
        kind: ClusterReadiness
        metadata: {name: cluster}
        status:
          lastEvaluated: "2200-01-01T00:00:00Z"
          targets:
            - {target: "1.36", score: 100, ready: true, verdict: ready, blockers: 0, warnings: 0, infos: 0}
            - {target: "1.37", score: 62, ready: false, verdict: blocked, blockers: 3, warnings: 2, infos: 0}
results:
  # The one violation: a fresh verdict that says not ready.
  - policy: upgradescope-ready-target
    rule: target-is-ready
    kind: Deployment
    resources: [upgrade-to-1-37]
    result: fail
  # The other request names a ready target.
  - policy: upgradescope-ready-target
    rule: target-is-ready
    kind: Deployment
    resources: [upgrade-to-1-36]
    result: pass
