# Run by `make examples-test` (hack/examples-test.sh), or by hand:
#   kyverno test examples/policies/kyverno/tests
#
# The CLI does not call a cluster: apiCallResponses answers the policy's
# apiCall with a ClusterReadiness. "Fresh" below is a lastEvaluated in the year
# 2200: the CLI has no clock to set, so a date that is never in the past
# stands for "just evaluated". A lastEvaluated in the future (clock skew) counts
# as fresh by design: the policy only fails open on data that is too old.
#
# Case: the agent evaluated recently and 1.36 is ready, 1.37 is not.
apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: ready
policies:
  - ../../upgradescope-ready-target.yaml
resources:
  - ../resources.yaml
apiCallResponses:
  - urlPath: /apis/upgradescope.dev/v1alpha1/clusterreadinesses/cluster
    method: GET
    response:
      body:
        apiVersion: upgradescope.dev/v1alpha1
        kind: ClusterReadiness
        metadata: {name: cluster}
        status:
          lastEvaluated: "2200-01-01T00:00:00Z"
          targets:
            - {target: "1.36", score: 100, ready: true, verdict: ready, blockers: 0, warnings: 0, infos: 0}
            - {target: "1.37", score: 62, ready: false, verdict: blocked, blockers: 3, warnings: 2, infos: 0}
results:
  # A ready target is allowed.
  - policy: upgradescope-ready-target
    rule: target-is-ready
    kind: Deployment
    resources: [upgrade-to-1-36]
    result: pass
