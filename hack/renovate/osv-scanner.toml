# Accepted advisories in this directory's package-lock.json: the Renovate
# release whose renovate-config-validator checks examples/renovate (CI's
# examples job, hack/examples-test.sh). It is dev-only and never shipped.
#
# Read by OSV-Scanner (OpenSSF Scorecard's Vulnerabilities check), which
# takes the osv-scanner.toml next to a lockfile, and by
# hack/renovate-audit.sh (make renovate-audit, CI's vuln job), the gate
# that fails on any advisory in the lockfile not listed here, on an entry
# past its ignoreUntil, and on an entry whose package gained a fix the
# lockfile can take without a new Renovate major. Each entry: id, an
# ignoreUntil date (when the reason must be checked again) and the reason.
#
# None is accepted now. The two entries of 2026-10-09, braces
# GHSA-vfj7-8cjw-p6xm and sprintf-js GHSA-hp3w-g68c-fv3c, were removed on
# 2026-10-24: GitHub withdrew both advisories (2026-10-23 and 2026-10-22),
# so npm audit no longer reports them.
