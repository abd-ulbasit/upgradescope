version: 2

# The workflow pins every action to a commit SHA with its release in a
# trailing comment (Homebrew/actions by its calendar tag); Dependabot bumps
# both, weekly, in one PR. The tap holds no other dependency.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: 'ci'
