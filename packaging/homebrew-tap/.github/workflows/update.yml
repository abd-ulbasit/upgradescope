name: update formula

# Keeps Formula/upgradescope.rb on the latest stable upgradescope release
# without any cross-repository secret: upgradescope's release workflow does
# not push here. This workflow pulls instead, every 6 hours and on demand,
# refuses a release older than the formula (a downgrade) or one whose tag
# is not on upgradescope's main, verifies the release's checksums.txt
# against the keyless cosign signature made by upgradescope's release
# workflow for that tag and commit, re-renders the formula from it, and
# commits with this repository's own GITHUB_TOKEN only when the formula
# changed.
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to render (default the latest stable release)
        required: false
        default: ''
      allow-downgrade:
        description: Render a tag older than the formula's version (a deliberate rollback; never on the schedule)
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: update-formula
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # commit the re-rendered formula
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: renderer and updater self-tests (v0.1.1 checksums fixture, offline)
        run: |
          script/render-formula_test.sh
          script/update_test.sh
      - name: verify the latest release and render the formula
        env:
          GH_TOKEN: ${{ github.token }}
          UPGRADESCOPE_TAG: ${{ inputs.tag }}
          UPGRADESCOPE_ALLOW_DOWNGRADE: ${{ inputs.allow-downgrade && '1' || '' }}
        run: |
          [ -n "$UPGRADESCOPE_TAG" ] || unset UPGRADESCOPE_TAG
          script/update.sh
      - name: commit when the formula changed
        env:
          GH_TOKEN: ${{ github.token }}
        # Staged first: the first render is a new file, which a plain git
        # diff does not see (script/render-formula_test.sh runs this step).
        run: |
          git add Formula/upgradescope.rb
          if git diff --cached --quiet -- Formula/upgradescope.rb; then
            echo "Formula/upgradescope.rb is current" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          version="$(sed -n 's#.*/releases/download/v\([^/]*\)/.*#\1#p' Formula/upgradescope.rb | head -1)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "upgradescope $version"
          # The checkout keeps no token; push with this run's token only here.
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${GITHUB_REF_NAME}"
          echo "Formula/upgradescope.rb -> $version" >> "$GITHUB_STEP_SUMMARY"

  # The formula installs and its test passes on both platforms Homebrew
  # supports, after every change.
  test:
    needs: update
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: Homebrew/actions/setup-homebrew@4790763c0a3ba4036f72634dc079c4a7dfcd4878 # 2026.10.19.1
      - name: brew install and test the tap's formula
        env:
          TAP: ${{ github.repository }}
        # setup-homebrew taps this repository at the run's own commit, which
        # predates a formula the update job has just pushed (the first run
        # creates Formula/upgradescope.rb). Move the tap's checkout to the
        # branch as it now stands, so the test is of that formula. The
        # checkout stays where setup-homebrew put it: its post step removes it.
        run: |
          tap="${TAP%%/homebrew-*}/${TAP##*/homebrew-}"
          brew tap "$tap" "https://github.com/${TAP}"
          repo="$(brew --repository "$tap")"
          git -C "$repo" fetch --quiet "https://github.com/${TAP}" "$GITHUB_REF_NAME"
          git -C "$repo" checkout --quiet --force FETCH_HEAD
          brew install "$tap/upgradescope"
          brew test "$tap/upgradescope"
          upgradescope version
