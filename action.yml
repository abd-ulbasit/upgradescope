# The same action is published twice: action.yml at the repository root (so
# `uses: abd-ulbasit/upgradescope@<ref>` works and Marketplace can list it)
# and as action/action.yml (`uses: abd-ulbasit/upgradescope/action@<ref>`,
# the original location). Both only run action/run.sh; hack/action_test.sh
# fails if they differ in anything but where run.sh lives. Inputs reach the
# script through env:, never as ${{ }} inside run: (script injection).
name: upgradescope gate
description: >-
  Gate rendered Kubernetes manifests on upgrade readiness: removed and
  deprecated APIs for a target version, as SARIF, outputs and a step summary.
  Exit code 2 (findings at/above fail-on, or an unknown verdict unless
  allow-incomplete) fails the step.
author: abd-ulbasit

inputs:
  path:
    description: File or directory of rendered manifests to scan (e.g. the output of helm template / kustomize build).
    required: true
  target:
    description: >-
      Target Kubernetes minor version, MAJOR.MINOR, e.g. "1.36". Quote it:
      YAML reads an unquoted 1.30 as the number 1.3, so any target below
      1.16, the oldest minor the knowledge base covers, is refused.
    required: true
  fail-on:
    description: "Fail the gate when findings at/above this severity exist: blocker | warning | never."
    required: false
    default: blocker
  allow-incomplete:
    description: >-
      "true" passes scan --allow-incomplete: the gate then fails on findings
      alone, not on an unknown verdict (a required check, such as
      kb-coverage for a target past the knowledge base's horizon, was not
      assessed). The verdict output still says unknown. "true" or "false";
      needs upgradescope v0.2.0 or later.
    required: false
    default: "false"
  version:
    description: >-
      Which upgradescope to run: a release tag such as v0.2.0, "latest"
      (the newest stable release; GitHub's latest skips prereleases), or
      "preinstalled" (the one already on PATH). Left unset, it is the
      release of the action ref: at a release tag (@vX.Y.Z or
      @vX.Y.Z-rc.N), that release; at a full commit SHA, the release tag
      that points at the commit (git ls-remote), or latest with a warning
      when no release tag does or the lookup fails; at any other ref (a
      branch, @v0), or used from another action, latest.
      For a reproducible gate, pin the action ref (@vX.Y.Z or a commit SHA)
      and a tag here: @v0 and "latest" move with each release.
      The archive is verified against the release's checksums.txt and, with
      verify-provenance, its build provenance. When no archive can be
      downloaded, the step fails and installs nothing; only with
      verify-provenance "false" is it built with `go install` instead (when
      Go is set up), unverified and with a warning.
    required: false
    default: ""
  verify-provenance:
    description: >-
      "true" (the default) also verifies that the downloaded archive was
      built by this repository's release workflow at the release's tag:
      `gh attestation verify` of the archive's build-provenance attestation
      (gh is preinstalled on GitHub-hosted runners), or, without gh 2.49+,
      `cosign verify-blob` of checksums.txt's signature. A failed check, or
      no gh or cosign to run it, fails the step before anything is
      installed, and so does an archive that cannot be downloaded: there
      is no fallback to an unverified source build. v0.1.0 and v0.1.1, the
      releases from before provenance (by name, not by version: every
      other release is verified), are checked against checksums.txt only,
      with a warning; a "latest" that is one of them fails the step when
      the action is at a release tag from v0.2.0-rc.2 on (GitHub's latest
      was moved back). "false" checks the archive against checksums.txt
      only, with a warning, and when no archive downloads falls back to
      `go install` (Go set up), also with a warning. Not used for
      version: preinstalled.
    required: false
    default: "true"
  config:
    description: >-
      Path to an .upgradescope.yaml with ignore rules (scan --config).
      Suppressed findings are not scored and do not fail the gate; the step
      summary lists each with its reason. Unset, scan looks for
      .upgradescope.yaml in path, then at the repository root.
    required: false
    default: ""
  baseline:
    description: >-
      Path to the JSON report of an earlier scan (the report-json output,
      or a write-baseline file; scan --baseline). The gate then fails only
      on findings that are new since; score and verdict still count all.
    required: false
    default: ""
  write-baseline:
    description: >-
      Also write this scan's JSON report (after suppression) to this path,
      for a later baseline (scan --write-baseline).
    required: false
    default: ""

outputs:
  sarif-file:
    description: Path to the SARIF report (upload with github/codeql-action/upload-sarif; complete even when the gate fails; not set when the scan itself failed).
    value: ${{ steps.scan.outputs.sarif-file }}
  report-json:
    description: Path to the JSON report (upgradescope scan --output json).
    value: ${{ steps.scan.outputs.report-json }}
  verdict:
    description: "ready | blocked | unknown (no blockers found, but a required check could not run)."
    value: ${{ steps.scan.outputs.verdict }}
  ready:
    description: '"true" when the verdict is ready, else "false".'
    value: ${{ steps.scan.outputs.ready }}
  score:
    description: Readiness score, 0-100.
    value: ${{ steps.scan.outputs.score }}
  blockers:
    description: Number of blocker findings.
    value: ${{ steps.scan.outputs.blockers }}
  warnings:
    description: Number of warning findings.
    value: ${{ steps.scan.outputs.warnings }}
  new-blockers:
    description: Blocker findings not in the baseline, the ones the gate counts (equals blockers without a baseline).
    value: ${{ steps.scan.outputs.new-blockers }}
  new-warnings:
    description: Warning findings not in the baseline (equals warnings without a baseline).
    value: ${{ steps.scan.outputs.new-warnings }}
  suppressed:
    description: Number of findings suppressed by ignore rules or annotations (not counted in blockers or warnings).
    value: ${{ steps.scan.outputs.suppressed }}
  summary-file:
    description: Path to the Markdown summary, the same text as the step summary (e.g. for a pull request comment).
    value: ${{ steps.scan.outputs.summary-file }}

runs:
  using: composite
  steps:
    - name: Install upgradescope
      shell: bash
      env:
        INPUT_PATH: ${{ inputs.path }}
        INPUT_TARGET: ${{ inputs.target }}
        INPUT_FAIL_ON: ${{ inputs.fail-on }}
        INPUT_ALLOW_INCOMPLETE: ${{ inputs.allow-incomplete }}
        INPUT_VERSION: ${{ inputs.version }}
        INPUT_CONFIG: ${{ inputs.config }}
        INPUT_BASELINE: ${{ inputs.baseline }}
        INPUT_WRITE_BASELINE: ${{ inputs.write-baseline }}
        INPUT_VERIFY_PROVENANCE: ${{ inputs.verify-provenance }}
        ACTION_REF: ${{ github.action_ref }}
        ACTION_REPOSITORY: ${{ github.action_repository }}
        # gh attestation verify reads this repository's public
        # attestations through the GitHub API with it; no permission
        # beyond the default read of public data is needed.
        GH_TOKEN: ${{ github.token }}
      run: bash "$GITHUB_ACTION_PATH/action/run.sh" install

    - name: Scan manifests
      id: scan
      shell: bash
      env:
        INPUT_PATH: ${{ inputs.path }}
        INPUT_TARGET: ${{ inputs.target }}
        INPUT_FAIL_ON: ${{ inputs.fail-on }}
        INPUT_ALLOW_INCOMPLETE: ${{ inputs.allow-incomplete }}
        INPUT_VERSION: ${{ inputs.version }}
        INPUT_CONFIG: ${{ inputs.config }}
        INPUT_BASELINE: ${{ inputs.baseline }}
        INPUT_WRITE_BASELINE: ${{ inputs.write-baseline }}
        INPUT_VERIFY_PROVENANCE: ${{ inputs.verify-provenance }}
      run: bash "$GITHUB_ACTION_PATH/action/run.sh" scan

branding:
  icon: arrow-up-circle
  color: blue
